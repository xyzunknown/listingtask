// ─── Working days helper ──────────────────────────────────────────────────────
function workingDaysUntil(isoDate) {
  if (!isoDate) return 999;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(isoDate); target.setHours(0,0,0,0);
  if (target <= today) return -1;
  let count = 0; const cur = new Date(today);
  while (cur < target) {
    cur.setDate(cur.getDate()+1);
    const d = cur.getDay();
    if (d!==0 && d!==6) count++;
  }
  return count;
}

// ─── Detail Panel ─────────────────────────────────────────────────────────────
function DetailPanel({ record, onClose, onUpdate, onOpenFull, onCopy, scrollToPhase }) {
  const checklist = useMemo(()=>buildChecklist(record.site,record.product,record.tokenType,{stableHub:record.stableHub,launchpool:record.launchpool}),[record]);
  const [collapsedPhases, setCollapsedPhases] = useState({});
  const [editingStepNote, setEditingStepNote] = useState(null);
  const [stepNoteVal, setStepNoteVal] = useState('');
  const [showCopyMenu, setShowCopyMenu] = useState(false);
  const [showAnnPanel, setShowAnnPanel] = useState(false);
  const phaseRefs = React.useRef({});

  // Scroll to phase when triggered from table
  useEffect(()=>{
    if (!scrollToPhase) return;
    setCollapsedPhases(prev=>({...prev,[scrollToPhase]:false}));
    setTimeout(()=>{
      const el = phaseRefs.current[scrollToPhase];
      if (el) el.scrollIntoView({behavior:'smooth',block:'start'});
    }, 80);
  },[scrollToPhase]);

  const checked   = record.checked   || {};
  const naSteps   = record.naSteps   || {};
  const stepNotes = record.stepNotes || {};
  const total = checklist.length;
  const done  = countDone(checked, naSteps);
  const pct   = total ? Math.round(done/total*100) : 0;
  const isCancelled = !!record.cancelled;

  const toggle = (idx) => {
    const nowDone = !checked[idx];
    const newChecked = {...checked, [idx]: nowDone};
    const newNA = nowDone ? {...naSteps, [idx]:false} : naSteps;
    onUpdate({...record, checked:newChecked, naSteps:newNA, updatedAt:new Date().toISOString()});
  };
  const toggleApproval = (inputKey, name, approvers, stepIdx) => {
    const allAppr = record.approvals || {};
    const cur = {...(allAppr[inputKey] || {})};
    if (cur[name]) delete cur[name]; else cur[name] = new Date().toISOString();
    const allSigned = approvers.every(n => cur[n]);
    onUpdate({...record, approvals:{...allAppr,[inputKey]:cur}, checked:{...checked,[stepIdx]:allSigned}, updatedAt:new Date().toISOString()});
  };
  const toggleNA = (idx) => {
    const nowNA = !naSteps[idx];
    const newNA = {...naSteps, [idx]: nowNA};
    const newChecked = nowNA ? {...checked, [idx]:false} : checked;
    onUpdate({...record, naSteps:newNA, checked:newChecked, updatedAt:new Date().toISOString()});
  };
  const saveStepNote = (idx) => {
    onUpdate({...record, stepNotes:{...stepNotes,[idx]:stepNoteVal.trim()}, updatedAt:new Date().toISOString()});
    setEditingStepNote(null);
  };
  const stepFields = record.stepFields || {};
  const setStepField = (inputKey, value, stepIdx) => {
    const newFields = {...stepFields, [inputKey]: value};
    const newChecked = {...checked, [stepIdx]: !!value};
    onUpdate({...record, stepFields:newFields, checked:newChecked, updatedAt:new Date().toISOString()});
  };

  // Group by phase
  const phases = [];
  let curPh = null;
  checklist.forEach((step,i)=>{
    if (!curPh || curPh.name!==step.phase) { curPh={name:step.phase,tag:step.tag,steps:[]}; phases.push(curPh); }
    curPh.steps.push({...step,idx:i});
  });

  const SSITE = {HK:{bg:'#A8D8F0',color:'#2D2D2D'},Global:{bg:'#7ECDC0',color:'#2D2D2D'},ID:{bg:'#D4A5E8',color:'#2D2D2D'},SG:{bg:'#A8E6CF',color:'#2D2D2D'}};
  const ss = SSITE[record.site]||{bg:'#F5F0E6',color:'#2D2D2D'};
  const siteInfo = SITES.find(s=>s.id===record.site);

  return (
    <div style={{width:400,flexShrink:0,borderLeft:'2px solid #2D2D2D',display:'flex',flexDirection:'column',background:'white',overflow:'hidden'}}>
      <style>{`@keyframes slideInPanel{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}.panel-step:hover{background:#FDE68A!important}`}</style>

      {/* Announcement overlay from panel */}
      {showAnnPanel && record.annFields && (
        record.annFields.annType==='GlobalOTC'
          ? <AnnouncementViewGlobal record={record} onClose={()=>setShowAnnPanel(false)} onUpdate={onUpdate}/>
          : <AnnouncementView record={record} onClose={()=>setShowAnnPanel(false)} onUpdate={onUpdate}/>
      )}

      {/* Header */}
      <div style={{padding:'12px 14px 10px',borderBottom:'2px solid #2D2D2D',flexShrink:0,background:ss.bg}}>
        <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:5}}>
          <div style={{flex:1,fontWeight:700,fontSize:15,color:ss.color,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}
            title={record.tokenName}>{record.tokenName}</div>
          {/* Copy button + menu */}
          {onCopy && (
            <div style={{position:'relative'}}>
              <button onClick={()=>setShowCopyMenu(v=>!v)} title="复制到其他站点"
                style={{background:'rgba(0,0,0,0.08)',border:'none',borderRadius:12,padding:'3px 8px',cursor:'pointer',fontSize:11,color:ss.color,fontWeight:700,whiteSpace:'nowrap'}}>
                📋
              </button>
              {showCopyMenu && (
                <div style={{position:'absolute',top:'calc(100% + 4px)',right:0,zIndex:300,background:'white',
                  border:'2px solid #2D2D2D',borderRadius:20,boxShadow:'6px 6px 0 #2D2D2D',minWidth:170}}
                  onClick={e=>e.stopPropagation()}>
                  <div style={{padding:'8px 12px 5px',fontSize:11,color:'#6B6B6B',fontWeight:700}}>复制到站点</div>
                  {SITES.filter(s=>s.id!==record.site).map(s=>(
                    <div key={s.id} onClick={()=>{onCopy(record,s.id);setShowCopyMenu(false);}}
                      style={{padding:'8px 14px',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',gap:8,color:'#2D2D2D'}}
                      onMouseEnter={e=>e.currentTarget.style.background='#F5F0E6'}
                      onMouseLeave={e=>e.currentTarget.style.background='white'}>
                      <span>{s.icon}</span><span>{s.label}</span>
                    </div>
                  ))}
                  <div onClick={()=>{onCopy(record,record.site);setShowCopyMenu(false);}}
                    style={{padding:'8px 14px',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',gap:8,
                      color:'#2D2D2D',borderTop:'2px solid #2D2D2D'}}
                    onMouseEnter={e=>e.currentTarget.style.background='#F5F0E6'}
                    onMouseLeave={e=>e.currentTarget.style.background='white'}>
                    <span>📋</span><span>复制到同站点</span>
                  </div>
                </div>
              )}
            </div>
          )}
          {record.annFields && (
            <button onClick={()=>setShowAnnPanel(true)} title="查看三语公告"
              style={{background:'rgba(0,0,0,0.08)',border:'none',borderRadius:12,padding:'3px 8px',cursor:'pointer',fontSize:11,color:ss.color,fontWeight:700,whiteSpace:'nowrap'}}>
              📢 公告
            </button>
          )}
          <button onClick={()=>onOpenFull(record.id)} title="打开完整视图"
            style={{background:'rgba(0,0,0,0.08)',border:'none',borderRadius:12,padding:'3px 8px',cursor:'pointer',fontSize:11,color:ss.color,fontWeight:700,whiteSpace:'nowrap'}}>
            ↗ 完整
          </button>
          <button onClick={onClose}
            style={{background:'rgba(0,0,0,0.08)',border:'none',borderRadius:12,padding:'3px 8px',cursor:'pointer',fontSize:14,color:ss.color,fontWeight:700,lineHeight:1}}>
            ✕
          </button>
        </div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{background:'#FFFFFF',color:ss.color,fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:99}}>
            {siteInfo?.icon} {record.site}
          </span>
          <span style={{background:'#FFFFFF',color:'#2D2D2D',fontSize:11,fontWeight:600,padding:'2px 8px',borderRadius:99}}>
            {record.product}{record.stableHub?' +SH':''}{record.launchpool?' +LP':''}
          </span>
          {isCancelled && <span style={{background:'rgba(0,0,0,0.1)',color:'#6B6B6B',fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:99}}>已取消</span>}
        </div>
      </div>

      {/* Progress */}
      <div style={{padding:'9px 14px',borderBottom:'2px solid #2D2D2D',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
          <div style={{flex:1,background:'#F5F0E6',borderRadius:99,height:6,overflow:'hidden'}}>
            <div style={{width:`${pct}%`,height:'100%',background:pct===100? 'white' :C.blue,borderRadius:99,transition:'width 0.3s'}}/>
          </div>
          <span style={{fontSize:12,fontWeight:700,color:pct===100?'#2D2D2D':C.navy,whiteSpace:'nowrap'}}>{done}/{total}</span>
          <span style={{fontSize:11,color:'#6B6B6B'}}>{pct}%</span>
        </div>
        {record.blocker && (
          <div style={{background:'#FDE68A',borderRadius:12,padding:'4px 9px',fontSize:11,color:'#2D2D2D'}}>🚧 {record.blocker}</div>
        )}
      </div>

      {/* Phase steps - scrollable */}
      <div style={{flex:1,overflowY:'auto',padding:'4px 0',animation:'slideInPanel 0.18s ease'}}>
        {phases.map(ph=>{
          const phDone = ph.steps.filter(s=>checked[s.idx]||naSteps[s.idx]).length;
          const phColor = PHASE_COLORS[ph.tag]||{border:'#6B6B6B',bg:'#FFFFFF',label:ph.name};
          const isCollapsed = !!collapsedPhases[ph.tag];
          return (
            <div key={ph.name} ref={el=>phaseRefs.current[ph.tag]=el}>
              {/* Phase header */}
              <div onClick={()=>setCollapsedPhases(prev=>({...prev,[ph.tag]:!prev[ph.tag]}))}
                style={{display:'flex',alignItems:'center',gap:8,padding:'5px 12px',cursor:'pointer',
                  background:phColor.bg,borderLeft:`3px solid ${phColor.border}`,userSelect:'none'}}>
                <span style={{fontSize:11,fontWeight:700,color:phColor.border,flex:1}}>{ph.name}</span>
                <span style={{fontSize:11,color:phDone===ph.steps.length&&ph.steps.length>0?'#2D2D2D':phColor.border,fontWeight:600}}>{phDone}/{ph.steps.length}</span>
                <span style={{fontSize:9,color:phColor.border,opacity:0.7}}>{isCollapsed?'▶':'▼'}</span>
              </div>
              {/* Steps */}
              {!isCollapsed && ph.steps.map(step=>{
                const isDone  = !!checked[step.idx];
                const isNA    = !!naSteps[step.idx];
                const hasNote = !!stepNotes[step.idx];
                const isEditN = editingStepNote===step.idx;
                const fieldVal = step.inputKey ? (stepFields[step.inputKey]||'') : '';
                return (
                  <div key={step.idx} className="panel-step"
                    style={{borderBottom:'2px solid #2D2D2D',background:isDone?'#A8E6CF':isNA?'#FFFFFF':'white',opacity:isCancelled?0.6:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:7,padding:'6px 12px'}}>
                      {/* Done checkbox */}
                      <div onClick={()=>{ if(isCancelled)return; if(step.inputType==='approval')return; toggle(step.idx); }}
                        style={{width:17,height:17,borderRadius:12,flexShrink:0,cursor:isCancelled||step.inputType==='approval'?'default':'pointer',
                          border:isDone?'none':'2px solid #2D2D2D',background:isDone?'#A8E6CF':'white',
                          display:'flex',alignItems:'center',justifyContent:'center'}}>
                        {isDone && <span style={{color:'#2D2D2D',fontSize:10,lineHeight:1}}>✓</span>}
                      </div>
                      {/* Task */}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,color:isDone?'#6B6B6B':isNA?'#6B6B6B':'#2D2D2D',
                          textDecoration:isNA?'line-through':'none',
                          fontWeight:step.critical&&!isDone&&!isNA?600:400,
                          lineHeight:'1.35', marginBottom: step.inputType?3:0}}
                          title={step.task}>
                          {step.critical&&!isDone&&!isNA&&<span style={{color:'#2D2D2D',marginRight:3}}>*</span>}
                          {step.task}
                        </div>
                        {/* Text input field */}
                        {step.inputType==='text' && !isNA && (
                          <input value={fieldVal}
                            onChange={e=>!isCancelled&&setStepField(step.inputKey,e.target.value,step.idx)}
                            onClick={e=>e.stopPropagation()}
                            placeholder={`输入${step.task}…`}
                            style={{width:'100%',fontSize:11,border:'2px solid #2D2D2D',
                              borderRadius:12,padding:'3px 8px',outline:'none',fontFamily:'inherit',
                              boxSizing:'border-box',background:fieldVal?'#A8E6CF':'white',color:'#2D2D2D'}}/>
                        )}
                        {/* Select field */}
                        {step.inputType==='select' && !isNA && (
                          <div style={{display:'flex',gap:3,flexWrap:'wrap',marginTop:2}}>
                            {(step.inputOptions||[]).map(opt=>(
                              <button key={opt} onClick={e=>{e.stopPropagation();!isCancelled&&setStepField(step.inputKey,fieldVal===opt?'':opt,step.idx);}}
                                style={{fontSize:10,padding:'2px 8px',borderRadius:12,cursor:isCancelled?'default':'pointer',
                                  background:fieldVal===opt?'#FDE68A':step.inputType?'#F5F0E6':'#F5F0E6',
                                  color:'#2D2D2D',
                                  border:fieldVal===opt?'none':'2px solid #2D2D2D',
                                  fontWeight:fieldVal===opt?700:400}}>{opt}</button>
                            ))}
                          </div>
                        )}
                        {/* Approval sign-off (compact) */}
                        {step.inputType==='approval' && !isNA && (()=>{
                          const signed = (record.approvals||{})[step.inputKey] || {};
                          const approvers = step.inputOptions||[];
                          const nSigned = approvers.filter(n=>signed[n]).length;
                          return (
                            <div style={{marginTop:3}} onClick={e=>e.stopPropagation()}>
                              <div style={{fontSize:10,fontWeight:700,color:'#2D2D2D',marginBottom:3}}>会签 {nSigned}/{approvers.length}{nSigned===approvers.length?' 🔓已通过':''}</div>
                              <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                                {approvers.map(name=>{
                                  const at=signed[name];
                                  return (
                                    <button key={name} onClick={()=>!isCancelled&&toggleApproval(step.inputKey,name,approvers,step.idx)}
                                      title={at?('已签字：'+new Date(at).toLocaleString('zh-CN')):'点击签字'}
                                      style={{fontSize:10,padding:'2px 7px',borderRadius:99,cursor:isCancelled?'default':'pointer',
                                        border:`${(at) ? '3px' : '2px'} solid #2D2D2D`,background:at?'#A8E6CF':'white',
                                        color:'#2D2D2D',fontWeight:at?700:400}}>
                                      {at?'✅':'⭕'} {name}
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })()}
                        {step.owner&&!step.inputType&&<div style={{fontSize:10,color:'#6B6B6B',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{step.owner}</div>}
                      </div>
                      {/* N/A */}
                      <button onClick={e=>{e.stopPropagation();!isCancelled&&toggleNA(step.idx);}}
                        style={{background:isNA?'#F5F0E6':'transparent',border:isNA?'none':'2px solid #2D2D2D',
                          borderRadius:12,padding:'2px 5px',fontSize:10,cursor:isCancelled?'default':'pointer',
                          color:isNA?'#2D2D2D':'#6B6B6B',fontWeight:isNA?700:400,flexShrink:0}}>
                        N/A
                      </button>
                      {/* Note */}
                      <button onClick={e=>{e.stopPropagation();setEditingStepNote(isEditN?null:step.idx);setStepNoteVal(stepNotes[step.idx]||'');}}
                        style={{background:hasNote?'#FDE68A':'transparent',border:hasNote?'2px solid #2D2D2D':'2px solid #2D2D2D',
                          borderRadius:12,padding:'2px 5px',fontSize:10,cursor:'pointer',
                          color:hasNote?'#2D2D2D':'#6B6B6B',flexShrink:0}}>
                        📝
                      </button>
                    </div>
                    {/* Note editor */}
                    {isEditN && (
                      <div style={{padding:'4px 14px 8px 38px',background:'#FDE68A'}}>
                        <input autoFocus value={stepNoteVal} onChange={e=>setStepNoteVal(e.target.value)}
                          onKeyDown={e=>{if(e.key==='Enter')saveStepNote(step.idx);if(e.key==='Escape')setEditingStepNote(null);}}
                          placeholder="添加备注..."
                          style={{width:'100%',fontSize:11,border:'2px solid #2D2D2D',borderRadius:12,padding:'4px 8px',outline:'none',fontFamily:'inherit',boxSizing:'border-box'}}/>
                        <div style={{display:'flex',gap:4,marginTop:4}}>
                          <button onClick={()=>saveStepNote(step.idx)} style={{background:'#FDE68A',color:'#2D2D2D',border:'3px solid #2D2D2D',borderRadius:12,padding:'3px 10px',fontSize:11,cursor:'pointer',fontWeight:600, boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
                          <button onClick={()=>setEditingStepNote(null)} style={{background:'none',border:'2px solid #2D2D2D',borderRadius:12,padding:'3px 8px',fontSize:11,cursor:'pointer',color:'#6B6B6B'}}>取消</button>
                        </div>
                      </div>
                    )}
                    {/* Saved note */}
                    {!isEditN&&hasNote&&(
                      <div style={{padding:'2px 14px 5px 38px',fontSize:10,color:'#2D2D2D',background:'#FDE68A'}}>📌 {stepNotes[step.idx]}</div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function OverviewTable({ records, onOpen, onUpdate, onNew, onImport, onDelete, onRestore, onCopy, siteFilter }) {

  const SITE_OPTIONS = [

    {id:'ID',     label:'OSL ID',    icon:'🇮🇩', bg:'#D4A5E8', color:'#2D2D2D'},

    in_progress: { bg:'#FDE68A', color:'#2D2D2D', label:'进行中' },
    not_started: { bg:'#F5F0E6', color:'#6B6B6B', label:'未开始' },
    completed:   { bg:'#A8E6CF', color:'#2D2D2D', label:'已完成' },
    cancelled:   { bg:'#F5F0E6', color:'#6B6B6B', label:'已取消' },
  };
  const SITE_S = { HK:{bg:'#A8D8F0',color:'#2D2D2D'}, Global:{bg:'#7ECDC0',color:'#2D2D2D'}, ID:{bg:'#D4A5E8',color:'#2D2D2D'}, SG:{bg:'#A8E6CF',color:'#2D2D2D'} };
  const USER_TYPES = ['PI（专业投资者）','零售 Retail','两者','不适用'];

  const save = (r, patch) => onUpdate({...r, ...patch, updatedAt:new Date().toISOString()});
  const stopEdit = () => setEditingCell(null);

  const STATUS_RANK = { in_progress:0, not_started:1, completed:2, cancelled:3 };
  const allRows = records
    .filter(r => !siteFilter || r.site===siteFilter)
    .filter(r => {
      if (!tableSearch) return true;
      const q = tableSearch.toLowerCase();
      return (r.tokenName||'').toLowerCase().includes(q)
          || (r.tokenSymbol||'').toLowerCase().includes(q)
          || (r.blocker||'').toLowerCase().includes(q)
          || (r.chainRaw||'').toLowerCase().includes(q);
    })
    .filter(r => {
      if (statusFilt==='all') return true;
      const cl = buildChecklist(r.site,r.product,r.tokenType,{stableHub:r.stableHub,launchpool:r.launchpool});
      return getRecordStatus(r,cl.length)===statusFilt;
    })
    .sort((a,b) => {
      const clA = buildChecklist(a.site,a.product,a.tokenType,{stableHub:a.stableHub,launchpool:a.launchpool});
      const clB = buildChecklist(b.site,b.product,b.tokenType,{stableHub:b.stableHub,launchpool:b.launchpool});
      const rA = STATUS_RANK[getRecordStatus(a,clA.length)]??99;
      const rB = STATUS_RANK[getRecordStatus(b,clB.length)]??99;
      if (rA !== rB) return rA - rB;
      // Within same status: sort by expectedLaunchTime asc (nulls last)
      const ta = a.expectedLaunchTime ? new Date(a.expectedLaunchTime) : null;
      const tb = b.expectedLaunchTime ? new Date(b.expectedLaunchTime) : null;
      if (ta && tb) return ta - tb;
      if (ta) return -1;
      if (tb) return 1;
      return new Date(b.updatedAt)-new Date(a.updatedAt);
    });

  // Split into upcoming (≤7 working days, not completed/cancelled) and rest
  const upcoming = allRows.filter(r => {
    const st = getRecordStatus(r, buildChecklist(r.site,r.product,r.tokenType,{stableHub:r.stableHub,launchpool:r.launchpool}).length);
    if (st==='completed'||st==='cancelled') return false;
    return workingDaysUntil(r.expectedLaunchTime) >= 0 && workingDaysUntil(r.expectedLaunchTime) <= 7;
  });
  const rest = allRows.filter(r => !upcoming.find(u=>u.id===r.id));

    { key:'pre',        label:'前置', phaseName:'前置确认' },

      </td>

  const RowRender = ({r, idx, isUpcoming}) => {

              ? <div style={{display:'flex',gap:3,flexWrap:'nowrap',overflow:'hidden'}}>
                  {(r.quoteCurrencies||[]).slice(0,3).map((q,i)=>(
                    <span key={i} style={{background:'#A8D8F0',color:'#2D2D2D',fontSize:11,fontWeight:600,padding:'1px 6px',borderRadius:99,whiteSpace:'nowrap'}}>{q}</span>
                  ))}
                  {(r.quoteCurrencies||[]).length>3 && <span style={{fontSize:11,color:'#6B6B6B'}}>+{(r.quoteCurrencies||[]).length-3}</span>}
                </div>
              : <span style={{color:'#6B6B6B',fontSize:12,fontStyle:'italic'}}>—</span>
          }
        </CellEdit>
        {/* 站点 — dropdown */}
        {!siteFilter && (
          <CellEdit r={r} field="site">
            <span style={{background:siteS.bg,color:siteS.color,fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:99,whiteSpace:'nowrap'}}>
              {siteInfo?.icon} {r.site}
            </span>
          </CellEdit>
        )}
        {/* 交易类型 — searchable dropdown */}
        <CellEdit r={r} field="productDisplay">
          <span style={{background:'#F5F0E6',color:'#2D2D2D',fontSize:11,fontWeight:600,padding:'2px 8px',borderRadius:99,whiteSpace:'nowrap'}}>
            {r.productDisplay||r.product}{r.stableHub?' +SH':''}{r.launchpool?' +LP':''}
          </span>
        </CellEdit>
        {/* 用户类型 */}
        <CellEdit r={r} field="userType">
          <span style={{fontSize:12, color:'#6B6B6B', whiteSpace:'nowrap'}}>{r.userType||'—'}</span>
        </CellEdit>
        {/* 预计上线时间 */}
        <CellEdit r={r} field="expectedLaunchTime">
          {r.expectedLaunchTime
            ? <span style={{fontSize:12, color:'#2D2D2D', fontWeight:600, whiteSpace:'nowrap'}}>
                {fmtLaunchTime(r.expectedLaunchTime)}
                {isUpcoming && <span style={{marginLeft:5, fontSize:10, opacity:.8}}>{wdays===0?'今天':wdays===1?'明天':`${wdays}天`}</span>}
              </span>
            : <span style={{fontSize:12, color:'#6B6B6B', fontStyle:'italic'}}>—</span>
          }
        </CellEdit>
        {/* 进度 */}
        <td style={{padding:'7px 9px'}}>
          <div style={{display:'flex', alignItems:'center', gap:5, cursor:'pointer'}} onClick={()=>setPanelId(isSelected?null:r.id)}>
            <div style={{width:36, background:'#F5F0E6', borderRadius:99, height:4, overflow:'hidden', flexShrink:0}}>
              <div style={{width:`${pct}%`, height:'100%', background:pct===100? 'white' :C.blue, borderRadius:99, transition:'width .3s'}}/>
            </div>
            <span style={{fontSize:11, color:'#6B6B6B', whiteSpace:'nowrap'}}>{done}/{cl.length}</span>
          </div>
        </td>
        {/* 阶段进度 — 仅分站点视图 */}
        {siteFilter && PHASE_COLS.map(p => {
          const ps = cl.map((step,i)=>({...step,idx:i})).filter(s=>s.phase===p.phaseName);
          if (ps.length===0) return <td key={p.key} style={{padding:'5px 4px', textAlign:'center'}}><span style={{color:'#2D2D2D',fontSize:11}}>—</span></td>;
          const phDone = ps.filter(s=>(r.checked||{})[s.idx]||(r.naSteps||{})[s.idx]).length;
          const allDone = phDone===ps.length;
          const someDone = phDone>0;
          const PHASE_BG = {pre:allDone?'#A8E6CF':someDone?'#FDE68A':'#F5F0E6',bd:allDone?'#A8E6CF':someDone?'#A8D8F0':'#F5F0E6',compliance:allDone?'#A8E6CF':someDone?'#D4A5E8':'#F5F0E6',exec:allDone?'#A8E6CF':someDone?'#A8E6CF':'#F5F0E6',launch:allDone?'#A8E6CF':someDone?'#D4A5E8':'#F5F0E6'};
          const PHASE_C  = {pre:allDone?'#2D2D2D':someDone?'#2D2D2D':'#6B6B6B',bd:allDone?'#2D2D2D':someDone?'#2D2D2D':'#6B6B6B',compliance:allDone?'#2D2D2D':someDone?'#2D2D2D':'#6B6B6B',exec:allDone?'#2D2D2D':someDone?'#2D2D2D':'#6B6B6B',launch:allDone?'#2D2D2D':someDone?'#2D2D2D':'#6B6B6B'};
          return (
            <td key={p.key} style={{padding:'5px 4px', textAlign:'center'}}
              onClick={e=>{e.stopPropagation();if(isSelected&&panelPhase===p.key){setPanelId(null);setPanelPhase(null);}else{setPanelId(r.id);setPanelPhase(p.key);}}}>
              <div style={{display:'inline-flex',flexDirection:'column',alignItems:'center',gap:2,cursor:'pointer'}}>
                <div style={{width:28,height:4,borderRadius:99,background:PHASE_BG[p.key],border:`1px solid ${PHASE_C[p.key]}30`,overflow:'hidden'}}>
                  <div style={{width:`${ps.length?phDone/ps.length*100:0}%`,height:'100%',background:PHASE_C[p.key],borderRadius:99}}/>
                </div>
                <span style={{fontSize:9,color:PHASE_C[p.key],fontWeight:600,lineHeight:1}}>{phDone}/{ps.length}</span>
              </div>
            </td>
          );
        })}
      </tr>
    );
  };

  // Export to Excel
  const exportExcel = () => {
    const PHASE_NAMES = [
      {key:'pre',phaseName:'前置确认'},{key:'bd',phaseName:'业务评估'},
      {key:'compliance',phaseName:'合规/VAAP'},{key:'exec',phaseName:'执行配置'},{key:'launch',phaseName:'正式上线'},
    ];
    const headers = ['#','代币名称','站点','产品类型','状态','进度%','完成/总计','预计上线时间','备注/卡点','区块链','前置','BD','合规','执行','上线'];
    const rows = records.filter(r=>!siteFilter||r.site===siteFilter).map((r,i)=>{
      const cl = buildChecklist(r.site,r.product,r.tokenType,{stableHub:r.stableHub,launchpool:r.launchpool});
      const done = countDone(r.checked,r.naSteps);
      const status = getRecordStatus(r,cl.length);
      const statusLabel = {not_started:'未开始',in_progress:'进行中',completed:'已完成',cancelled:'已取消'}[status]||status;
      const phases = PHASE_NAMES.map(p=>{
        const ps = cl.map((s,idx)=>({...s,idx})).filter(s=>s.phase===p.phaseName);
        if (!ps.length) return 'N/A';
        const pd = ps.filter(s=>(r.checked||{})[s.idx]||(r.naSteps||{})[s.idx]).length;
        return `${pd}/${ps.length}`;
      });
      return [
        i+1, r.tokenName||r.tokenSymbol||'', r.site,
        r.product+(r.stableHub?' +SH':'')+(r.launchpool?' +LP':''),
        statusLabel,
        cl.length?`${Math.round(done/cl.length*100)}%`:'0%',
        `${done}/${cl.length}`,
        r.expectedLaunchTime?new Date(r.expectedLaunchTime).toLocaleString('zh-CN'):'',
        r.blocker||'',
        r.chainRaw||(r.chainLabels||[]).join('/')||'',
        ...phases,
      ];
    });
    const ws = XLSX.utils.aoa_to_sheet([headers,...rows]);
    ws['!cols'] = [4,14,8,12,7,6,8,14,20,10,6,6,6,6,6].map(w=>({wch:w}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '上币进度');
    XLSX.writeFile(wb, `OSL上币进度_${toLocalDateStr(new Date())}.xlsx`);
  };

  // Close dropdown on outside click
  useEffect(()=>{
    const handler = ()=>setEditingCell(null);
    document.addEventListener('click', handler);
    return ()=>document.removeEventListener('click', handler);
  },[]);

  const STATUS_CHIPS = [
    {key:'all', label:'全部', color:'#2D2D2D', bg:'#F5F0E6'},
    {key:'in_progress', label:'进行中', color:'#2D2D2D', bg:'#FDE68A'},
    {key:'not_started', label:'未开始', color:'#6B6B6B', bg:'#FFFFFF'},
    {key:'completed',   label:'已完成', color:'#2D2D2D', bg:'#A8E6CF'},
    {key:'cancelled',   label:'已取消', color:'#6B6B6B', bg:'#F5F0E6'},
  ];

  return (
    <div style={{display:'flex', flexDirection:'row', height:'100%'}} onClick={()=>setEditingCell(null)}>
      {/* Left: toolbar + table */}
      <div style={{display:'flex', flexDirection:'column', flex:1, minWidth:0, overflow:'hidden'}}>
        {/* Toolbar */}
        <div style={{borderBottom:'2px solid #2D2D2D', background:'white', flexShrink:0}}>
          {/* Top row */}
          <div style={{display:'flex', alignItems:'center', gap:8, padding:'9px 16px'}}>
            <div style={{fontWeight:700, fontSize:14, color:'#2D2D2D'}}>上币进度</div>
            <span style={{fontSize:11, color:'#6B6B6B', marginRight:'auto'}}>
              {allRows.length < records.filter(r=>!siteFilter||r.site===siteFilter).length
                ? `${allRows.length} / ${records.filter(r=>!siteFilter||r.site===siteFilter).length} 条`
                : `${allRows.length} 条记录`}
            </span>
            <button onClick={exportExcel}
              style={{background:'white',color:'#2D2D2D',border:'2px solid #2D2D2D',borderRadius:14,padding:'5px 11px',fontSize:12,fontWeight:600,cursor:'pointer'}}>
              📤 导出
            </button>
            <button onClick={()=>{const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls';i.onchange=e=>onImport(e.target.files[0]);i.click();}}
              style={{background:'white',color:'#2D2D2D',border:'2px solid #2D2D2D',borderRadius:14,padding:'5px 11px',fontSize:12,fontWeight:600,cursor:'pointer'}}>
              📥 导入
            </button>
            <button onClick={()=>onNew()}
              style={{background:'#FDE68A',color:'#2D2D2D',border:'3px solid #2D2D2D',borderRadius:14,padding:'5px 13px',fontSize:12,fontWeight:700,cursor:'pointer', boxShadow:'3px 3px 0 #2D2D2D'}}>
              + 添加记录
            </button>
          </div>
          {/* Search + filter row */}
          <div style={{display:'flex', alignItems:'center', gap:8, padding:'0 16px 9px', flexWrap:'wrap'}}>
            <div style={{position:'relative', flexShrink:0}}>
              <span style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',fontSize:13,color:'#6B6B6B',pointerEvents:'none'}}>🔍</span>
              <input value={tableSearch} onChange={e=>setTableSearch(e.target.value)}
                placeholder="搜索代币名称..."
                style={{fontSize:12,border:'2px solid #2D2D2D',borderRadius:14,padding:'5px 10px 5px 28px',
                  outline:'none',width:160,fontFamily:'inherit',background:tableSearch?'#A8D8F0': 'white'}}/>
              {tableSearch && <span onClick={()=>setTableSearch('')}
                style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',cursor:'pointer',fontSize:12,color:'#6B6B6B'}}>✕</span>}
            </div>
            <div style={{display:'flex', gap:4}}>
              {STATUS_CHIPS.map(chip=>(
                <button key={chip.key} onClick={()=>setStatusFilt(chip.key)}
                  style={{fontSize:11,padding:'3px 10px',borderRadius:99,cursor:'pointer',fontWeight:statusFilt===chip.key?700:500,
                    background:statusFilt===chip.key?chip.bg:'transparent',
                    color:statusFilt===chip.key?chip.color:'#6B6B6B',
                    border:`${(statusFilt===chip.key) ? '3px' : '2px'} solid #2D2D2D`}}>
                  {chip.label}
                </button>
              ))}
            </div>
          </div>
        </div>
        {/* Table */}
        <div style={{flex:1, overflow:'auto'}} onClick={e=>e.stopPropagation()}>
          <style>{`.edit-icon{opacity:0}.hover-row:hover .edit-icon{opacity:1}`}</style>
          <table style={{width:'100%', borderCollapse:'collapse', fontSize:13, tableLayout:'fixed'}}>
            <colgroup>
              <col style={{width:36}}/><col style={{width:140}}/><col style={{width:130}}/><col style={{width:80}}/>
              <col style={{width:74}}/><col style={{width:110}}/>
              {!siteFilter && <col style={{width:72}}/>}
              <col style={{width:80}}/><col style={{width:72}}/><col style={{width:95}}/><col style={{width:58}}/>
              {siteFilter && PHASE_COLS.map(p=><col key={p.key} style={{width:42}}/>)}
            </colgroup>
            <thead>
              <tr style={{background:'#FDE68A', position:'sticky', top:0, zIndex:10}}>
                {COLS.map((c,ci)=>{
                  const isPhaseCol = siteFilter && ci >= COLS.length - PHASE_COLS.length;
                  const phaseIdx = isPhaseCol ? ci - (COLS.length - PHASE_COLS.length) : -1;
                  const PHASE_BG = ['#FDE68A','#A8D8F0','#D4A5E8','#A8E6CF','#D4A5E8'];
                  const PHASE_C  = ['#2D2D2D','#2D2D2D','#2D2D2D','#2D2D2D','#2D2D2D'];
                  return (
                    <th key={c} style={{padding: isPhaseCol?'7px 4px':'9px 10px', textAlign: isPhaseCol?'center':'left',
                      fontWeight:700, color: isPhaseCol?PHASE_C[phaseIdx]:'#2D2D2D',
                      borderBottom:'2px solid #2D2D2D', fontSize:11, whiteSpace:'nowrap', overflow:'hidden',
                      background: isPhaseCol?PHASE_BG[phaseIdx]:'#FDE68A',
                      borderLeft: isPhaseCol?`2px solid ${PHASE_C[phaseIdx]}30`:undefined,
                    }}>{c}</th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {/* 即将上线 section */}
              {upcoming.length>0 && <>
                <tr><td colSpan={colN} style={{padding:'7px 9px', background:'#FDE68A', borderBottom:'2px solid #2D2D2D'}}>
                  <span style={{fontSize:12, fontWeight:700, color:'#2D2D2D'}}>🚀 即将上线</span>
                  <span style={{fontSize:11, color:'#2D2D2D', marginLeft:8}}>7个工作日内 · {upcoming.length}个项目</span>
                </td></tr>
                {upcoming.map((r,i)=><RowRender key={r.id} r={r} idx={i+1} isUpcoming={true}/>)}
                <tr><td colSpan={colN} style={{padding:'6px 10px', background:'#FDE68A', borderBottom:'2px solid #2D2D2D'}}>
                  <span style={{fontSize:11, color:'#6B6B6B', fontWeight:600}}>其他记录</span>
                </td></tr>
              </>}
              {/* Rest */}
              {rest.map((r,i)=><RowRender key={r.id} r={r} idx={i+1} isUpcoming={false}/>)}
              {allRows.length===0 && (
                <tr><td colSpan={colN} style={{textAlign:'center', padding:'60px 0', color:'#6B6B6B', fontSize:13}}>
                  暂无记录，点击「+ 添加记录」新建
                </td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
      {/* Right: detail panel */}
      {panelRecord && (
        <DetailPanel
          record={panelRecord}
          onClose={()=>{setPanelId(null);setPanelPhase(null);}}
          onUpdate={onUpdate}
          onOpenFull={onOpen}
          onCopy={onCopy}
          scrollToPhase={panelPhase}
        />
      )}

      {/* ── 备注/卡点 Modal ── */}
      {blockerModal && (
        <div style={{position:'fixed',inset:0,zIndex:9000,display:'flex',alignItems:'center',justifyContent:'center',background:'rgba(0,0,0,0.35)'}}
          onClick={()=>setBlockerModal(null)}>
          <div style={{background:'white',borderRadius:20,padding:20,width:520,maxWidth:'90vw',boxShadow:'4px 4px 0 #2D2D2D'}}
            onClick={e=>e.stopPropagation()}>
            <div style={{fontWeight:700,fontSize:15,marginBottom:10,color:'#2D2D2D'}}>
              ✏️ 备注 / 卡点 — {blockerModal.r.tokenName||blockerModal.r.tokenSymbol||'未命名'}
            </div>
            <textarea
              autoFocus
              value={blockerModal.val}
              onChange={e=>setBlockerModal(m=>({...m, val:e.target.value}))}
              placeholder="输入备注或卡点说明（支持中文，可拖拽右下角调整大小）"
              rows={5}
              style={{
                width:'100%', boxSizing:'border-box',
                fontSize:13, lineHeight:1.7,
                border:'2px solid #2D2D2D', borderRadius:16,
                padding:'8px 11px', outline:'none',
                fontFamily:'inherit', resize:'both',
                minHeight:120, color:'#2D2D2D',
              }}
            />
            <div style={{display:'flex',gap:8,marginTop:14,justifyContent:'flex-end'}}>
              <button onClick={()=>setBlockerModal(null)}
                style={{background:'none',border:'2px solid #2D2D2D',borderRadius:16,padding:'8px 20px',fontSize:13,cursor:'pointer',color:'#6B6B6B',fontWeight:600}}>
                取消
              </button>
              <button onClick={saveBlockerModal}
                style={{background:'#FDE68A',color:'#2D2D2D',border:'3px solid #2D2D2D',borderRadius:16,padding:'8px 24px',fontSize:13,cursor:'pointer',fontWeight:700, boxShadow:'3px 3px 0 #2D2D2D'}}>
                保存
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

  records.forEach(r => { if(counts[r.site]!==undefined && !r.cancelled) counts[r.site]++; });
  const total = records.filter(r=>!r.cancelled).length;

  const NavItem = ({ id, icon, label, count, indent }) => (
    <div onClick={()=>onPage(id)} style={{
      display:'flex', alignItems:'center', gap:6, padding: indent ? '6px 8px 6px 22px' : '7px 12px',
      cursor:'pointer', borderRadius:14, margin:'1px 8px',
      background: page===id ? '#FFFFFF' : 'transparent',
      border: page===id ? '2px solid #2D2D2D' : '2px solid transparent',
      boxShadow: page===id ? '2px 2px 0 #2D2D2D' : 'none',
      color:'#2D2D2D',
      fontWeight: page===id ? 700 : 400, fontSize:13, transition:'all 0.1s',

    onMouseLeave={e=>{ if(page!==id) e.currentTarget.style.background='transparent'; }}>

  );

  return (
    <div style={{
      width:160, background:'#7ECDC0', height:'100vh', flexShrink:0,
      display:'flex', flexDirection:'column', overflow:'hidden',
      borderRight:'2px solid #2D2D2D',
    }}>
      {/* Logo */}
      <div style={{padding:'14px 12px 10px', borderBottom:'2px solid #2D2D2D'}}>
        <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", color:'#2D2D2D', fontWeight:400, fontSize:16}}>OSL 上币</div>
        <div style={{color:'#2D2D2D', fontSize:10, marginTop:2}}>Listing Ops</div>
      </div>
      {/* Nav */}
      <div style={{flex:1, overflowY:'auto', padding:'10px 0'}}>
        <NavItem id="overview" icon="📋" label="总表" count={total} />
        <div style={{padding:'10px 16px 4px', fontSize:11, color:'#2D2D2D', fontWeight:600, letterSpacing:0.5}}>分站点</div>
        <NavItem id="HK"     icon="🇭🇰" label="香港站"   count={counts.HK}     indent />
        <NavItem id="Global" icon="🌐" label="国际站"   count={counts.Global} indent />
        <NavItem id="ID"     icon="🇮🇩" label="印尼站"   count={counts.ID}     indent />
        <div style={{padding:'10px 16px 4px', fontSize:11, color:'#2D2D2D', fontWeight:600, letterSpacing:0.5}}>工具</div>
        <NavItem id="usdgo_budget" icon="💰" label="USDGO 预算" />
        <NavItem id="task_board" icon="🗂" label="任务清单" />
      </div>
      {/* Footer */}
      <div style={{padding:'10px 14px', borderTop:'2px solid #2D2D2D', fontSize:11, color:'#2D2D2D'}}>
        已同步至云端
      </div>
    </div>
  );
}

  ],
  Global: [
    { key:'all',         label:'全部',     products:null },

function SiteView({ site, records, onOpen, onUpdate, onNew, onImport, onDelete, onRestore, onCopy }) {
  const [activeTab, setActiveTab] = useState('all');
  const tabs = SITE_TABS[site] || SITE_TABS.HK;
  const tab = tabs.find(t=>t.key===activeTab) || tabs[0];

  // Count per tab
  const siteRecords = records.filter(r=>r.site===site);
  const countFor = (t) => {
    let rs = siteRecords;
    if (t.products) rs = rs.filter(r=>t.products.includes(r.product));
    if (t.filter)   rs = rs.filter(t.filter);
    return rs.length;
  };

  // Build productFilter for OverviewTable
  const productFilter = tab.products;
  const extraFilter = tab.filter;

  // Filter records for this tab
  const tabRecords = records.filter(r => {
    if (r.site !== site) return false;
    if (productFilter && !productFilter.includes(r.product)) return false;
    if (extraFilter && !extraFilter(r)) return false;
    return true;
  });

  return (
    <div style={{display:'flex', flexDirection:'column', height:'100%'}}>
      {/* Tab bar */}
      <div style={{display:'flex', alignItems:'center', gap:2, padding:'0 16px',
        background:'white', borderBottom:'2px solid #2D2D2D', flexShrink:0, overflowX:'auto'}}>
        {tabs.map(t => {
          const cnt = countFor(t);
          const active = t.key===activeTab;
          return (
            <button key={t.key} onClick={()=>setActiveTab(t.key)} style={{
              border:'none', background:'none', cursor:'pointer',
              padding:'11px 14px', fontSize:13, fontWeight: active?700:400,
              color: active?C.navy:'#6B6B6B', borderBottom: active?`2px solid ${C.navy}`:'2px solid transparent',
              whiteSpace:'nowrap', display:'flex', alignItems:'center', gap:5,
              marginBottom:-1,
            }}>
              {t.label}
              {cnt>0 && <span style={{fontSize:11, background: active?C.navy:'#F5F0E6', color:'#2D2D2D',
                borderRadius:99, padding:'1px 6px', fontWeight:700}}>{cnt}</span>}
            </button>
          );
        })}
      </div>
      {/* Table */}
      <div style={{flex:1, overflow:'hidden', display:'flex', flexDirection:'column'}}>
        <OverviewTable
          records={tabRecords}
          onOpen={onOpen}
          onUpdate={onUpdate}
          onNew={onNew}
          onImport={onImport}
          onDelete={onDelete}
          onRestore={onRestore}
          onCopy={onCopy}
          siteFilter={site}
        />
      </div>
    </div>
  );
}

// ─── USDGO 活动预算计算器 ───────────────────────────────────────────────────────
function UsdgoBudgetView({ addToast }) {
  const [state, setState] = useState(null);
  const [loading, setLoading] = useState(true);
  const [entryDate, setEntryDate] = useState(toLocalDateStr(new Date()));
  const [entryAmount, setEntryAmount] = useState('');
  const [entryType, setEntryType] = useState('expense'); // 'expense'=发奖出金 | 'income'=分润入金
  const [entryNote, setEntryNote] = useState('');
  const [showSettings, setShowSettings] = useState(false);
  const [openingBalanceInput, setOpeningBalanceInput] = useState('');
  const [openingDateInput, setOpeningDateInput] = useState('');
  const [monthlyIncomeInput, setMonthlyIncomeInput] = useState('');
  const [showCardScenario, setShowCardScenario] = useState(false);
  const [cardBurnInput, setCardBurnInput] = useState('2000');
  const [showBulkImport, setShowBulkImport] = useState(false);
  const [bulkText, setBulkText] = useState('');
  const [reconcileWarnings, setReconcileWarnings] = useState([]);

  useEffect(() => {
    (async () => {
      const cloud = await loadUsdgoBudget();
      const local = loadUsdgoLocal();
      const st = { ...USDGO_DEFAULT_STATE, ...(cloud || local || {}) };
      setState(st);
      setOpeningBalanceInput(String(st.openingBalance));
      setOpeningDateInput(st.openingDate);
      setMonthlyIncomeInput(String(st.monthlyIncome));
      setCardBurnInput(String(st.cardScenarioBurn));
      setLoading(false);
    })();
  }, []);

  if (loading || !state) {
    return <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:'#6B6B6B',fontSize:14}}>加载中...</div>;
  }

  const persist = (newState) => { setState(newState); syncUsdgoBudget(newState); };

  const fmtMoney = (n) => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

  const calcBalance = (st) => {
    // 只累加「期初日期」之后的记录——期初日期当天及更早的交易已经算在期初余额快照里了，
    // 不然会重复计算导致对不上账
    const relevant = (st.entries||[]).filter(e => e.date > st.openingDate);
    const sum = relevant.reduce((acc,e)=> acc + (e.type==='income'? Number(e.amount) : -Number(e.amount)), 0);
    return (Number(st.openingBalance)||0) + sum;
  };
  const calcAvgBurn = (entries) => {
    const now = new Date(); now.setHours(0,0,0,0);
    const cutoff = new Date(now); cutoff.setDate(cutoff.getDate()-13);
    const total = (entries||[]).filter(e=>e.type==='expense').filter(e=>{
      const d = new Date(e.date); d.setHours(0,0,0,0);
      return d>=cutoff && d<=now;
    }).reduce((a,e)=>a+Number(e.amount),0);
    return total/14;
  };
  const simulateRunway = (balance, dailyBurn, monthlyIncome) => {
    if (dailyBurn<=0) return { depletionDate:null, days:null, sustainable:true };
    let bal = balance;
    let d = new Date(); d.setHours(0,0,0,0);
    const maxDays = 365*3;
    for (let i=1;i<=maxDays;i++){
      d = new Date(d); d.setDate(d.getDate()+1);
      bal -= dailyBurn;
      const tenth = nthWorkingDayOfMonth(d.getFullYear(), d.getMonth(), 10);
      if (d.getFullYear()===tenth.getFullYear() && d.getMonth()===tenth.getMonth() && d.getDate()===tenth.getDate()) {
        bal += Number(monthlyIncome)||0;
      }
      if (bal<=0) return { depletionDate:new Date(d), days:i, sustainable:false };
    }
    return { depletionDate:null, days:null, sustainable:true };
  };
  const nextIncomeDate = () => {
    const now = new Date(); now.setHours(0,0,0,0);
    let y=now.getFullYear(), m=now.getMonth();
    let d = nthWorkingDayOfMonth(y,m,10);
    if (d < now) { m+=1; if(m>11){m=0;y+=1;} d = nthWorkingDayOfMonth(y,m,10); }
    return d;
  };

  const balance = calcBalance(state);
  const avgBurn = calcAvgBurn(state.entries);
  const runway = simulateRunway(balance, avgBurn, state.monthlyIncome);
  const nextInc = nextIncomeDate();

  const runwayColor = runway.sustainable ? '#2D2D2D' : (runway.days<=14 ? '#2D2D2D' : runway.days<=30 ? '#2D2D2D' : '#2D2D2D');
  const runwayBg = runway.sustainable ? '#A8E6CF' : (runway.days<=14 ? '#F7C8D4' : runway.days<=30 ? '#FDE68A' : '#A8E6CF');

  // 卡活动上线预估（还没上线，仅用于提前摸底：假设卡活动上线后固定日均发奖）
  const cardBurn = Number(state.cardScenarioBurn)||0;
  const cardRunway = simulateRunway(balance, cardBurn, state.monthlyIncome);
  const saveCardBurn = () => {
    const cb = parseFloat(cardBurnInput)||0;
    persist({ ...state, cardScenarioBurn: cb });
    addToast&&addToast('✅ 卡活动预估日烧钱已保存');
  };

  const addEntry = () => {
    const amt = parseFloat(entryAmount);
    if (!amt || amt<=0) { addToast&&addToast('请输入有效金额'); return; }
    const entry = { id: genId(), date: entryDate, type: entryType, amount: amt, note: entryNote.trim() };
    const newState = { ...state, entries: [...(state.entries||[]), entry] };
    persist(newState);
    setEntryAmount(''); setEntryNote('');
    addToast&&addToast(entryType==='expense'?`✅ 已记录发奖出金 ${fmtMoney(amt)}`:`✅ 已记录分润入金 ${fmtMoney(amt)}`);
  };
  const deleteEntry = (id) => {
    persist({ ...state, entries: (state.entries||[]).filter(e=>e.id!==id) });
  };
  const bulkImport = () => {
    const rawLines = bulkText.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()!=='');
    if (!rawLines.length) { addToast&&addToast('请先粘贴数据'); return; }

    // 自动识别分隔符：整段里有 tab（直接从 Excel 复制粘贴）就按 tab 分，否则按逗号分
    const delim = rawLines.some(l=>l.includes('\t')) ? '\t' : ',';
    const rows = rawLines.map(l=>l.split(delim).map(p=>p.trim()));

    // 兼容 2026-09-17 / 2026/9/17 / 9/17/2026 等写法
    const parseDateFlexible = (s) => {
      s = (s||'').trim();
      let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
      m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
      if (m) return `${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
      return null;
    };
    // 去掉千分位逗号/货币符号/空格再转数字（分隔符是 tab 时，数字里的逗号不会跟列分隔冲突）
    const parseNumFlexible = (s) => {
      if (s==null) return NaN;
      const cleaned = String(s).replace(/[,\s￥$]/g,'');
      if (cleaned==='' || cleaned==='-' || cleaned==='—') return 0;
      return parseFloat(cleaned);
    };

    // 识别表头：如果直接从 Excel 选中「日期/Balance/DR/CR」几列复制过来，自动认出这几列
    const headerCells = rows[0].map(c=>c.toLowerCase());
    const findCol = (re) => headerCells.findIndex(c=>re.test(c));
    const hDate = findCol(/日期|date/);
    const hBal = findCol(/balance|余额/);
    const hDr = findCol(/^dr$|支出|出金|发奖/);
    const hCr = findCol(/^cr$|收入|入金|分润/);
    const hasDrCrHeader = hDate>=0 && hDr>=0 && hCr>=0;

    let mode, dateIdx, balIdx, drIdx, crIdx, dataRows, headerOffset;
    if (hasDrCrHeader) {
      mode='drcr'; dateIdx=hDate; balIdx=hBal; drIdx=hDr; crIdx=hCr;
      dataRows = rows.slice(1); headerOffset = 2;
    } else if (rows[0].length>=4 && parseDateFlexible(rows[0][0]) && !isNaN(parseNumFlexible(rows[0][1]))) {
      // 没表头，但列数≥4 且第一列是日期、第二列是数字：按 日期,Balance,DR,CR 的列序猜
      mode='drcr'; dateIdx=0; balIdx=1; drIdx=2; crIdx=3;
      dataRows = rows; headerOffset = 1;
    } else {
      mode='simple'; dataRows = rows; headerOffset = 1;
    }

    const newEntries = [];
    const errors = [];
    const reconcileIssues = [];
    let checkBal = Number(state.openingBalance)||0;

    dataRows.forEach((parts, i) => {
      const lineNo = i + headerOffset;
      const rawLine = parts.join(' | ');
      if (mode==='drcr') {
        const dateStr = parseDateFlexible(parts[dateIdx]);
        if (!dateStr) { errors.push(`第${lineNo}行日期不认识：${rawLine}`); return; }
        const dr = parseNumFlexible(parts[drIdx]) || 0;
        const cr = parseNumFlexible(parts[crIdx]) || 0;
        if (!dr && !cr) return; // 空行/两列都是0，跳过，不算错误
        if (dr>0) newEntries.push({ id:genId(), date:dateStr, type:'expense', amount:dr, note:'批量导入' });
        if (cr>0) newEntries.push({ id:genId(), date:dateStr, type:'income', amount:cr, note:'批量导入' });
        checkBal = checkBal - dr + cr;
        if (balIdx>=0) {
          const bal = parseNumFlexible(parts[balIdx]);
          if (!isNaN(bal) && Math.abs(checkBal - bal) > 0.5) {
            reconcileIssues.push(`${dateStr}：按期初余额 ${fmtMoney(state.openingBalance)} 往下累加应为 ${fmtMoney(checkBal)}，但表里写的是 ${fmtMoney(bal)}（差 ${fmtMoney(checkBal-bal)}）`);
            checkBal = bal; // 以表里当天的数字为准继续核对，避免一处错、后面全部跟着报错
          }
        }
      } else {
        if (parts.length < 3) { errors.push(`第${lineNo}行格式不对：${rawLine}`); return; }
        const [dateRaw, typeStr, amountStr, ...noteParts] = parts;
        const dateStr = parseDateFlexible(dateRaw);
        const amt = parseNumFlexible(amountStr);
        if (!dateStr || isNaN(amt)) { errors.push(`第${lineNo}行日期或金额不对：${rawLine}`); return; }
        const isIncome = /income|分润|入/i.test(typeStr);
        const isExpense = /expense|发奖|出/i.test(typeStr);
        if (!isIncome && !isExpense) { errors.push(`第${lineNo}行类型不认识：${rawLine}`); return; }
        newEntries.push({ id: genId(), date: dateStr, type: isIncome?'income':'expense', amount: amt, note: noteParts.join(delim).trim() });
      }
    });

    if (errors.length) {
      addToast&&addToast('⚠️ '+errors[0]+(errors.length>1?`（还有 ${errors.length-1} 行格式有问题，未导入）`:''));
    }
    setReconcileWarnings(reconcileIssues);
    if (newEntries.length) {
      persist({ ...state, entries: [...(state.entries||[]), ...newEntries] });
      addToast&&addToast(`✅ 成功导入 ${newEntries.length} 条记录${reconcileIssues.length?`，但有 ${reconcileIssues.length} 天跟你表里的 Balance 对不上，见下方提示`:''}`);
      setBulkText('');
      if (!reconcileIssues.length) setShowBulkImport(false);
    } else if (!errors.length) {
      addToast&&addToast('没有识别到可导入的数据，请检查格式');
    }
  };
  const saveSettings = () => {
    const ob = parseFloat(openingBalanceInput)||0;
    const mi = parseFloat(monthlyIncomeInput)||0;
    persist({ ...state, openingBalance: ob, openingDate: openingDateInput, monthlyIncome: mi });
    setShowSettings(false);
    addToast&&addToast('✅ 预算设置已保存');
  };

  // 期初日期当天及更早的记录已经算在「期初余额」快照里了，余额/流水表只往后累加期初日期之后的记录，避免重复计算对不上账
  const relevantEntries = (state.entries||[]).filter(e => e.date > state.openingDate);
  const preOpeningEntries = (state.entries||[]).filter(e => e.date <= state.openingDate);

  const sortedEntries = [...(state.entries||[])].sort((a,b)=> b.date.localeCompare(a.date) || 0);
  // running balance per row (从期初开始，按时间正序累加，再倒序展示)
  const ascEntries = [...relevantEntries].sort((a,b)=> a.date.localeCompare(b.date));
  let running = Number(state.openingBalance)||0;
  const runningMap = {};
  ascEntries.forEach(e=>{ running += (e.type==='income'?Number(e.amount):-Number(e.amount)); runningMap[e.id]=running; });

  // 现金流水表：历史实际（按日聚合）+ 未来预测（逐日，一路算到今年年底），仿 Excel 风格 日期/Balance/DR/CR
  // ⚠️ 这里只反映「维持现状」的真实流水（近14天日均发奖 + 每月10号工作日分润），
  // 跟下面「卡活动上线预估」的假设数字完全分开算、分开存，不会混进这张表里
  const todayStr = toLocalDateStr(new Date());
  const yearEndDateStr = new Date().getFullYear() + '-12-31';
  const cashFlowRows = [];
  let yearEndRow = null;
  {
    // 从「期初日期」次日起，逐日走到年底，一天都不跳过：
    // 有实际记录的那天用实际数字；没有记录的那天（不管是过去的空档还是未来）都用近14天日均发奖 + 到点分润补上。
    // 这样不管哪天补录/新增了一笔记录，中间的流水都不会因为"最后一条实际记录的日期变了"而跟着消失。
    const today = new Date(); today.setHours(0,0,0,0);
    const byDate = {};
    relevantEntries.forEach(e=>{
      if (!byDate[e.date]) byDate[e.date] = { dr:0, cr:0 };
      if (e.type==='income') byDate[e.date].cr += Number(e.amount);
      else byDate[e.date].dr += Number(e.amount);
    });
    const yearEnd = new Date(today.getFullYear(), 11, 31);
    let cursor = new Date(state.openingDate);
    const totalDays = Math.max(Math.round((yearEnd - cursor)/86400000), 0);
    let bal = Number(state.openingBalance)||0;
    for (let i=1;i<=totalDays;i++){
      cursor = new Date(cursor); cursor.setDate(cursor.getDate()+1);
      const dateStr = toLocalDateStr(cursor);
      const hit = byDate[dateStr];
      let dr, cr, isActual;
      if (hit) {
        dr = hit.dr; cr = hit.cr; isActual = true;
      } else {
        const y=cursor.getFullYear(), m=cursor.getMonth();
        const tenth = nthWorkingDayOfMonth(y,m,10);
        const isIncomeDay = cursor.getFullYear()===tenth.getFullYear() && cursor.getMonth()===tenth.getMonth() && cursor.getDate()===tenth.getDate();
        dr = avgBurn;
        cr = isIncomeDay ? (Number(state.monthlyIncome)||0) : 0;
        isActual = false;
      }
      bal = bal - dr + cr;
      cashFlowRows.push({ date: dateStr, dr, cr, balance:bal, actual:isActual });
      // 不提前 break：就算余额跌到 0 以下也继续算到年底，这样才能看出年底到底是结余还是亏空
    }
    yearEndRow = cashFlowRows.length ? cashFlowRows[cashFlowRows.length-1] : { date:todayStr, balance:Number(state.openingBalance)||0 };
  }

  return (
    <div style={{flex:1, overflowY:'auto', padding:'20px 24px'}}>
      <div style={{maxWidth:900, margin:'0 auto'}}>
        <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontSize:18, fontWeight:700, color:'#2D2D2D', marginBottom:4}}>💰 USDGO 活动预算</div>
        <div style={{fontSize:13, color:'#6B6B6B', marginBottom:14}}>每天录入发奖出金，自动滚动计算余额与预计花完时间</div>

        {/* 顶部核心数字 */}
        <div style={{display:'grid', gridTemplateColumns:'1.2fr 1fr 1.4fr', gap:14, marginBottom:12}}>
          <div className="hl-card" style={{background:'white', borderRadius:20, padding:'12px 14px', border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D'}}>
            <div style={{fontSize:12, color:'#6B6B6B', marginBottom:4}}>当前余额</div>
            <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontSize:24, fontWeight:700, color:'#2D2D2D'}}>{fmtMoney(balance)}</div>
            <div style={{fontSize:11, color:'#6B6B6B', marginTop:2}}>USDGO</div>
          </div>
          <div className="hl-card" style={{background:'white', borderRadius:20, padding:'12px 14px', border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D'}}>
            <div style={{fontSize:12, color:'#6B6B6B', marginBottom:4}}>近14天日均发奖</div>
            <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontSize:24, fontWeight:700, color:'#2D2D2D'}}>{fmtMoney(avgBurn)}</div>
            <div style={{fontSize:11, color:'#6B6B6B', marginTop:2}}>USDGO / 天</div>
          </div>
          <div className="hl-card" style={{background:runwayBg, borderRadius:20, padding:'12px 14px', border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D'}}>
            <div style={{fontSize:12, color:runwayColor, marginBottom:4, fontWeight:700}}>预计预算花完</div>
            {runway.sustainable ? (
              <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontSize:16, fontWeight:700, color:runwayColor}}>✅ 按当前节奏可持续（月度分润覆盖支出）</div>
            ) : (
              <>
                <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontSize:20, fontWeight:700, color:runwayColor}}>
                  {runway.depletionDate.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})}
                </div>
                <div style={{fontSize:12, color:runwayColor, marginTop:2}}>约 {runway.days} 天后（已计入未来每月分润）</div>
              </>
            )}
          </div>
        </div>

        <div style={{fontSize:12, color:'#6B6B6B', marginBottom:12}}>
          下次分润预计：<strong style={{color:'#2D2D2D'}}>{nextInc.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})}</strong>（本月/次月第10个工作日）· 金额 {fmtMoney(state.monthlyIncome)} USDGO
          <button onClick={()=>setShowSettings(v=>!v)} style={{marginLeft:10, fontSize:11, color:'#2D2D2D', background:'none', border:'none', cursor:'pointer', textDecoration:'underline'}}>
            {showSettings?'收起设置':'⚙ 编辑期初余额/分润金额'}
          </button>
          <button onClick={()=>setShowCardScenario(v=>!v)} style={{marginLeft:10, fontSize:11, color:'#2D2D2D', background:'none', border:'none', cursor:'pointer', textDecoration:'underline'}}>
            {showCardScenario?'收起卡活动预估':'🎴 卡活动上线预估（提前摸底）'}
          </button>
        </div>

        {/* 期初日期之前/当天的记录提醒：这些已经算在期初余额里了，不重复计入 */}
        {preOpeningEntries.length>0 && (
          <div style={{background:'#FDE68A', border:'2px solid #2D2D2D', borderRadius:20, padding:'8px 12px', marginBottom:11, fontSize:12, color:'#2D2D2D', lineHeight:1.6}}>
            ⚠️ 有 {preOpeningEntries.length} 条记录的日期在期初日期（{state.openingDate}）当天或更早，已经算在「期初余额」里了，为避免重复计算，不会计入下面的余额/流水表（下方"收支记录"里标了"早于期初"）。如果这些记录本该单独计入，把「期初日期」改早一点即可；如果是重复记录，可以直接删掉。
          </div>
        )}

        {/* 卡活动上线预估：还没上线，用同一份实际历史数据 + 假设的固定日烧钱来对比 */}
        {showCardScenario && (
          <div style={{background:'#FDE68A', border:'2px solid #2D2D2D', borderRadius:20, padding:14, marginBottom:12}}>
            <div style={{fontSize:13, fontWeight:700, color:'#2D2D2D', marginBottom:4}}>🎴 卡活动上线预估（独立假设，不会算进下面的现金流水表）</div>
            <div style={{fontSize:12, color:'#2D2D2D', marginBottom:10}}>卡活动尚未上线，这里只是提前摸底：假设上线后每天固定发奖烧钱达到下面这个数字，对比"维持现状"会提前多久见底。这里的数字只在这个框里显示，不会写入、也不会混进下面的现金流水表和收支记录。</div>
            <div style={{display:'flex', alignItems:'flex-end', gap:10, marginBottom:11}}>

function fmtShortDate(dateStr) {
  if (!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${m}-${d}`;
}
function fmtTimestamp(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${toLocalDateStr(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
// 统一的操作按钮样式：固定尺寸、有边框/背景，放在每一行右侧同一列，不会因为标题长短而跑位
const ICON_BTN = { width:24, height:24, display:'inline-flex', alignItems:'center', justifyContent:'center',
  borderRadius:'50%', border:'2px solid #2D2D2D', background:'#FFFFFF', cursor:'pointer', fontSize:13, color:'#2D2D2D',
  flexShrink:0, padding:0, lineHeight:1, boxShadow:'2px 2px 0 #2D2D2D' };
const ICON_BTN_ADD = { ...ICON_BTN, background:'#FDE68A', fontWeight:700, fontSize:15 };
const ICON_BTN_DANGER = { ...ICON_BTN, background:'#F8635F', color:'#2D2D2D' };
// 子任务支持无限层级嵌套（子任务下面还能再加子任务），下面这几个是纯函数的树操作
function addSubtaskNode(nodes, parentId, newNode) {
  if (parentId==null) return [...(nodes||[]), newNode];
  return (nodes||[]).map(n => n.id===parentId
    ? { ...n, children:[...(n.children||[]), newNode] }
    : { ...n, children: (n.children && n.children.length) ? addSubtaskNode(n.children, parentId, newNode) : n.children }
  );
}
function toggleSubtaskNode(nodes, id) {
  const now = new Date().toISOString();
  return (nodes||[]).map(n => n.id===id
    ? { ...n, done: !n.done, doneAt: !n.done ? now : null }
    : { ...n, children: (n.children && n.children.length) ? toggleSubtaskNode(n.children, id) : n.children }
  );
}
function deleteSubtaskNode(nodes, id) {
  return (nodes||[]).filter(n=>n.id!==id).map(n => ({ ...n, children: n.children ? deleteSubtaskNode(n.children, id) : n.children }));
}
function updateSubtaskNoteNode(nodes, id, note) {
  return (nodes||[]).map(n => n.id===id
    ? { ...n, note }
    : { ...n, children: (n.children && n.children.length) ? updateSubtaskNoteNode(n.children, id, note) : n.children }
  );
}
function countSubtaskNodes(nodes) {
  let total=0, done=0;
  (nodes||[]).forEach(n=>{
    total++; if (n.done) done++;
    if (n.children && n.children.length) { const c = countSubtaskNodes(n.children); total+=c.total; done+=c.done; }
  });
  return { total, done };
}

// 子任务树：定义在组件外层（顶层函数），保持组件身份稳定，避免每次输入都被重新挂载——
// 之前把它定义在 TaskBoardView 内部，导致每次按键 TaskBoardView 一重渲染，SubtaskTree 就被当成全新组件重新创建，
// 底层 <input> 跟着被卸载重挂，中文输入法的候选状态全被打断，所以打不出中文。子子任务同理，全部一起挪出来。
function SubtaskTree({ taskId, nodes, depth, collapsedSubtasks, setCollapsedSubtasks,

// ─── 周报聚合：把零散任务按"站点 + 状态"归档成一周小结 ───────────────────────
function weekRangeOf(offset) {           // offset: 0=本周, -1=上周
  const now = new Date(); now.setHours(0,0,0,0);
  const day = now.getDay();
  const mon = new Date(now); mon.setDate(now.getDate() + (day===0?-6:1-day) + offset*7);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return { start: toLocalDateStr(mon), end: toLocalDateStr(sun) };
}
function collectDoneSubtasks(nodes, start, end, acc) {
  acc = acc || [];
  (nodes||[]).forEach(n => {
    if (n.done && n.doneAt) {
      const d = toLocalDateStr(new Date(n.doneAt));
      if (d>=start && d<=end) acc.push(n);
    }
    if (n.children && n.children.length) collectDoneSubtasks(n.children, start, end, acc);
  });
  return acc;
}
function buildWeeklyDigest(tasks, start, end) {
  const inWin = iso => { if(!iso) return false; const d = toLocalDateStr(new Date(iso)); return d>=start && d<=end; };
  const nextEnd = (() => { const d = new Date(end); d.setDate(d.getDate()+7); return toLocalDateStr(d); })();
  const sites = {}, ensure = k => (sites[k] = sites[k] || { done:[], doing:[], blocked:[], added:[] });
  const nextWeek = [];
  let nDone=0, nDoing=0, nBlocked=0, nAdded=0, nSubDone=0;

  (tasks||[]).forEach(t => {
    const subsDone = collectDoneSubtasks(t.subtasks, start, end);
    nSubDone += subsDone.length;
    const ct = countSubtaskNodes(t.subtasks);
    const item = { title:t.title, note:(t.note||'').trim(), owner:t.owner, due:t.dueDate,
                   subsDone: subsDone.map(x=>x.text), progress: ct.total ? ct.done+'/'+ct.total : '' };
    const g = ensure(t.site || '通用');
    if (inWin(t.completedAt))                                   { g.done.push(item);    nDone++; }
    else if (t.status==='waiting')                              { g.blocked.push(item); nBlocked++; }
    else if (subsDone.length || inWin(t.startedAt) || (t.status==='doing' && inWin(t.updatedAt)))
                                                                { g.doing.push(item);   nDoing++; }
    else if (inWin(t.createdAt))                                { g.added.push(item);   nAdded++; }
    const unfinished = t.status!=='done' && t.status!=='cancelled';
    if (unfinished && ((t.dueDate && t.dueDate>end && t.dueDate<=nextEnd) || t.urgent))
      nextWeek.push({ ...item, site:t.site||'通用', urgent:!!t.urgent });
  });

  const order = TASK_SITE_OPTIONS.map(o=>o.key);
  const groups = Object.keys(sites)
    .sort((a,b)=>order.indexOf(a)-order.indexOf(b))
    .map(k=>({ site:k, label:(TASK_SITE_OPTIONS.find(o=>o.key===k)||{label:k}).label, ...sites[k] }))
    .filter(g=>g.done.length||g.doing.length||g.blocked.length||g.added.length);
  return { start, end, stats:{ nDone, nDoing, nBlocked, nAdded, nSubDone }, groups, nextWeek };
}
function digestToText(d) {
  const L = [];
  L.push('本周小结（' + d.start + ' ~ ' + d.end + '）');
  L.push('完成 ' + d.stats.nDone + ' · 推进 ' + d.stats.nDoing + ' · 卡住 ' + d.stats.nBlocked + ' · 新增 ' + d.stats.nAdded
         + '，另完成 ' + d.stats.nSubDone + ' 个子步骤');
  L.push('');
  d.groups.forEach(g => {
    L.push('【' + g.label + '】');
    const sec = (title, arr, fmt) => { if(!arr.length) return; L.push(title); arr.forEach(it=>L.push('  · ' + fmt(it))); };
    sec('已完成：', g.done, it => it.title + (it.note ? '（' + it.note + '）' : ''));
    sec('推进中：', g.doing, it => it.title
        + (it.subsDone.length ? '（本周完成 ' + it.subsDone.length + ' 项：' + it.subsDone.join('、') + (it.progress?'；进度 '+it.progress:'') + '）' : (it.progress?'（进度 '+it.progress+'）':'')));
    sec('卡住：',   g.blocked, it => it.title + (it.note ? ' — 卡在：' + it.note : ''));
    sec('新增：',   g.added, it => it.title + (it.due ? '（' + it.due + ' 到期）' : ''));
    L.push('');
  });
  if (d.nextWeek.length) {
    L.push('【下周计划】');
    d.nextWeek.forEach(it => L.push('  · ' + it.title + (it.urgent?'（紧急）':'') + (it.due ? '（' + it.due + ' 到期）' : '')));
  }
  return L.join('\n');
}
// 调 Supabase Edge Function 让 AI 把结构化数据写成成段周报（key 存在服务端）
async function generateAIWeekly(digest) {
  const res = await fetch(SUPABASE_URL + '/functions/v1/weekly-report', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + SUPABASE_KEY, 'apikey': SUPABASE_KEY },
    body: JSON.stringify({ digest }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0,200));
  const j = await res.json();
  if (j.error) throw new Error(j.error);
  return j.text;
}
