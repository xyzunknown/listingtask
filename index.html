function buildChecklist(site, product, tokenType, opts={}) {
  const nc = tokenType === 'newchain';
  const stableHub  = !!opts.stableHub;
  const launchpool = !!opts.launchpool;
  const s = [];
  const add = (phase, tag, task, owner, contact, time, note='', critical=false, inputType=null, inputKey=null, inputOptions=null) =>
    s.push({ phase, tag, task, owner, contact, time, note, critical, inputType, inputKey, inputOptions });

  // PRE-CONDITIONS
  if (site==='ID') add('前置确认','pre','确认项目已在印尼政府 CFX 白名单','Listing Ops','Aisha Mi','提前确认','印尼站不需要VAAP，但币种必须在CFX白名单内才能上线',true);

    add('前置确认','pre','确认 Fireblocks 支持该链','钱包','Huaxi Li','提前确认','HK站必须Fireblocks支持（AML冻结/解冻功能）',true);
    add('前置确认','pre','确认 KYT 工具支持该链','钱包/合规',site==='HK'?'Huaxi Li（Chainalysis）':site==='Global'?'Betty Nie（ScoreChain/Elliptic）':'SumSub','提前确认','查阅《KYT支持表》确认链是否在支持列表内，不支持则不能上该链',true);

    add('执行配置','exec','撰写上线公告','Marketing / Listing Ops','Freya Yu / Rebeca Zhang','上线前1天','公告内容：上线时间、交易对、产品类型、活动（如有）。需经合规审核，不得有误导性声明');
    add('执行配置','exec','申请宣发 Banner','Marketing','Freya Yu / Teddy','上线前3天','向设计团队提交 Banner 需求（尺寸、品牌规范、内容要点），用于 App / 网站宣传');
    add('执行配置','exec','开盘前配置白名单','Listing Ops','Rebeca Zhang / Eyang','开盘前','在系统后台配置交易白名单，确保开盘按计划进行',true);
    add('正式上线','launch','通知 MM 正式挂单','Listing Ops','Rebeca Zhang / Freya Yu','开盘时','开盘后立即通知做市商挂单，确保盘口流动性',true);
  }

  return s;
}

function estimateTime(site, product, tokenType) {
  const nc = tokenType==='newchain';
  if (site==='HK' && product==='Orderbook') return nc?'约4–6周':'约3–4周';
  if (site==='HK' && product==='RFQ')       return nc?'约3–4周':'约1–2周';
  if (site==='HK' && product==='OTC')       return nc?'约3–4周':'约1–2周';
  if (site==='Global' && product==='RFQ')   return nc?'约2–3周':'约3–5天';
  if (site==='Global' && product==='OTC')   return nc?'约2–3周':'约2–3天';
  if (site==='Global' && product==='Orderbook') return nc?'约3–4周':'约1–2周';
  if (site==='Global' && product==='Perp') return nc?'约3–4周':'约1–2周';
  if (site==='ID') return nc?'约2–3周':'约1周';
  if (product==='ChainOnly')    return nc?'约1–2周':'约2–3天';
  if (product==='WealthToken')  return '约2–3周';
  if (product==='Maintenance')  return '按维护窗口';
  return '—';
}

// ⚠️ 日期一律用本地日历日格式化，不要用 toISOString().slice(0,10)——
// toISOString 会先转成 UTC，在 UTC+8（香港/中国）时区，本地日期 00:00 转成 UTC 会变成"前一天"，
// 之前就是这个 bug 导致「今天」默认日期、预测流水的日期都悄悄早了一天，长期下来对不上账。
function toLocalDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// 本周（周一~周日）的日期区间字符串，用来判断"本周新增"
function thisWeekRange() {
  const now = new Date(); now.setHours(0,0,0,0);
  const day = now.getDay(); // 0=周日
  const diffToMon = (day===0 ? -6 : 1-day);
  const mon = new Date(now); mon.setDate(now.getDate()+diffToMon);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return { start: toLocalDateStr(mon), end: toLocalDateStr(sun) };
}
// 某年某月第 n 个工作日（跳过周六周日）
function nthWorkingDayOfMonth(year, monthIdx, n) {
  let count = 0;
  let d = new Date(year, monthIdx, 1);
  while (true) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) { count++; if (count === n) return new Date(d); }
    d.setDate(d.getDate()+1);
    if (d.getMonth() !== monthIdx && count===0) break; // safety
  }
}
function genId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function countDone(checked, naSteps) {
  return Object.values(checked||{}).filter(Boolean).length
       + Object.values(naSteps||{}).filter(Boolean).length;
}
function computeStatus(checked, total, naSteps) {
  const done = countDone(checked, naSteps);
  if (done===0) return 'not_started';
  if (done===total) return 'completed';
  return 'in_progress';
}
function getRecordStatus(r, total) {
  if (r.cancelled) return 'cancelled';
  return computeStatus(r.checked||{}, total, r.naSteps||{});
}
function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtLaunchTime(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:00`;
}
// datetime-local input needs "YYYY-MM-DDTHH:MM"
function toInputVal(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({ records, onOpen, onNew, onDelete, onRestore, onUpdate, onViewCompleted, onImport, siteFilter }) {
  const [filter, setFilter] = useState('all');
  const [viewMode, setViewMode] = useState('grid'); // 'grid' | 'list' | 'table'
  const [cancelTarget, setCancelTarget] = useState(null);
  const [cancelReason, setCancelReason] = useState('');
  const [editingLaunchId, setEditingLaunchId] = useState(null);
  const [launchInputVal, setLaunchInputVal] = useState('');
  const [editingBlockerId, setEditingBlockerId] = useState(null);
  const [blockerInputVal, setBlockerInputVal] = useState('');
  const [blockerComposing, setBlockerComposing] = useState(false);
  const [showImportModal, setShowImportModal] = useState(false);
  const [importPreview, setImportPreview] = useState(null); // {newRecords, skipCount}
  const [importFile, setImportFile] = useState(null);

  const openCancelModal = (e, id) => {
    e.stopPropagation();
    setCancelTarget(id);
    setCancelReason('');
  };
  const confirmCancel = () => {
    if (!cancelReason.trim()) return;
    onDelete(cancelTarget, cancelReason.trim());
    setCancelTarget(null);
    setCancelReason('');
  };

  const handleImportFile = (file) => {
    if (!file) return;
    setImportFile(file);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, {type:'binary', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        const SITE_MAP = {'OSL HK':'HK','HK':'HK','Global':'Global','OSL Global':'Global','OSL ID':'ID','OSL ID ':'ID','ID':'ID'};
        const PRODUCT_MAP = {'OTC':'OTC','Orderbook':'Orderbook','RFQ':'RFQ','仅上链':'ChainOnly','理财代币':'WealthToken'};
        const IGNORE_PRODUCTS = ['StableHub','Launchpool'];
        const newRecords = [];
        rows.forEach(row => {
          const ticker = (row['Token Ticker']||row['Token']||'').toString().trim();
          if (!ticker) return;
          const siteRaw = (row['站点']||row['Site']||'').toString().trim();
          const productRaw = (row['交易类型']||row['Product']||'').toString().trim();
          // Parse sites (may be comma-separated)
          const siteParts = siteRaw.split(',').map(s=>s.trim()).filter(Boolean);
          const sites = siteParts.map(s=>SITE_MAP[s]).filter(Boolean);
          if (sites.length === 0) sites.push('HK'); // default
          // Parse products (may be comma-separated), filter out ignored ones
          const productParts = productRaw.split(',').map(s=>s.trim()).filter(Boolean);
          const stableHub = productParts.some(p=>p==='StableHub');
          const launchpool = productParts.some(p=>p==='Launchpool');
          const products = productParts.filter(p=>!IGNORE_PRODUCTS.includes(p)).map(p=>PRODUCT_MAP[p]).filter(Boolean);
          if (products.length === 0) products.push('OTC'); // default
          // Parse chain labels
          const chainRaw = (row['区块链']||row['Chain']||'').toString().trim();
          const chainLabels = chainRaw ? chainRaw.split('/').map(s=>s.trim()).filter(Boolean) : [];
          // Parse quote currencies
          const quoteRaw = (row['交易对名称']||row['交易对']||'').toString().trim();
          const quoteCurrencies = quoteRaw ? quoteRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
          // Parse launch time
          let expectedLaunchTime = null;
          const ltRaw = row['预计上线时间']||row['Expected Launch Time']||'';
          if (ltRaw instanceof Date) {
            expectedLaunchTime = ltRaw.toISOString();
          } else if (typeof ltRaw === 'number' && ltRaw > 0) {
            const d = XLSX.SSF.parse_date_code(ltRaw);
            if (d) expectedLaunchTime = new Date(d.y,d.m-1,d.d,d.H||0,d.M||0).toISOString();
          } else if (typeof ltRaw === 'string' && ltRaw.trim()) {
            const parsed = new Date(ltRaw.trim());
            if (!isNaN(parsed)) expectedLaunchTime = parsed.toISOString();
          }
          const userType = (row['用户类型']||row['User Type']||'').toString().trim();
          const expectedMM = (row['做市商']||row['MM']||'').toString().trim();
          const tokenSymbol = ticker.toUpperCase();
          const tokenName = quoteCurrencies.length > 0 ? quoteCurrencies.map(q=>`${tokenSymbol}/${q}`).join(', ') : tokenSymbol;
          sites.forEach(site => {
            products.forEach(product => {
              newRecords.push({
                _key: tokenSymbol+'|'+site+'|'+product,
                id: genId(),
                tokenName, tokenSymbol, quoteCurrencies,
                chainLabels, chainOnly: product==='ChainOnly',
                chains: [], userType, expectedMM, expectedLaunchTime,
                site, product, tokenType:'subtoken',
                stableHub: site==='Global' && product==='RFQ' ? stableHub : false,
                launchpool: site==='ID' ? launchpool : false,
                blocker: '', checked: {}, naSteps: {}, stepNotes: {}, notes: '',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                estimatedTime: estimateTime(site, product, 'subtoken'),
              });
            });
          });
        });
        // Deduplicate against existing records
        const existingKeys = new Set(records.map(r=>(r.tokenSymbol||r.tokenName).toUpperCase()+'|'+r.site+'|'+r.product));
        const toImport = newRecords.filter(r=>!existingKeys.has(r._key));
        const skipCount = newRecords.length - toImport.length;
        setImportPreview({newRecords: toImport.map(r=>{const {_key,...rest}=r;return rest;}), skipCount});
      } catch(err) {
        console.error('Import error:', err);
        alert('解析文件失败：'+err.message);
      }
    };
    reader.readAsBinaryString(file);
  };

  const confirmImport = () => {
    if (!importPreview || !importPreview.newRecords.length) return;
    onImport(importPreview.newRecords);
    setShowImportModal(false);
    setImportPreview(null);
    setImportFile(null);
  };

  const filtered = records.filter(r => {
    if (siteFilter && r.site !== siteFilter) return false;
    if (filter==='all') return true;
    const checklist = buildChecklist(r.site, r.product, r.tokenType, {stableHub: r.stableHub, launchpool: r.launchpool});
    const status = getRecordStatus(r, checklist.length);
    return status === filter;
  });

  const STATUS_ORDER = { in_progress:0, not_started:1, completed:2, cancelled:3 };
  const sorted = [...filtered].sort((a,b) => {
    const clA = buildChecklist(a.site,a.product,a.tokenType,{stableHub:a.stableHub});
    const clB = buildChecklist(b.site,b.product,b.tokenType,{stableHub:b.stableHub});
    const sA = STATUS_ORDER[getRecordStatus(a, clA.length)] ?? 99;
    const sB = STATUS_ORDER[getRecordStatus(b, clB.length)] ?? 99;
    if (sA !== sB) return sA - sB;
    // 进行中：有预期上线时间的排前面，按时间升序（最近截止的优先）
    if (sA === 0) {
      if (a.expectedLaunchTime && b.expectedLaunchTime)
        return new Date(a.expectedLaunchTime) - new Date(b.expectedLaunchTime);
      if (a.expectedLaunchTime) return -1;
      if (b.expectedLaunchTime) return 1;
    }
    return new Date(b.updatedAt) - new Date(a.updatedAt);
  });

  return (
    <div>
      {/* Import modal */}
      {showImportModal && (
        <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:16}}>
          <div style={{background:'white', borderRadius:20, padding:22, width:'100%', maxWidth:480, boxShadow:'6px 6px 0 #2D2D2D'}}>
            <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontWeight:700, fontSize:17, color:'#2D2D2D', marginBottom:6}}>📥 导入 XLSX</div>
            <div style={{fontSize:13, color:'#6B6B6B', marginBottom:14}}>选择包含上币记录的 Excel 文件，系统将自动解析并创建任务。</div>
            <input type="file" accept=".xlsx,.xls" onChange={e=>handleImportFile(e.target.files[0])}
              style={{display:'block', marginBottom:12, fontSize:13, fontFamily:'inherit'}}/>
            {importPreview && (
              <div style={{background: importPreview.newRecords.length>0?'#A8E6CF':'#FDE68A', border:`${(importPreview.newRecords.length>0) ? '3px' : '2px'} solid #2D2D2D`, borderRadius:20, padding:'10px 14px', marginBottom:12, fontSize:13}}>
                <div style={{fontWeight:700, color:'#2D2D2D', marginBottom:4}}>
                  将导入 <span style={{color:'#2D2D2D'}}>{importPreview.newRecords.length}</span> 条新记录，跳过 <span style={{color:'#2D2D2D'}}>{importPreview.skipCount}</span> 条重复记录
                </div>
                {importPreview.newRecords.length > 0 && (
                  <div style={{marginTop:8, maxHeight:160, overflowY:'auto', display:'flex', flexDirection:'column', gap:4}}>
                    {importPreview.newRecords.slice(0,8).map((r,i)=>(
                      <div key={i} style={{fontSize:12, color:'#2D2D2D'}}>
                        {SITES.find(s=>s.id===r.site)?.icon} <strong>{r.tokenSymbol}</strong> · {r.site} · {r.product}
                        {r.expectedLaunchTime && <span style={{color:'#2D2D2D', marginLeft:6}}>🗓 {fmtLaunchTime(r.expectedLaunchTime)}</span>}
                      </div>
                    ))}
                    {importPreview.newRecords.length > 8 && <div style={{fontSize:12, color:'#6B6B6B'}}>还有 {importPreview.newRecords.length-8} 条...</div>}
                  </div>
                )}
              </div>
            )}
            <div style={{display:'flex', gap:10, justifyContent:'flex-end'}}>
              <button onClick={()=>{setShowImportModal(false);setImportPreview(null);setImportFile(null);}} style={{border:'2px solid #2D2D2D', background:'white', borderRadius:16, padding:'9px 18px', fontSize:13, cursor:'pointer', color:'#6B6B6B', fontWeight:600}}>取消</button>
              <button onClick={confirmImport} disabled={!importPreview||!importPreview.newRecords.length} style={{border:'none', background:(importPreview&&importPreview.newRecords.length)? 'white' :'#F5F0E6', color:(importPreview&&importPreview.newRecords.length)? '#2D2D2D' :'#6B6B6B', borderRadius:16, padding:'8px 18px', fontSize:13, cursor:(importPreview&&importPreview.newRecords.length)?'pointer':'not-allowed', fontWeight:700}}>确认导入</button>
            </div>
          </div>
        </div>
      )}
      {/* Cancel modal */}
      {cancelTarget && (
        <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:16}}>
          <div style={{background:'white', borderRadius:20, padding:22, width:'100%', maxWidth:440, boxShadow:'6px 6px 0 #2D2D2D'}}>
            <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontWeight:700, fontSize:17, color:'#2D2D2D', marginBottom:6}}>取消上币任务</div>
            <div style={{fontSize:13, color:'#6B6B6B', marginBottom:14}}>进度数据会完整保留，可随时恢复。请填写取消原因：</div>
            <textarea
              autoFocus
              value={cancelReason}
              onChange={e=>setCancelReason(e.target.value)}
              placeholder="例如：项目方撤回申请、合规未通过、暂缓上线..."

              onFocus={e=>e.target.style.borderColor='#2D2D2D'}

                        {r.expectedMM && <span style={{fontSize:11, color:'#6B6B6B'}}>MM: {r.expectedMM}</span>}
                        {r.chainOnly && <span style={{fontSize:11, background:'#D4A5E8', color:'#2D2D2D', border:'2px solid #2D2D2D', borderRadius:12, padding:'1px 7px', fontWeight:600}}>仅上链</span>}
                        {(r.chainLabels||[]).map((tag,i)=>(
                          <span key={i} style={{fontSize:11, background:'#F5F0E6', color:'#2D2D2D', border:'2px solid #2D2D2D', borderRadius:12, padding:'1px 7px', fontWeight:500}}>{tag}</span>
                        ))}
                        {/* Blocker pill */}
                        {r.blocker && <span style={{background:'#FDE68A', color:'#2D2D2D', border:'2px solid #2D2D2D', borderRadius:12, fontSize:11, padding:'1px 7px', fontWeight:600}}>🚧 {r.blocker}</span>}
                        {/* Blocker quick-edit */}
                        <span onClick={e=>e.stopPropagation()}>
                          {editingBlockerId===r.id ? (
                            <span style={{display:'flex', alignItems:'flex-start', gap:4}}>
                              <textarea autoFocus value={blockerInputVal}
                                onChange={e=>setBlockerInputVal(e.target.value)}
                                onCompositionStart={()=>setBlockerComposing(true)}
                                onCompositionEnd={e=>{setBlockerComposing(false);setBlockerInputVal(e.target.value);}}
                                onKeyDown={e=>{if(blockerComposing)return;if(e.key==='Escape')setEditingBlockerId(null);}}
                                placeholder="输入卡点说明（支持中文，右下角可拖拽调整大小）"
                                rows={3}
                                style={{fontSize:12, border:'2px solid #2D2D2D', borderRadius:14, padding:'4px 8px', fontFamily:'inherit', outline:'none', minWidth:240, resize:'both', lineHeight:1.6, color:'#2D2D2D'}}/>
                              <span style={{display:'flex', flexDirection:'column', gap:3}}>
                                <button onClick={()=>{onUpdate({...r,blocker:blockerInputVal.trim(),updatedAt:new Date().toISOString()});setEditingBlockerId(null);}} style={{background:'#FFCBA4', color:'#2D2D2D', border:'3px solid #2D2D2D', borderRadius:12, padding:'4px 10px', fontSize:12, cursor:'pointer', fontWeight:700, whiteSpace:'nowrap', boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
                                <button onClick={()=>setEditingBlockerId(null)} style={{background:'none', border:'2px solid #2D2D2D', borderRadius:12, padding:'3px 8px', fontSize:12, cursor:'pointer', color:'#6B6B6B'}}>取消</button>
                              </span>
                            </span>
                          ) : (
                            <span onClick={()=>{setEditingBlockerId(r.id);setBlockerInputVal(r.blocker||'');}} style={{fontSize:11, color:'#6B6B6B', cursor:'pointer'}} title="编辑卡点">✏</span>
                          )}
                        </span>
                        <span style={{fontSize:12, color:'#6B6B6B'}}>更新 {fmtDate(r.updatedAt)}</span>
                        {status==='in_progress' && (
                          <span style={{display:'flex', alignItems:'center', gap:5}} onClick={e=>e.stopPropagation()}>
                            <span style={{fontSize:12, color:'#2D2D2D', fontWeight:600}}>🗓 预期上线：</span>
                            {editingLaunchId===r.id ? (
                              <span style={{display:'flex', alignItems:'center', gap:5}}>
                                <input type="datetime-local" value={launchInputVal} onChange={e=>setLaunchInputVal(e.target.value)} step="3600"
                                  style={{fontSize:12, border:'2px solid #2D2D2D', borderRadius:14, padding:'2px 8px', fontFamily:'inherit', outline:'none'}}/>
                                <button onClick={()=>{
                                  const iso = launchInputVal ? new Date(launchInputVal).toISOString() : null;
                                  onUpdate({...r, expectedLaunchTime:iso, updatedAt:new Date().toISOString()});
                                  setEditingLaunchId(null);
                                }} style={{background:'#FDE68A', color:'#2D2D2D', border:'3px solid #2D2D2D', borderRadius:14, padding:'3px 10px', fontSize:12, cursor:'pointer', fontWeight:700, boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
                                <button onClick={()=>setEditingLaunchId(null)} style={{background:'none', border:'2px solid #2D2D2D', borderRadius:14, padding:'3px 8px', fontSize:12, cursor:'pointer', color:'#6B6B6B'}}>取消</button>
                              </span>
                            ) : (
                              <span onClick={()=>{setEditingLaunchId(r.id); setLaunchInputVal(toInputVal(r.expectedLaunchTime));}}
                                style={{fontSize:12, color:r.expectedLaunchTime?'#2D2D2D':'#6B6B6B', fontWeight:r.expectedLaunchTime?700:400, cursor:'pointer', borderBottom:'1px dashed currentColor', paddingBottom:1}}>
                                {fmtLaunchTime(r.expectedLaunchTime) || '点击设置'}
                              </span>
                            )}
                          </span>
                        )}
                      </div>
                      <div style={{display:'flex', alignItems:'center', gap:8, marginTop:6}}>
                        <div style={{flex:1, background:'#F5F0E6', borderRadius:99, height:5, overflow:'hidden', maxWidth:260}}>
                          <div style={{width:`${pct}%`, height:'100%', background:pct===100? 'white' :isCancelled?'#6B6B6B':siteColor, borderRadius:99, transition:'width 0.3s'}}/>
                        </div>
                        <span style={{fontSize:11, color:'#6B6B6B', whiteSpace:'nowrap'}}>{done}/{checklist.length} 步骤</span>
                      </div>
                    </div>
                    {isCancelled
                      ? <button className="btn" onClick={e=>{e.stopPropagation();onRestore(r.id);}} style={{background:'none', border:'2px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'4px 10px', cursor:'pointer', fontSize:12, fontWeight:700, flexShrink:0}}>↩ 恢复</button>
                      : <button className="btn" onClick={e=>openCancelModal(e,r.id)} style={{background:'none', border:'2px solid #2D2D2D', color:'#6B6B6B', borderRadius:16, width:30, height:30, cursor:'pointer', fontSize:14, flexShrink:0}} title="取消">✕</button>
                    }
                  </div>
                  {isCancelled && r.cancelReason && (
                    <div style={{borderTop:'2px solid #2D2D2D', background:'#FFFFFF', padding:'6px 16px 6px 20px', display:'flex', gap:8, alignItems:'center'}}>
                      <span style={{fontSize:11, fontWeight:700, color:'#6B6B6B', flexShrink:0}}>取消原因</span>
                      <span style={{fontSize:12, color:'#6B6B6B'}}>{r.cancelReason}</span>
                    </div>
                  )}
                  {pendingCritical.length>0 && (
                    <div style={{borderTop:'2px solid #2D2D2D', background:'#F7C8D4', padding:'7px 16px 7px 20px', display:'flex', flexDirection:'column', gap:4}}>
                      <div style={{fontSize:11, fontWeight:700, color:'#2D2D2D', letterSpacing:0.3}}>PENDING 关键项</div>
                      {pendingCritical.slice(0,3).map((step,i)=>(
                        <div key={i} style={{display:'flex', alignItems:'baseline', gap:7}}>
                          <span style={{width:14, height:14, borderRadius:3, border:'2px solid #2D2D2D', display:'inline-flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>
                            <span style={{fontSize:8, color:'#2D2D2D'}}>✕</span>
                          </span>
                          <span style={{fontSize:12, color:'#2D2D2D', fontWeight:600}}>{step.task}</span>
                          <span style={{fontSize:11, color:'#6B6B6B', flexShrink:0}}>— {step.contact.split('\n')[0]}</span>
                        </div>
                      ))}
                      {pendingCritical.length>3 && <div style={{fontSize:11, color:'#2D2D2D'}}>还有 {pendingCritical.length-3} 项...</div>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── New Listing Wizard ───────────────────────────────────────────────────────
function NewListingWizard({ onSave, onCancel, existingRecords, onOpenExisting }) {
  const [site, setSite] = useState(null);
  const [products, setProducts] = useState([]); // multi-select
  const [tokenType, setTokenType] = useState(null);
  const [tokenSymbol, setTokenSymbol] = useState('');
  const [quoteCurrencies, setQuoteCurrencies] = useState([]); // selected quote currencies
  const [chainOnly, setChainOnly] = useState(false);          // 仅上链
  const [chains, setChains] = useState([]);
  const [customChain, setCustomChain] = useState('');
  const [userType, setUserType] = useState('');
  const [expectedMM, setExpectedMM] = useState('');
  const [wizardLaunchTime, setWizardLaunchTime] = useState('');
  const [stableHub, setStableHub] = useState(null);
  const [launchpool, setLaunchpool] = useState(null);
  const [dupWarning, setDupWarning] = useState(null);

  // ── Announcement fields (ChainOnly) ──────────────────────────────────────────
  const [annTokenSymbols, setAnnTokenSymbols] = useState('');
  const [annTokenFullName, setAnnTokenFullName] = useState('');
  const [annChainName, setAnnChainName]       = useState('');
  const [annChainSuffix, setAnnChainSuffix]   = useState('');
  const [annDepositStatus, setAnnDepositStatus] = useState('Opened');
  const [annTradingPairs, setAnnTradingPairs]   = useState('');
  const [annAboutEN, setAnnAboutEN] = useState('');
  const [annAboutZH, setAnnAboutZH] = useState('');
  const [annAboutTC, setAnnAboutTC] = useState('');
  const [annWebsite, setAnnWebsite] = useState('');
  const [annWhitepaper, setAnnWhitepaper] = useState('');
  const [annTwitter, setAnnTwitter]   = useState('');
  const [annAboutLang, setAnnAboutLang] = useState('EN');

  const QUOTE_OPTIONS = ['USD','USDT','USDC','BTC','HKD','IDR'];
  const [customQuote, setCustomQuote] = useState('');
  const addCustomQuote = () => {
    const v = customQuote.trim().toUpperCase();
    if (!v || quoteCurrencies.includes(v)) { setCustomQuote(''); return; }
    setQuoteCurrencies(prev=>[...prev, v]);
    setCustomQuote('');
  };
  const toggleQuote = (q) => {
    if (chainOnly) return;
    setQuoteCurrencies(prev => prev.includes(q) ? prev.filter(x=>x!==q) : [...prev,q]);
  };
  const toggleChainOnly = () => {
    setChainOnly(v => { if (!v) setQuoteCurrencies([]); return !v; });
  };

  const toggleProduct = (id) => {
    setProducts(prev => prev.includes(id) ? prev.filter(p=>p!==id) : [...prev, id]);
    if (id==='RFQ' && products.includes('RFQ')) setStableHub(null); // deselecting RFQ clears StableHub
  };
  const needsStableHub  = site==='Global' && products.includes('RFQ');
  const needsLaunchpool = site==='ID' && products.length > 0;
  const canCreate = site && products.length > 0 && tokenType && tokenSymbol.trim()
    && (!needsStableHub  || stableHub  !== null)
    && (!needsLaunchpool || launchpool !== null);

  const toggleChain = (id) => setChains(prev => prev.includes(id) ? prev.filter(c=>c!==id) : [...prev, id]);
  const addCustomChain = () => {
    const v = customChain.trim();
    if (!v) return;
    const id = 'CUSTOM_'+v.toUpperCase();
    if (!chains.includes(id)) setChains(prev=>[...prev, id]);
    setCustomChain('');
  };
  // Derive display name
  const derivedName = () => {
    const sym = tokenSymbol.trim();
    if (!sym) return '';
    if (chainOnly) return `${sym}（仅上链）`;
    if (quoteCurrencies.length > 0) return quoteCurrencies.map(q=>`${sym}/${q}`).join(', ');
    return sym;
  };

  const doCreate = () => {
    const lp = needsLaunchpool ? !!launchpool : false;
    const chainLabels = chains.map(id => {
      const c = CHAINS.find(c=>c.id===id);
      return c ? c.tag : id.replace('CUSTOM_','');
    });
    const launchIso = wizardLaunchTime ? new Date(wizardLaunchTime).toISOString() : null;
    const newRecords = products.map(prod => {
      const sh = (site==='Global' && prod==='RFQ') ? !!stableHub : false;
      return {
        id: genId(),
        tokenName: derivedName(),
        tokenSymbol: tokenSymbol.trim(),
        quoteCurrencies, chainOnly,
        chains, chainLabels,
        userType, expectedMM,
        expectedLaunchTime: launchIso,
        site, product: prod, tokenType, stableHub: sh, launchpool: lp,
        blocker: '', checked: {}, naSteps: {}, stepNotes: {}, notes: '',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        estimatedTime: estimateTime(site, prod, tokenType),
        annFields: prod === 'ChainOnly' ? {
          tokenSymbols: annTokenSymbols.trim() || tokenSymbol.trim(),
          chainName:    annChainName.trim(),
          chainSuffix:  annChainSuffix.trim(),
          depositStatus: annDepositStatus,
          tradingPairs: annTradingPairs.trim(),
          aboutEN: annAboutEN.trim(),
          aboutZH: annAboutZH.trim(),
          aboutTC: annAboutTC.trim(),
          website:    annWebsite.trim(),
          whitepaper: annWhitepaper.trim(),
          twitter:    annTwitter.trim(),
        } : (prod === 'OTC' && site === 'Global') ? {
          annType:      'GlobalOTC',
          tokenSymbols: annTokenSymbols.trim() || tokenSymbol.trim(),
          tokenFullName: annTokenFullName.trim() || tokenSymbol.trim(),
          chainName:    annChainName.trim(),
          chainSuffix:  annChainSuffix.trim(), // used as network label e.g. ERC20
          depositStatus: annDepositStatus,
          tradingPairs: annTradingPairs.trim(),
          aboutEN: annAboutEN.trim(),
          aboutZH: annAboutZH.trim(),
          aboutTC: annAboutTC.trim(),
          website:    annWebsite.trim(),
          whitepaper: annWhitepaper.trim(),
          twitter:    annTwitter.trim(),
        } : null,
      };
    });
    onSave(newRecords);
  };

  const handleCreate = () => {
    if (!canCreate) return;
    const sym = tokenSymbol.trim().toLowerCase();
    const allMatches = [];
    products.forEach(prod => {
      const m = (existingRecords || []).filter(r =>
        (r.tokenSymbol||r.tokenName).trim().toLowerCase() === sym &&
        r.site === site && r.product === prod
      );
      allMatches.push(...m);
    });
    if (allMatches.length > 0) setDupWarning({ matches: allMatches });
    else doCreate();
  };

  const sInfo = SITES.find(s=>s.id===site);

  return (
    <div style={{height:'100%', overflowY:'auto'}}>
      {/* Duplicate warning modal */}
      {dupWarning && (
        <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:16}}>
          <div style={{background:'white', borderRadius:20, padding:22, width:'100%', maxWidth:460, boxShadow:'6px 6px 0 #2D2D2D'}}>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:8}}>
              <span style={{fontSize:22}}>⚠️</span>
              <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontWeight:700, fontSize:17, color:'#2D2D2D'}}>疑似重复任务</div>
            </div>
            <div style={{fontSize:13, color:'#6B6B6B', marginBottom:12}}>
              已找到 <strong>{dupWarning.matches.length}</strong> 条相同币种 + 站点 + 产品的记录，可能是重复创建：
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:20}}>
              {dupWarning.matches.map(r => {
                const cl = buildChecklist(r.site, r.product, r.tokenType, {stableHub: r.stableHub, launchpool: r.launchpool});
                const st = getRecordStatus(r, cl.length);
                const sm = STATUS_META[st];
                const done = Object.values(r.checked||{}).filter(Boolean).length;
                return (
                  <div key={r.id} style={{background:'#FDE68A', border:'2px solid #2D2D2D', borderRadius:20, padding:'8px 12px', display:'flex', alignItems:'center', gap:12}}>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700, fontSize:14, color:'#2D2D2D'}}>{r.tokenName}</div>
                      <div style={{fontSize:12, color:'#6B6B6B', marginTop:2}}>
                        {SITES.find(s=>s.id===r.site)?.icon} {r.site} · {r.product} · 创建于 {fmtDate(r.createdAt)}
                      </div>
                      <div style={{fontSize:12, marginTop:3}}>
                        <span style={{background:sm.bg, color:sm.color, padding:'1px 8px', borderRadius:99, fontWeight:700}}>{sm.label}</span>
                        <span style={{color:'#6B6B6B', marginLeft:8}}>{done}/{cl.length} 步骤已完成</span>
                      </div>
                    </div>
                    <button onClick={()=>{ setDupWarning(null); onOpenExisting(r.id); }} style={{background:'none', border:'2px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'5px 11px', fontSize:12, cursor:'pointer', fontWeight:700, whiteSpace:'nowrap'}}>查看</button>
                  </div>
                );
              })}
            </div>
            <div style={{display:'flex', gap:10, justifyContent:'flex-end'}}>
              <button onClick={()=>setDupWarning(null)} style={{border:'2px solid #2D2D2D', background:'white', borderRadius:16, padding:'9px 18px', fontSize:13, cursor:'pointer', color:'#6B6B6B', fontWeight:600}}>返回修改</button>
              <button onClick={()=>{ setDupWarning(null); doCreate(); }} style={{border:'3px solid #2D2D2D', background:'#A8D8F0', color:'#2D2D2D', borderRadius:16, padding:'8px 18px', fontSize:13, cursor:'pointer', fontWeight:700, boxShadow:'3px 3px 0 #2D2D2D'}}>仍然创建</button>
            </div>
          </div>
        </div>
      )}
      <div style={{background:'#7ECDC0', padding:'16px 24px', display:'flex', alignItems:'center', gap:16, borderBottom:'3px solid #2D2D2D'}}>
        <button className="btn" onClick={onCancel} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13}}>← 返回</button>
        <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", color:'#2D2D2D', fontWeight:700, fontSize:16}}>新建上币任务</div>
      </div>

      <div style={{maxWidth:700, margin:'0 auto', padding:'24px 16px'}}>
        {/* Token info — 3 sections */}
        <div className="hl-card" style={{background:'white', borderRadius:20, padding:20, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D', marginBottom:12}}>
          <div style={{fontSize:14, fontWeight:700, color:'#2D2D2D', marginBottom:12}}>币种信息</div>

          {/* 币种代号 */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:6}}>
              币种代号 <span style={{color:'#2D2D2D'}}>*</span>
            </div>
            <input value={tokenSymbol} onChange={e=>setTokenSymbol(e.target.value)}
              placeholder="例如：BTC、ETH、DOGE"
              style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:20, padding:'11px 14px', fontSize:15, fontFamily:'inherit'}}/>
          </div>

          {/* 交易对（右币多选 + 仅上链） */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:8}}>
              交易对 <span style={{fontSize:12, fontWeight:400, color:'#6B6B6B'}}>（可选）</span>
            </div>
            <div style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap'}}>
              {/* Base currency badge */}
              {tokenSymbol.trim() && (
                <span style={{fontSize:14, fontWeight:700, color:'#2D2D2D', background:'#F5F0E6', border:'2px solid #2D2D2D', borderRadius:16, padding:'5px 11px'}}>{tokenSymbol.trim()}</span>
              )}
              {tokenSymbol.trim() && <span style={{fontSize:16, color:'#6B6B6B', fontWeight:300}}>/</span>}
              {/* Quote currency chips */}
              {QUOTE_OPTIONS.map(q => {
                const sel = quoteCurrencies.includes(q);
                return (
                  <button key={q} onClick={()=>toggleQuote(q)} disabled={chainOnly} style={{
                    border:`${(sel) ? '3px' : '2px'} solid #2D2D2D`,
                    borderRadius:16, padding:'5px 12px', cursor: chainOnly?'not-allowed':'pointer',
                    background: sel?'#A8D8F0': chainOnly?'#FFFFFF':'white',
                    fontSize:13, fontWeight: sel?700:500,
                    color: sel?C.navy: chainOnly?'#6B6B6B':'#2D2D2D',
                    transition:'all 0.12s',
                  }}>{sel && '✓ '}{q}</button>
                );
              })}
              {/* Divider */}
              <span style={{fontSize:12, color:'#6B6B6B', fontWeight:400, padding:'0 2px'}}>或</span>
              {/* 仅上链 */}
              <button onClick={toggleChainOnly} style={{
                border:`${(chainOnly) ? '3px' : '2px'} solid #2D2D2D`,
                borderRadius:16, padding:'5px 12px', cursor:'pointer',
                background: chainOnly?'#D4A5E8':'white',
                fontSize:13, fontWeight: chainOnly?700:500,
                color:'#2D2D2D',
                transition:'all 0.12s',
              }}>{chainOnly && '✓ '}仅上链</button>
            </div>
            {/* 自定义交易对 */}
            {!chainOnly && (
              <div style={{display:'flex', gap:8, alignItems:'center', marginTop:10}}>
                <input value={customQuote} onChange={e=>setCustomQuote(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&addCustomQuote()}
                  placeholder="其他右币，如 ETH、EUR…"
                  style={{flex:1, border:'2px solid #2D2D2D', borderRadius:16, padding:'5px 11px', fontSize:13, fontFamily:'inherit', outline:'none'}}/>
                <button onClick={addCustomQuote} style={{background:'#FDE68A', color:'#2D2D2D', border:'3px solid #2D2D2D', borderRadius:16, padding:'5px 12px', fontSize:13, cursor:'pointer', fontWeight:600, whiteSpace:'nowrap', boxShadow:'3px 3px 0 #2D2D2D'}}>+ 添加</button>
              </div>
            )}
            {/* 已选自定义右币（不在预设列表中的） */}
            {!chainOnly && quoteCurrencies.filter(q=>!QUOTE_OPTIONS.includes(q)).map(q=>(
              <span key={q} style={{display:'inline-flex', alignItems:'center', gap:5, marginTop:6, marginRight:6, background:'#A8D8F0', border:'2px solid #2D2D2D', borderRadius:16, padding:'4px 10px', fontSize:12, color:'#2D2D2D', fontWeight:700}}>
                {q}
                <span onClick={()=>setQuoteCurrencies(prev=>prev.filter(x=>x!==q))} style={{cursor:'pointer', color:'#6B6B6B', fontSize:14, lineHeight:1}}>×</span>
              </span>
            ))}
            {/* 预览 */}
            {(quoteCurrencies.length>0 || chainOnly) && tokenSymbol.trim() && (
              <div style={{marginTop:8, fontSize:12, color:'#6B6B6B'}}>
                任务将展示为：<strong style={{color:'#2D2D2D'}}>{derivedName()}</strong>
                {chainOnly && <span style={{marginLeft:8, color:'#6B6B6B'}}>（各站点流程有差异，待补充）</span>}
              </div>
            )}
          </div>

          {/* 区块链（多选） */}
          <div>
            <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:8}}>
              上线区块链 <span style={{fontSize:12, fontWeight:400, color:'#6B6B6B'}}>（多选）</span>
            </div>
            <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:8}}>
              {CHAINS.map(c => {
                const sel = chains.includes(c.id);

      await navigator.clipboard.write([new ClipboardItem({ 'text/html': blob })]);
    } catch(e) {

      el.innerHTML = html; el.contentEditable = 'true';

      window.getSelection().removeAllRanges(); window.getSelection().addRange(range);

// ─── Checklist View ────────────────────────────────────────────────────────────
function ChecklistView({ record, onBack, onUpdate, addToast }) {
  const checklist = useMemo(()=>buildChecklist(record.site, record.product, record.tokenType, {stableHub: record.stableHub, launchpool: record.launchpool}),[record]);
  const [expandedSteps, setExpandedSteps] = useState({});
  const [editNote, setEditNote] = useState(false);
  const [noteText, setNoteText] = useState(record.notes||'');
  const [showCancelModal, setShowCancelModal] = useState(false);
  const [showAnn, setShowAnn] = useState(false);
  const [cancelReason, setCancelReason] = useState('');
  const [showEditModal, setShowEditModal] = useState(false);
  const [editTokenName, setEditTokenName] = useState(record.tokenName||'');
  const [editExpectedMM, setEditExpectedMM] = useState(record.expectedMM||'');
  const [editUserType, setEditUserType] = useState(record.userType||'');
  const [editBlocker, setEditBlocker] = useState(record.blocker||'');
  const [editLaunchTime, setEditLaunchTime] = useState(toInputVal(record.expectedLaunchTime));

  const checked = record.checked || {};
  const total = checklist.length;
  const isCancelled = !!record.cancelled;
  // done = checked + NA (both count toward progress)
  const done = countDone(checked, record.naSteps||{});
  const pct = total ? Math.round(done/total*100) : 0;
  const isComplete = !isCancelled && done===total && total>0;

  const handleCancelConfirm = () => {
    if (!cancelReason.trim()) return;
    onUpdate({...record, cancelled: true, cancelReason: cancelReason.trim(), updatedAt: new Date().toISOString()});
    setShowCancelModal(false);
    setCancelReason('');
  };
  const handleRestore = () => {
    onUpdate({...record, cancelled: false, cancelReason: '', updatedAt: new Date().toISOString()});
  };

  const naSteps   = record.naSteps   || {};
  const stepNotes = record.stepNotes || {};
  const [editingStepNote, setEditingStepNote] = useState(null);
  const [stepNoteVal, setStepNoteVal] = useState('');

  const toggle = (idx) => {
    const nowDone = !checked[idx];
    const newChecked = {...checked, [idx]: nowDone};
    const newNA = nowDone ? {...naSteps, [idx]:false} : naSteps;
    const step = checklist[idx];
    const newTotal = countDone(newChecked, newNA);
    let msg = nowDone ? ('✅ ' + step.task.slice(0,28)) : ('↩ 撤销：' + step.task.slice(0,24));
    if (nowDone && newTotal===checklist.length) msg = '🎉 ' + record.tokenName + ' 全部完成！';
    onUpdate({...record, checked:newChecked, naSteps:newNA, updatedAt:new Date().toISOString()}, msg);
  };

  const toggleNA = (idx) => {
    const nowNA = !naSteps[idx];
    const newNA = {...naSteps, [idx]: nowNA};
    const newChecked = nowNA ? {...checked, [idx]:false} : checked;
    onUpdate({...record, naSteps:newNA, checked:newChecked, updatedAt:new Date().toISOString()},
      nowNA ? ('— N/A：' + (checklist[idx]?.task||'').slice(0,20)) : '');
  };

  const saveStepNote = (idx) => {
    const newNotes = {...stepNotes, [idx]: stepNoteVal.trim()};
    onUpdate({...record, stepNotes:newNotes, updatedAt:new Date().toISOString()}, '📝 步骤备注已保存');
    setEditingStepNote(null);
  };

  // ── 审批签字：切换某审批人的签字状态；全签齐则自动勾选该步骤 ──
  const toggleApproval = (inputKey, name, approvers, stepIdx) => {
    const allAppr = record.approvals || {};
    const cur = {...(allAppr[inputKey] || {})};
    if (cur[name]) delete cur[name];
    else cur[name] = new Date().toISOString();
    const newApprovals = {...allAppr, [inputKey]: cur};
    const allSigned = approvers.every(n => cur[n]);
    const newChecked = {...checked, [stepIdx]: allSigned};
    const msg = allSigned ? '🔓 合规审批全部签字完成，闸门已通过' : (cur[name] ? ('✍️ '+name+' 已签字') : ('↩ '+name+' 撤销签字'));
    onUpdate({...record, approvals:newApprovals, checked:newChecked, updatedAt:new Date().toISOString()}, msg);
  };

  const stepFields = record.stepFields || {};
  const setStepField = (inputKey, value, stepIdx) => {
    const newFields = {...stepFields, [inputKey]: value};
    const newChecked = {...checked, [stepIdx]: !!value};
    onUpdate({...record, stepFields:newFields, checked:newChecked, updatedAt:new Date().toISOString()}, value?`✅ ${inputKey} 已填写`:'');
  };

  const openEditModal = () => {
    setEditTokenName(record.tokenName||'');
    setEditExpectedMM(record.expectedMM||'');
    setEditUserType(record.userType||'');
    setEditBlocker(record.blocker||'');
    setEditLaunchTime(toInputVal(record.expectedLaunchTime));
    setShowEditModal(true);
  };
  const saveEditModal = () => {
    const iso = editLaunchTime ? new Date(editLaunchTime).toISOString() : null;
    onUpdate({...record, tokenName:editTokenName, expectedMM:editExpectedMM, userType:editUserType, blocker:editBlocker, expectedLaunchTime:iso, updatedAt:new Date().toISOString()}, '✏ 记录信息已更新');
    setShowEditModal(false);
  };

  const saveNote = () => {
    onUpdate({...record, notes:noteText, updatedAt:new Date().toISOString()}, `📝 备注已更新：${record.tokenName}`);
    setEditNote(false);
  };

  // Group by phase
  const phases = [];
  let cur = null;
  checklist.forEach((step,i)=>{
    if (!cur || cur.name!==step.phase) { cur={name:step.phase,tag:step.tag,steps:[]}; phases.push(cur); }
    cur.steps.push({...step,idx:i});
  });

  // Group by team/owner (parallel lanes) — same steps, grouped by who's doing them
  const [viewMode, setViewMode] = useState('phase'); // 'phase' | 'team'
  const laneOrder = [];
  const laneMap = {};
  checklist.forEach((step,i)=>{
    const key = step.owner || '其他';
    if (!laneMap[key]) { laneMap[key] = []; laneOrder.push(key); }
    laneMap[key].push({...step, idx:i});
  });
  const lanes = laneOrder.map(owner => ({ owner, steps: laneMap[owner] }));

  const siteInfo = SITES.find(s=>s.id===record.site);
  const prodInfo = PRODUCTS.find(p=>p.id===record.product);

  return (
    <div style={{height:'100%', overflowY:'auto'}}>
      {/* Announcement overlay */}
      {showAnn && record.annFields && (
        record.annFields.annType==='GlobalOTC'
          ? <AnnouncementViewGlobal record={record} onClose={()=>setShowAnn(false)} onUpdate={onUpdate}/>
          : <AnnouncementView record={record} onClose={()=>setShowAnn(false)} onUpdate={onUpdate}/>
      )}
      {/* Edit info modal */}
      {showEditModal && (
        <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:16}}>
          <div style={{background:'white', borderRadius:20, padding:22, width:'100%', maxWidth:460, boxShadow:'6px 6px 0 #2D2D2D'}}>
            <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontWeight:700, fontSize:17, color:'#2D2D2D', marginBottom:12}}>✏ 编辑记录信息</div>
            <div style={{display:'flex', flexDirection:'column', gap:14}}>
              <div>
                <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:5}}>任务名称</div>
                <input value={editTokenName} onChange={e=>setEditTokenName(e.target.value)}
                  style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:16, padding:'7px 11px', fontSize:14, fontFamily:'inherit', outline:'none'}}/>
              </div>
              <div>
                <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:5}}>做市商（MM）</div>
                <input value={editExpectedMM} onChange={e=>setEditExpectedMM(e.target.value)}
                  placeholder="例如：Wintermute、GSR..."
                  style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:16, padding:'7px 11px', fontSize:14, fontFamily:'inherit', outline:'none'}}/>
              </div>
              <div>
                <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:5}}>用户类型</div>
                <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
                  {['PI（专业投资者）','零售 Retail','两者','不适用'].map(opt=>(
                    <button key={opt} onClick={()=>setEditUserType(editUserType===opt?'':opt)} style={{
                      border:`${(editUserType===opt) ? '3px' : '2px'} solid #2D2D2D`,
                      borderRadius:16, padding:'5px 11px', cursor:'pointer',
                      background: editUserType===opt?'#A8D8F0':'white',
                      fontSize:12, fontWeight: editUserType===opt?700:400,
                      color: editUserType===opt?C.navy:'#2D2D2D',
                    }}>{opt}</button>
                  ))}
                </div>
              </div>
              <div>
                <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:5}}>当前卡点</div>
                <textarea value={editBlocker} onChange={e=>setEditBlocker(e.target.value)}
                  placeholder="例如：等待合规尽调、LP未确认…（支持中文，可拖右下角调整大小）"
                  rows={3}
                  style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:16, padding:'7px 11px', fontSize:14, fontFamily:'inherit', outline:'none', resize:'vertical', lineHeight:1.6}}/>
              </div>
              <div>
                <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:5}}>期望上线时间</div>
                <input type="datetime-local" value={editLaunchTime} onChange={e=>setEditLaunchTime(e.target.value)} step="3600"
                  style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:16, padding:'7px 11px', fontSize:14, fontFamily:'inherit', outline:'none'}}/>
              </div>
            </div>
            <div style={{fontSize:12, color:'#6B6B6B', marginTop:12, marginBottom:4}}>注：站点、产品、代币类型不可编辑（影响清单结构）</div>
            <div style={{display:'flex', gap:10, marginTop:12, justifyContent:'flex-end'}}>
              <button onClick={()=>setShowEditModal(false)} style={{border:'2px solid #2D2D2D', background:'white', borderRadius:16, padding:'9px 18px', fontSize:13, cursor:'pointer', color:'#6B6B6B', fontWeight:600}}>取消</button>
              <button onClick={saveEditModal} style={{border:'3px solid #2D2D2D', background:'#A8D8F0', color:'#2D2D2D', borderRadius:16, padding:'8px 18px', fontSize:13, cursor:'pointer', fontWeight:700, boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
            </div>
          </div>
        </div>
      )}
      {/* Cancel reason modal */}
      {showCancelModal && (
        <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:16}}>
          <div style={{background:'white', borderRadius:20, padding:22, width:'100%', maxWidth:440, boxShadow:'6px 6px 0 #2D2D2D'}}>
            <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontWeight:700, fontSize:17, color:'#2D2D2D', marginBottom:6}}>取消上币任务</div>
            <div style={{fontSize:13, color:'#6B6B6B', marginBottom:14}}>进度数据会完整保留，可随时恢复。请说明取消原因：</div>
            <textarea
              autoFocus
              value={cancelReason}
              onChange={e=>setCancelReason(e.target.value)}
              placeholder="例如：项目方撤回申请、合规未通过、暂缓上线..."
              rows={4}
              style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:20, padding:'8px 11px', fontSize:14, fontFamily:'inherit', resize:'vertical', outline:'none'}}
              onFocus={e=>e.target.style.borderColor='#2D2D2D'}
              onBlur={e=>e.target.style.borderColor='#2D2D2D'}
            />
            <div style={{display:'flex', gap:10, marginTop:16, justifyContent:'flex-end'}}>
              <button onClick={()=>setShowCancelModal(false)} style={{border:'2px solid #2D2D2D', background:'white', borderRadius:16, padding:'9px 18px', fontSize:13, cursor:'pointer', color:'#6B6B6B', fontWeight:600}}>返回</button>
              <button onClick={handleCancelConfirm} disabled={!cancelReason.trim()} style={{border:'none', background: cancelReason.trim() ? 'white' : '#F5F0E6', color: cancelReason.trim() ? '#2D2D2D' : '#6B6B6B', borderRadius:16, padding:'8px 18px', fontSize:13, cursor: cancelReason.trim() ? 'pointer' : 'not-allowed', fontWeight:700}}>确认取消</button>
            </div>
          </div>
        </div>
      )}
      {/* Header */}
      <div style={{background:'#7ECDC0', padding:'16px 24px', borderBottom:'3px solid #2D2D2D'}} className="no-print">
        <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:10}}>
          <button className="btn" onClick={onBack} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13}}>← 返回列表</button>
          <button className="btn" onClick={()=>window.print()} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13}}>🖨 打印</button>
          <button className="btn" onClick={openEditModal} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13}}>✏ 编辑信息</button>
          {record.annFields && (
            <button className="btn" onClick={()=>setShowAnn(true)} style={{background:'#FFFFFF', border:'2px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13, fontWeight:700}}>📢 查看公告</button>
          )}
          {isCancelled
            ? <button className="btn" onClick={handleRestore} style={{marginLeft:'auto', background:'rgba(16,185,129,0.25)', border:'2px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13, fontWeight:600}}>↩ 恢复任务</button>
            : <button className="btn" onClick={()=>{setCancelReason('');setShowCancelModal(true);}} style={{marginLeft:'auto', background:'rgba(220,38,38,0.25)', border:'2px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13, fontWeight:600}}>✕ 取消任务</button>
          }
        </div>
        <div style={{display:'flex', alignItems:'center', gap:10}}>
          <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", color:'#2D2D2D', fontWeight:700, fontSize:18}}>{record.tokenName}</div>
          {isCancelled && <span style={{background:'#FFFFFF', color:'#2D2D2D', fontSize:12, fontWeight:700, padding:'2px 10px', borderRadius:99, border:'2px solid #2D2D2D'}}>已取消</span>}
        </div>
        <div style={{color:'#2D2D2D', fontSize:13, marginTop:3}}>
          {siteInfo?.icon} {siteInfo?.label} · {prodInfo?.icon} {prodInfo?.label} · {record.tokenType==='newchain'?'⛓️ 新链':'🪙 子代币'} · 预计 {record.estimatedTime}
        </div>
      </div>

      <div style={{maxWidth:900, margin:'0 auto', padding:'20px 16px'}}>
        {/* Progress */}
        <div className="hl-card" style={{background:'white', borderRadius:20, padding:'16px 20px', marginBottom:11, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D', display:'flex', alignItems:'center', gap:16}}>
          <ProgressRing pct={pct} size={56} stroke={5}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:700, color: isCancelled?'#6B6B6B':isComplete?C.green:C.navy, fontSize:15}}>
              {isCancelled ? '🚫 已取消' : isComplete ? '🎉 全部完成！' : `${done} / ${total} 步骤完成`}
            </div>
            <div style={{background:'#F5F0E6', borderRadius:99, height:7, marginTop:8, overflow:'hidden'}}>
              <div style={{width:`${pct}%`, height:'100%', background:isComplete?'#A8E6CF':'#7ECDC0', borderRadius:99, transition:'width 0.3s'}}/>
            </div>
          </div>
          <div style={{fontSize:12, color:'#6B6B6B', textAlign:'right'}}>
            <div>创建：{fmtDate(record.createdAt)}</div>
            <div>更新：{fmtDate(record.updatedAt)}</div>
          </div>
        </div>

        {/* Cancelled banner */}
        {isCancelled && record.cancelReason && (
          <div style={{background:'#F7C8D4', border:'2px solid #2D2D2D', borderRadius:20, padding:'10px 14px', marginBottom:11, display:'flex', gap:10, alignItems:'flex-start'}}>
            <span style={{fontSize:16, flexShrink:0}}>🚫</span>
            <div>
              <div style={{fontSize:12, fontWeight:700, color:'#2D2D2D', marginBottom:2}}>取消原因</div>
              <div style={{fontSize:13, color:'#2D2D2D'}}>{record.cancelReason}</div>
            </div>
          </div>
        )}

        {/* Notes */}
        <div className="hl-card" style={{background:'white', borderRadius:20, padding:'11px 15px', marginBottom:11, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D'}} className="no-print">
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: editNote?10:0}}>
            <span style={{fontSize:13, fontWeight:700, color:'#2D2D2D'}}>📝 任务备注</span>
            {!editNote ? (
              <button onClick={()=>setEditNote(true)} style={{background:'none', border:'2px solid #2D2D2D', borderRadius:14, padding:'4px 10px', fontSize:12, cursor:'pointer', color:'#6B6B6B'}}>编辑</button>
            ) : (
              <div style={{display:'flex', gap:6}}>
                <button onClick={()=>{setEditNote(false);setNoteText(record.notes||'');}} style={{background:'none', border:'2px solid #2D2D2D', borderRadius:14, padding:'4px 10px', fontSize:12, cursor:'pointer', color:'#6B6B6B'}}>取消</button>
                <button onClick={saveNote} style={{background:'#FDE68A', border:'3px solid #2D2D2D', borderRadius:14, padding:'4px 12px', fontSize:12, cursor:'pointer', color:'#2D2D2D', fontWeight:700, boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
              </div>
            )}
          </div>
          {editNote ? (
            <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} rows={3}
              placeholder="记录进展、特殊说明、联系结果..."
              style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:16, padding:'10px', fontSize:13, fontFamily:'inherit', resize:'vertical'}}/>
          ) : (
            noteText ? <div style={{fontSize:13, color:'#6B6B6B', marginTop:6, lineHeight:1.6}}>{noteText}</div>
                     : <div style={{fontSize:12, color:'#6B6B6B', marginTop:2}}>点击编辑添加备注...</div>
          )}
        </div>

        {/* View mode toggle */}
        <div style={{display:'flex', gap:6, marginBottom:10}}>
          <button onClick={()=>setViewMode('phase')} style={{
            border:'2px solid #2D2D2D', background:viewMode==='phase'?'#FDE68A':'white',
            color:'#2D2D2D', borderRadius:16, padding:'5px 12px', fontSize:12, fontWeight:700, cursor:'pointer'}}>
            📋 阶段视图
          </button>
          <button onClick={()=>setViewMode('team')} style={{
            border:'2px solid #2D2D2D', background:viewMode==='team'?'#FDE68A':'white',
            color:'#2D2D2D', borderRadius:16, padding:'5px 12px', fontSize:12, fontWeight:700, cursor:'pointer'}}>
            🏊 团队视图（并行泳道）
          </button>
        </div>

        {/* Team lanes view — group by owner, show each team's progress in parallel */}
        {viewMode==='team' && (
          <div className="hl-card" style={{background:'white', borderRadius:20, padding:'12px 14px', marginBottom:11, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D'}}>
            {lanes.map(({owner, steps})=>{
              const doneCount = steps.filter(s=>checked[s.idx]||naSteps[s.idx]).length;
              const currentStep = steps.find(s=>!checked[s.idx] && !naSteps[s.idx]);
              const laneComplete = doneCount===steps.length;
              return (
                <div key={owner} style={{marginBottom:12}}>
                  <div style={{display:'flex', alignItems:'baseline', gap:8, marginBottom:7, flexWrap:'wrap'}}>
                    <span style={{fontSize:13, fontWeight:700, color:'#2D2D2D'}}>{laneComplete?'✅ ':''}{owner}</span>
                    <span style={{fontSize:11, color:'#6B6B6B'}}>{doneCount}/{steps.length}</span>
                    {currentStep && <span style={{fontSize:11, color:'#2D2D2D', fontWeight:600}}>· 等 {currentStep.contact}</span>}
                  </div>
                  <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
                    {steps.map(s=>{
                      const isDone = !!checked[s.idx];
                      const isNA = !isDone && !!naSteps[s.idx];
                      const isCurrent = !!currentStep && s.idx===currentStep.idx;
                      return (
                        <span key={s.idx}
                          onClick={()=>{ if(s.inputType==='approval'){ addToast&&addToast('该步骤需由审批人逐一签字，不能手动勾选'); return; } toggle(s.idx); }}
                          title={s.task + (s.contact?(' · '+s.contact):'')}
                          style={{fontSize:12, padding:'6px 11px', borderRadius:16, cursor:'pointer',
                            background:isDone?'#A8E6CF':isNA?'#F5F0E6':isCurrent?'#A8D8F0':'white',
                            color:isDone?'#2D2D2D':isNA?'#6B6B6B':isCurrent?'#2D2D2D':'#6B6B6B',
                            border:'2px solid #2D2D2D',
                            fontWeight:isCurrent?700:400, textDecoration:isNA?'line-through':'none'}}>
                          {isDone?'✓ ':''}{s.task}
                        </span>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* Phase groups */}
        {viewMode==='phase' && phases.map((phase,pi)=>{
          const pc = PHASE_COLORS[phase.tag]||PHASE_COLORS.exec;
          const pd = phase.steps.filter(s=>checked[s.idx]).length;
          return (
            <div key={pi} style={{marginBottom:10}}>
              <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:6, padding:'0 4px'}}>
                <div style={{background:pc.border, borderRadius:99, padding:'3px 12px', fontSize:12, fontWeight:700, color:'#2D2D2D'}}>{phase.name}</div>
                <div style={{fontSize:12, color:'#6B6B6B'}}>{pd}/{phase.steps.length} 完成</div>
              </div>
              {phase.steps.map(step=>{
                const isDone = !!checked[step.idx];
                const isNA   = !isDone && !!(naSteps[step.idx]);
                const isExp  = !!expandedSteps[step.idx];
                const hasNote = step.note && step.note.trim();
                const myNote  = stepNotes[step.idx] || '';
                const isEditingNote = editingStepNote === step.idx;
                const bg = isDone ? '#A8E6CF' : isNA ? '#FFFFFF' : 'white';
                const borderColor = isDone ? '#A8E6CF' : isNA ? '#F5F0E6' : step.critical ? '#F7C8D4' : '#F5F0E6';
                const leftColor   = isDone ? '#2D2D2D' : isNA ? '#6B6B6B' : step.critical ? '#2D2D2D' : pc.border;
                return (
                  <div key={step.idx} style={{background:bg, border:'1px solid '+borderColor, borderLeft:'4px solid '+leftColor,
                    borderRadius:20, marginBottom:8, overflow:'hidden', boxShadow:'4px 4px 0 #2D2D2D', transition:'all 0.15s'}}>
                    <div style={{display:'flex', alignItems:'flex-start', padding:'11px 14px', gap:10}}>
                      {/* Done checkbox */}
                      <div onClick={()=>{ if(step.inputType==='approval'){ addToast&&addToast('该步骤需由审批人逐一签字，不能手动勾选'); return; } toggle(step.idx); }} style={{width:22,height:22,borderRadius:14,
                        border:'2px solid #2D2D2D',
                        background:isDone?'#A8E6CF':'white', display:'flex',alignItems:'center',justifyContent:'center',
                        flexShrink:0, marginTop:2, cursor:'pointer', transition:'all 0.15s'}}>
                        {isDone && <span style={{color:'#2D2D2D',fontSize:13,fontWeight:700}}>✓</span>}
                      </div>
                      {/* Step info */}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                          <span style={{fontWeight:700,fontSize:14,
                            color: isDone?'#6B6B6B': isNA?'#6B6B6B':'#2D2D2D',
                            textDecoration: isDone||isNA?'line-through':'none'}}>
                            {step.idx+1}. {step.task}
                          </span>
                          {isNA && <span style={{background:'#F5F0E6',color:'#6B6B6B',fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:99}}>不需要</span>}
                          {step.critical && !isDone && !isNA && <span style={{background:'#F7C8D4',color:'#2D2D2D',fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:99}}>关键</span>}
                        </div>
                        {/* Text input for inputType=text */}
                        {step.inputType==='text' && !isNA && (
                          <div style={{marginTop:6}}>
                            <input value={stepFields[step.inputKey]||''}
                              onChange={e=>setStepField(step.inputKey,e.target.value,step.idx)}
                              onClick={e=>e.stopPropagation()}
                              placeholder={`输入${step.task}…`}
                              style={{width:'100%',fontSize:13,border:'2px solid #2D2D2D',
                                borderRadius:16,padding:'6px 9px',outline:'none',fontFamily:'inherit',
                                background:stepFields[step.inputKey]?'#A8E6CF':'white',boxSizing:'border-box'}}/>
                          </div>
                        )}
                        {/* Select for inputType=select */}
                        {step.inputType==='select' && !isNA && (
                          <div style={{display:'flex',gap:6,marginTop:6,flexWrap:'wrap'}}>
                            {(step.inputOptions||[]).map(opt=>{
                              const sel = stepFields[step.inputKey]===opt;
                              return (
                                <button key={opt} onClick={e=>{e.stopPropagation();setStepField(step.inputKey,sel?'':opt,step.idx);}}
                                  style={{fontSize:12,padding:'4px 12px',borderRadius:14,cursor:'pointer',
                                    background:sel?'#FDE68A':'white',color:'#2D2D2D',
                                    border:`${(sel) ? '3px' : '2px'} solid #2D2D2D`,fontWeight:sel?700:400}}>
                                  {opt}
                                </button>
                              );
                            })}
                          </div>
                        )}
                        {/* Approval sign-off for inputType=approval */}
                        {step.inputType==='approval' && !isNA && (()=>{
                          const signed = (record.approvals||{})[step.inputKey] || {};
                          const approvers = step.inputOptions||[];
                          const nSigned = approvers.filter(n=>signed[n]).length;
                          return (
                            <div style={{marginTop:8}} onClick={e=>e.stopPropagation()}>
                              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                                <span style={{fontSize:12,fontWeight:700,color:'#2D2D2D'}}>
                                  并行会签 {nSigned}/{approvers.length}
                                </span>
                                <div style={{flex:1,height:5,background:'#F5F0E6',borderRadius:99,overflow:'hidden'}}>
                                  <div style={{width:(approvers.length?nSigned/approvers.length*100:0)+'%',height:'100%',background:nSigned===approvers.length? 'white' :'#2D2D2D',transition:'width 0.2s'}}/>
                                </div>
                                {nSigned===approvers.length && <span style={{fontSize:11,fontWeight:700,color:'#2D2D2D'}}>🔓 已通过</span>}
                              </div>
                              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                                {approvers.map(name=>{
                                  const at = signed[name];
                                  return (
                                    <button key={name} onClick={()=>toggleApproval(step.inputKey,name,approvers,step.idx)}
                                      title={at?('已签字：'+new Date(at).toLocaleString('zh-CN')):'点击签字'}
                                      style={{display:'flex',alignItems:'center',gap:5,fontSize:12,padding:'5px 11px',borderRadius:99,cursor:'pointer',
                                        border:`${(at) ? '3px' : '2px'} solid #2D2D2D`,background:at?'#A8E6CF':'white',
                                        color:'#2D2D2D',fontWeight:at?700:500}}>
                                      <span>{at?'✅':'⭕'}</span>{name}
                                    </button>
                                  );
                                })}
                              </div>
                              <div style={{fontSize:11,color:'#6B6B6B',marginTop:5}}>每人各自点击签字；五人全签齐后闸门自动通过</div>
                            </div>
                          );
                        })()}
                        {!step.inputType && <div style={{display:'flex',gap:12,marginTop:4,flexWrap:'wrap'}}>
                          <span style={{fontSize:12,color:'#6B6B6B'}}>👤 {step.owner}</span>
                          <span style={{fontSize:12,color:'#2D2D2D',fontWeight:600}}>📞 {step.contact}</span>
                          <span style={{fontSize:12,color:'#6B6B6B'}}>⏱ {step.time}</span>
                        </div>}
                        {/* Per-step note display */}
                        {myNote && !isEditingNote && (
                          <div style={{marginTop:6, background:'#FDE68A', border:'2px solid #2D2D2D', borderRadius:14,
                            padding:'5px 10px', fontSize:12, color:'#2D2D2D', display:'flex', gap:6, alignItems:'flex-start'}}>
                            <span>📌</span><span style={{flex:1}}>{myNote}</span>
                          </div>
                        )}
                        {/* Note editor */}
                        {isEditingNote && (
                          <div style={{marginTop:6}}>
                            <textarea autoFocus value={stepNoteVal} onChange={e=>setStepNoteVal(e.target.value)}
                              placeholder="填写备注信息，如负责人确认结果、截图说明等..."
                              rows={2} style={{width:'100%',fontSize:12,border:'2px solid #2D2D2D',borderRadius:14,
                                padding:'6px 8px',fontFamily:'inherit',resize:'vertical',outline:'none',boxSizing:'border-box'}}/>
                            <div style={{display:'flex',gap:6,marginTop:4}}>
                              <button onClick={()=>saveStepNote(step.idx)} style={{background:'#FDE68A',color:'#2D2D2D',border:'3px solid #2D2D2D',borderRadius:14,padding:'4px 12px',fontSize:12,cursor:'pointer',fontWeight:600, boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
                              <button onClick={()=>setEditingStepNote(null)} style={{background:'none',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 10px',fontSize:12,cursor:'pointer',color:'#6B6B6B'}}>取消</button>
                              {myNote && <button onClick={()=>{setStepNoteVal('');saveStepNote(step.idx);}} style={{background:'none',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 10px',fontSize:12,cursor:'pointer',color:'#2D2D2D'}}>清除</button>}
                            </div>
                          </div>
                        )}
                      </div>
                      {/* Action buttons: N/A + Note + Expand */}
                      <div style={{display:'flex',gap:4,flexShrink:0,alignItems:'center',marginTop:2}}>
                        <button onClick={e=>{e.stopPropagation();toggleNA(step.idx);}}
                          title="标记为不需要"
                          style={{fontSize:11,fontWeight:600,padding:'3px 7px',borderRadius:12,cursor:'pointer',
                            background:isNA?'#F5F0E6':'none', color:isNA?'#6B6B6B':'#6B6B6B',
                            border:'2px solid #2D2D2D',
                            transition:'all 0.15s'}}>N/A</button>
                        <button onClick={e=>{e.stopPropagation();setEditingStepNote(isEditingNote?null:step.idx);setStepNoteVal(myNote);}}
                          title="添加备注信息"
                          style={{fontSize:12,padding:'3px 6px',borderRadius:12,cursor:'pointer',
                            background:myNote?'#FDE68A':'none', color:myNote? '#2D2D2D' :'#6B6B6B',
                            border:'2px solid #2D2D2D'}}>📝</button>
                        {hasNote && (
                          <button onClick={e=>{e.stopPropagation();setExpandedSteps(p=>({...p,[step.idx]:!p[step.idx]}));}}
                            style={{background:'none',border:'2px solid #2D2D2D',cursor:'pointer',fontSize:13,color:'#6B6B6B',padding:'3px 5px',borderRadius:12}}>
                            {isExp?'▲':'▼'}
                          </button>
                        )}
                      </div>
                    </div>
                    {hasNote && isExp && (
                      <div style={{background:'#FDE68A',borderTop:'2px solid #2D2D2D',padding:'10px 14px 10px 48px'}}>
                        {step.note.split('\n').map((l,i)=>(
                          <div key={i} style={{fontSize:12,color:'#6B6B6B',lineHeight:1.6}}>{l}</div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Completed Table ──────────────────────────────────────────────────────────
function CompletedTable({ records, onBack }) {
  const [copied, setCopied] = useState(false);

  const completed = records.filter(r => getRecordStatus(r, buildChecklist(r.site,r.product,r.tokenType,{stableHub:r.stableHub,launchpool:r.launchpool}).length) === 'completed');

  const COLS = ['Token','区块链','交易对','站点','交易类型','用户类型','上线时间'];
  const toRow = r => [
    r.tokenSymbol || r.tokenName,
    (r.chainLabels||[]).join(' / ') || '—',
    r.chainOnly ? '仅上链' : (r.quoteCurrencies||[]).length>0 ? (r.quoteCurrencies).map(q=>`${r.tokenSymbol||r.tokenName}/${q}`).join(', ') : r.tokenName,
    r.site,
    r.product + (r.stableHub?' +SH':''),
    r.userType || '—',
    r.expectedLaunchTime ? fmtLaunchTime(r.expectedLaunchTime) : fmtDate(r.updatedAt),
  ];

  const exportExcel = () => {
    const ws = XLSX.utils.aoa_to_sheet([COLS, ...completed.map(toRow)]);
    // Column widths
    ws['!cols'] = [16,20,30,10,14,16,16].map(w=>({wch:w}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '已完成上币');
    XLSX.writeFile(wb, `OSL已完成上币_${toLocalDateStr(new Date())}.xlsx`);
  };

  const copyTSV = () => {
    const lines = [COLS, ...completed.map(toRow)].map(r=>r.join('\t')).join('\n');
    navigator.clipboard.writeText(lines).then(()=>{
      setCopied(true); setTimeout(()=>setCopied(false), 2000);
    });
  };

  return (
    <div>
      <div style={{background:'#7ECDC0', padding:'16px 24px', display:'flex', alignItems:'center', gap:16, borderBottom:'3px solid #2D2D2D'}}>
        <button className="btn" onClick={onBack} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13}}>← 返回</button>
        <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", color:'#2D2D2D', fontWeight:700, fontSize:16}}>已完成上币记录</div>
        <div style={{marginLeft:'auto', display:'flex', gap:8}}>
          <button onClick={copyTSV} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 14px', cursor:'pointer', fontSize:13, fontWeight:600}}>
            {copied ? '✓ 已复制' : '📋 一键复制'}
          </button>
          <button onClick={exportExcel} style={{background:'#A8E6CF', border:'3px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'6px 14px', cursor:'pointer', fontSize:13, fontWeight:700, boxShadow:'3px 3px 0 #2D2D2D'}}>
            ⬇ 导出 Excel
          </button>
        </div>
      </div>
      <div style={{maxWidth:1000, margin:'0 auto', padding:'20px 16px'}}>
        {completed.length === 0 ? (
          <div style={{textAlign:'center', padding:'60px 0', color:'#6B6B6B'}}>
            <div style={{fontSize:40, marginBottom:10}}>🎉</div>
            <div style={{fontSize:15, fontWeight:600}}>暂无已完成的上币任务</div>
          </div>
        ) : (
          <div style={{background:'white', borderRadius:20, overflow:'hidden', boxShadow:'4px 4px 0 #2D2D2D'}}>
            <table style={{width:'100%', borderCollapse:'collapse', fontSize:13}}>
              <thead>
                <tr style={{background:'#FDE68A'}}>
                  {COLS.map(col=>(
                    <th key={col} style={{padding:'8px 12px', textAlign:'left', fontWeight:700, color:'#2D2D2D', borderBottom:'2px solid #2D2D2D', whiteSpace:'nowrap'}}>{col}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {completed.map((r,i)=>{
                  const row = toRow(r);
                  const siteInfo = SITES.find(s=>s.id===r.site);
                  return (
                    <tr key={r.id} style={{background: i%2===0?'white':'#F5F0E6', borderBottom:'2px solid #2D2D2D'}}>
                      <td style={{padding:'8px 12px', fontWeight:700, color:'#2D2D2D'}}>{row[0]}</td>
                      <td style={{padding:'8px 12px', color:'#2D2D2D'}}>{row[1]}</td>
                      <td style={{padding:'8px 12px', color:'#2D2D2D'}}>{row[2]}</td>
                      <td style={{padding:'8px 12px'}}>
                        <span style={{background:siteInfo?.bg, color:siteInfo?.color, fontWeight:700, fontSize:11, padding:'2px 8px', borderRadius:99}}>{siteInfo?.icon} {r.site}</span>
                      </td>
                      <td style={{padding:'8px 12px', color:'#2D2D2D'}}>{row[4]}</td>
                      <td style={{padding:'8px 12px', color:'#6B6B6B'}}>{row[5]}</td>
                      <td style={{padding:'8px 12px', color:'#2D2D2D', fontWeight:600}}>{row[6]}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div style={{padding:'10px 16px', background:'#FDE68A', borderTop:'2px solid #2D2D2D', fontSize:12, color:'#2D2D2D'}}>
              共 {completed.length} 条记录
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
