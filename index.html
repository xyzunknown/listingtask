// 运行时缓存：公告组件是临时打开的，直接读这个对象，App 启动时会用云端版本覆盖
let ANN_TPL = JSON.parse(JSON.stringify(ANN_TPL_DEFAULT));
function annTpl(siteGroup, lang, field) {
  const g = (ANN_TPL && ANN_TPL[siteGroup]) || {};
  const l = g[lang] || {};
  return l[field] || ((ANN_TPL_DEFAULT[siteGroup] || {})[lang] || {})[field] || '';
}
function saveAnnTplLocal(v) { try { localStorage.setItem(ANN_TPL_LOCAL_KEY, JSON.stringify(v)); } catch (e) {} }
function loadAnnTplLocal() { try { return JSON.parse(localStorage.getItem(ANN_TPL_LOCAL_KEY) || 'null'); } catch (e) { return null; } }
async function loadAnnTemplates() {
  try {
    const { data, error } = await db.from('ann_templates').select('data').eq('id','main').maybeSingle();
    if (error) { console.warn('公告模板表还没建，先用内置文案:', error.message); return null; }
    return data ? data.data : null;
  } catch (e) { console.warn('公告模板读取失败，先用内置文案', e); return null; }
}
async function syncAnnTemplates(v) {
  saveAnnTplLocal(v);
  try {
    const { error } = await db.from('ann_templates').upsert({ id:'main', data: v, updated_at: new Date().toISOString() });
    if (error) console.error('公告模板保存失败:', error.message);
    return !error;
  } catch (e) { console.error('公告模板保存异常', e); return false; }
}

    /公告|审批/.test(t)                        ? 0 :

    /通知|挂单|验证|划转|跨链|提币/.test(t)     ? 2 :
    /流动性|面客/.test(t)                      ? 3 :
    /宣发|Marketing/i.test(t)                  ? 5 : 4;
  return s

    .sort((a, b) =>

      (a.i - b.i))
    .map(x => x.st);
}

// ⚠️ 日期一律用本地日历日格式化，不要用 toISOString().slice(0,10)——
// toISOString 会先转成 UTC，在 UTC+8（香港/中国）时区，本地日期 00:00 转成 UTC 会变成"前一天"，
// 之前就是这个 bug 导致「今天」默认日期、预测流水的日期都悄悄早了一天，长期下来对不上账。
function toLocalDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// 本周（周一~周日）的日期区间字符串，用来判断"本周新增"
function thisWeekRange() {
  const now = new Date(); now.setHours(0,0,0,0);
  const day = now.getDay(); // 0=周日
  const diffToMon = (day===0 ? -6 : 1-day);
  const mon = new Date(now); mon.setDate(now.getDate()+diffToMon);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return { start: toLocalDateStr(mon), end: toLocalDateStr(sun) };
}
// 某年某月第 n 个工作日（跳过周六周日）
function nthWorkingDayOfMonth(year, monthIdx, n) {
  let count = 0;
  let d = new Date(year, monthIdx, 1);
  while (true) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) { count++; if (count === n) return new Date(d); }
    d.setDate(d.getDate()+1);
    if (d.getMonth() !== monthIdx && count===0) break; // safety
  }
}

// 用冻结的 V1 清单还原当时的序号含义，所以之后往清单里插多少新步骤都不会影响这次对应关系。
function migrateStepKeys(r) {
  if (!r || r.stepKeysV2) return r;
  try {
    const opts = { stableHub: r.stableHub, launchpool: r.launchpool };
    const oldList = buildChecklistV1(r.site, r.product, r.tokenType, opts) || [];
    const newList = buildChecklist(r.site, r.product, r.tokenType, opts) || [];
    const idByContent = {};
    newList.forEach(st => {
      const key = st.phase + '|' + st.task;
      (idByContent[key] || (idByContent[key] = [])).push(st.id);
    });
    const occurrence = {};
    const idByOldIndex = oldList.map(st => {
      const key = st.phase + '|' + st.task;
      const n = occurrence[key] || 0;
      occurrence[key] = n + 1;
      return (idByContent[key] || [])[n] || STEP_RENAMES[key];
    });
    let lost = 0;
    const remap = (obj) => {
      const out = {};
      Object.entries(obj || {}).forEach(([k, v]) => {
        const old = oldList[+k];
        if (!old) { lost++; return; }
        const id = idByOldIndex[+k];
        if (id) out[id] = v; else lost++;
      });
      return out;
    };
    const migrated = { ...r, checked: remap(r.checked), naSteps: remap(r.naSteps), stepNotes: remap(r.stepNotes), stepKeysV2: true };
    if (lost) console.warn('迁移时有', lost, '项没对上:', r.tokenName || r.id);
    return migrated;
  } catch (e) { console.error('迁移失败', r && r.id, e); return r; }
}

// ⚠ 只能数"当前清单里真实存在的步骤"。
// 老记录的 checked 里会留着已经删掉 / 改过的步骤 id（流程改过很多版），
// 直接 Object.values(checked) 一数就会比 total 多，done===total 永远不成立，
// 于是全部勾完了状态还卡在"进行中"。
function countDone(checked, naSteps, checklist) {
  if (Array.isArray(checklist)) {
    return checklist.filter(st => (checked || {})[st.id] || (naSteps || {})[st.id]).length;
  }
  // 没传清单时退回老算法（只剩少数兼容场景）
  return Object.values(checked||{}).filter(Boolean).length
       + Object.values(naSteps||{}).filter(Boolean).length;
}
// 清单里有多少步是"真的能勾完的"——全是现成步骤，直接就是长度
function computeStatus(checked, totalOrList, naSteps) {
  const list  = Array.isArray(totalOrList) ? totalOrList : null;
  const total = list ? list.length : totalOrList;
  const done  = countDone(checked, naSteps, list);
  if (!total) return 'not_started';
  if (done === 0) return 'not_started';
  return done >= total ? 'completed' : 'in_progress';
}
// 第二个参数传清单数组（推荐）或步骤总数（老用法）
function getRecordStatus(r, totalOrList) {
  if (r.cancelled) return 'cancelled';
  return computeStatus(r.checked||{}, totalOrList, r.naSteps||{});
}
function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtLaunchTime(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:00`;
}
// datetime-local input needs "YYYY-MM-DDTHH:MM"
function toInputVal(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`;
}

function ProgressRing({ pct, size=48, stroke=4, color='#7ECDC0' }) {
  const r = (size-stroke)/2, circ = 2*Math.PI*r;
  return (
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#F5F0E6" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={pct===100?'#A8E6CF':color} strokeWidth={stroke}
        strokeDasharray={circ} strokeDashoffset={circ*(1-pct/100)} strokeLinecap="round" style={{transition:'stroke-dashoffset 0.4s'}}/>
      <text x={size/2} y={size/2} textAnchor="middle" dominantBaseline="middle"
        style={{fill:'#2D2D2D', fontSize:12, fontWeight:700, transform:'rotate(90deg)', transformOrigin:`${size/2}px ${size/2}px`}}>
        {pct}%
      </text>
    </svg>
  );
}

  const [showImportModal, setShowImportModal] = useState(false);
  const [importPreview, setImportPreview] = useState(null); // {newRecords, skipCount}

  const openCancelModal = (e, id) => {

    setCancelReason('');
  };

  const handleImportFile = (file) => {
    if (!file) return;
    setImportFile(file);
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, {type:'binary', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        const SITE_MAP = {'OSL HK':'HK','HK':'HK','Global':'Global','OSL Global':'Global','OSL ID':'ID','OSL ID ':'ID','ID':'ID'};
        const PRODUCT_MAP = {'OTC':'OTC','Orderbook':'Orderbook','RFQ':'RFQ','仅上链':'ChainOnly','理财代币':'WealthToken'};
        const IGNORE_PRODUCTS = ['StableHub','Launchpool'];
        const newRecords = [];
        rows.forEach(row => {
          const ticker = (row['Token Ticker']||row['Token']||'').toString().trim();
          if (!ticker) return;
          const siteRaw = (row['站点']||row['Site']||'').toString().trim();
          const productRaw = (row['交易类型']||row['Product']||'').toString().trim();
          // Parse sites (may be comma-separated)
          const siteParts = siteRaw.split(',').map(s=>s.trim()).filter(Boolean);
          const sites = siteParts.map(s=>SITE_MAP[s]).filter(Boolean);
          if (sites.length === 0) sites.push('HK'); // default
          // Parse products (may be comma-separated), filter out ignored ones
          const productParts = productRaw.split(',').map(s=>s.trim()).filter(Boolean);
          const stableHub = productParts.some(p=>p==='StableHub');
          const launchpool = productParts.some(p=>p==='Launchpool');
          const products = productParts.filter(p=>!IGNORE_PRODUCTS.includes(p)).map(p=>PRODUCT_MAP[p]).filter(Boolean);
          if (products.length === 0) products.push('OTC'); // default
          // Parse chain labels
          const chainRaw = (row['区块链']||row['Chain']||'').toString().trim();
          const chainLabels = chainRaw ? chainRaw.split('/').map(s=>s.trim()).filter(Boolean) : [];
          // Parse quote currencies
          const quoteRaw = (row['交易对名称']||row['交易对']||'').toString().trim();
          const quoteCurrencies = quoteRaw ? quoteRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
          // Parse launch time
          let expectedLaunchTime = null;
          const ltRaw = row['预计上线时间']||row['Expected Launch Time']||'';
          if (ltRaw instanceof Date) {
            expectedLaunchTime = ltRaw.toISOString();
          } else if (typeof ltRaw === 'number' && ltRaw > 0) {
            const d = XLSX.SSF.parse_date_code(ltRaw);
            if (d) expectedLaunchTime = new Date(d.y,d.m-1,d.d,d.H||0,d.M||0).toISOString();
          } else if (typeof ltRaw === 'string' && ltRaw.trim()) {
            const parsed = new Date(ltRaw.trim());
            if (!isNaN(parsed)) expectedLaunchTime = parsed.toISOString();
          }
          const userType = (row['用户类型']||row['User Type']||'').toString().trim();
          const expectedMM = (row['做市商']||row['MM']||'').toString().trim();
          const tokenSymbol = ticker.toUpperCase();
          const tokenName = quoteCurrencies.length > 0 ? quoteCurrencies.map(q=>`${tokenSymbol}/${q}`).join(', ') : tokenSymbol;
          sites.forEach(site => {
            products.forEach(product => {
              newRecords.push({
                _key: tokenSymbol+'|'+site+'|'+product,
                id: genId(),
                tokenName, tokenSymbol, quoteCurrencies,
                chainLabels, chainOnly: product==='ChainOnly',
                chains: [], userType, expectedMM, expectedLaunchTime,
                site, product, tokenType:'subtoken',
                stableHub: site==='Global' && product==='RFQ' ? stableHub : false,
                launchpool: site==='ID' ? launchpool : false,
                blocker: '', checked: {}, naSteps: {}, stepNotes: {}, notes: '',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                estimatedTime: estimateTime(site, product, 'subtoken'),
              });
            });
          });
        });
        // Deduplicate against existing records
        const existingKeys = new Set(records.map(r=>(r.tokenSymbol||r.tokenName).toUpperCase()+'|'+r.site+'|'+r.product));
        const toImport = newRecords.filter(r=>!existingKeys.has(r._key));
        const skipCount = newRecords.length - toImport.length;
        setImportPreview({newRecords: toImport.map(r=>{const {_key,...rest}=r;return rest;}), skipCount});
      } catch(err) {
        console.error('Import error:', err);
        alert('解析文件失败：'+err.message);
      }
    };
    reader.readAsBinaryString(file);
  };

  const confirmImport = () => {
    if (!importPreview || !importPreview.newRecords.length) return;
    onImport(importPreview.newRecords);
    setShowImportModal(false);

  };

  const filtered = records.filter(r => {
    if (siteFilter && r.site !== siteFilter) return false;
    if (filter==='all') return true;
    const checklist = buildChecklist(r.site, r.product, r.tokenType, {stableHub: r.stableHub, launchpool: r.launchpool});
    const status = getRecordStatus(r, checklist);
    return status === filter;
  });

  const STATUS_ORDER = { in_progress:0, not_started:1, completed:2, cancelled:3 };

    const sA = STATUS_ORDER[getRecordStatus(a, clA)] ?? 99;
    const sB = STATUS_ORDER[getRecordStatus(b, clB)] ?? 99;
    if (sA !== sB) return sA - sB;
    // 进行中：有预期上线时间的排前面，按时间升序（最近截止的优先）
    if (sA === 0) {
      if (a.expectedLaunchTime && b.expectedLaunchTime)
        return new Date(a.expectedLaunchTime) - new Date(b.expectedLaunchTime);
      if (a.expectedLaunchTime) return -1;
      if (b.expectedLaunchTime) return 1;

  return (

              style={{display:'block', marginBottom:12, fontSize:13, fontFamily:'inherit'}}/>
            {importPreview && (
              <div style={{background: importPreview.newRecords.length>0?'#A8E6CF':'#FDE68A', border:`${(importPreview.newRecords.length>0) ? '3px' : '2px'} solid #2D2D2D`, borderRadius:20, padding:'10px 14px', marginBottom:12, fontSize:13}}>
                <div style={{fontWeight:700, color:'#2D2D2D', marginBottom:4}}>
                  将导入 <span style={{color:'#2D2D2D'}}>{importPreview.newRecords.length}</span> 条新记录，跳过 <span style={{color:'#2D2D2D'}}>{importPreview.skipCount}</span> 条重复记录
                </div>
                {importPreview.newRecords.length > 0 && (
                  <div style={{marginTop:8, maxHeight:160, overflowY:'auto', display:'flex', flexDirection:'column', gap:4}}>
                    {importPreview.newRecords.slice(0,8).map((r,i)=>(
                      <div key={i} style={{fontSize:12, color:'#2D2D2D'}}>
                        {SITES.find(s=>s.id===r.site)?.icon} <strong>{r.tokenSymbol}</strong> · {r.site} · {r.product}
                        {r.expectedLaunchTime && <span style={{color:'#2D2D2D', marginLeft:6}}>🗓 {fmtLaunchTime(r.expectedLaunchTime)}</span>}
                      </div>
                    ))}
                    {importPreview.newRecords.length > 8 && <div style={{fontSize:12, color:'#6B6B6B'}}>还有 {importPreview.newRecords.length-8} 条...</div>}
                  </div>

              <button onClick={confirmImport} disabled={!importPreview||!importPreview.newRecords.length} style={{border:'none', background:(importPreview&&importPreview.newRecords.length)? 'white' :'#F5F0E6', color:(importPreview&&importPreview.newRecords.length)? '#2D2D2D' :'#6B6B6B', borderRadius:16, padding:'8px 18px', fontSize:13, cursor:(importPreview&&importPreview.newRecords.length)?'pointer':'not-allowed', fontWeight:700}}>确认导入</button>
            </div>
          </div>
        </div>

      {/* Cancel modal */}
      {cancelTarget && (

                      <span style={{fontSize:12, color:'#6B6B6B'}}>{r.cancelReason}</span>
                    </div>
                  )}
                  {pendingCritical.length>0 && (
                    <div style={{borderTop:'2px solid #2D2D2D', background:'#F7C8D4', padding:'7px 16px 7px 20px', display:'flex', flexDirection:'column', gap:4}}>
                      <div style={{fontSize:11, fontWeight:700, color:'#2D2D2D', letterSpacing:0.3}}>PENDING 关键项</div>
                      {pendingCritical.slice(0,3).map((step,i)=>(
                        <div key={i} style={{display:'flex', alignItems:'baseline', gap:7}}>
                          <span style={{width:14, height:14, borderRadius:3, border:'2px solid #2D2D2D', display:'inline-flex', alignItems:'center', justifyContent:'center', flexShrink:0}}>
                            <span style={{fontSize:8, color:'#2D2D2D'}}>✕</span>
                          </span>
                          <span style={{fontSize:12, color:'#2D2D2D', fontWeight:600}}>{step.task}</span>
                          <span style={{fontSize:11, color:'#6B6B6B', flexShrink:0}}>— {step.contact.split('\n')[0]}</span>
                        </div>
                      ))}
                      {pendingCritical.length>3 && <div style={{fontSize:11, color:'#2D2D2D'}}>还有 {pendingCritical.length-3} 项...</div>}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── New Listing Wizard ───────────────────────────────────────────────────────
function NewListingWizard({ onSave, onCancel, existingRecords, onOpenExisting }) {
  const [site, setSite] = useState(null);
  const [products, setProducts] = useState([]); // multi-select
  const [tokenType, setTokenType] = useState(null);
  const [tokenSymbol, setTokenSymbol] = useState('');
  const [quoteCurrencies, setQuoteCurrencies] = useState([]); // selected quote currencies
  const [chainOnly, setChainOnly] = useState(false);          // 仅上链
  const [chains, setChains] = useState([]);
  const [customChain, setCustomChain] = useState('');
  const [userType, setUserType] = useState('');
  const [expectedMM, setExpectedMM] = useState('');
  const [wizardLaunchTime, setWizardLaunchTime] = useState('');
  const [stableHub, setStableHub] = useState(null);
  const [launchpool, setLaunchpool] = useState(null);
  const [dupWarning, setDupWarning] = useState(null);

  // ── Announcement fields (ChainOnly) ──────────────────────────────────────────
  const [annTokenSymbols, setAnnTokenSymbols] = useState('');
  const [annTokenFullName, setAnnTokenFullName] = useState('');
  const [annChainName, setAnnChainName]       = useState('');
  const [annChainSuffix, setAnnChainSuffix]   = useState('');
  const [annDepositStatus, setAnnDepositStatus] = useState('Opened');
  const [annTradingPairs, setAnnTradingPairs]   = useState('');
  const [annAboutEN, setAnnAboutEN] = useState('');
  const [annAboutZH, setAnnAboutZH] = useState('');
  const [annAboutTC, setAnnAboutTC] = useState('');
  const [annWebsite, setAnnWebsite] = useState('');
  const [annWhitepaper, setAnnWhitepaper] = useState('');
  const [annTwitter, setAnnTwitter]   = useState('');
  const [annAboutLang, setAnnAboutLang] = useState('EN');

  const QUOTE_OPTIONS = ['USD','USDT','USDC','BTC','HKD','IDR'];
  const [customQuote, setCustomQuote] = useState('');
  const addCustomQuote = () => {
    const v = customQuote.trim().toUpperCase();
    if (!v || quoteCurrencies.includes(v)) { setCustomQuote(''); return; }
    setQuoteCurrencies(prev=>[...prev, v]);
    setCustomQuote('');
  };
  const toggleQuote = (q) => {
    if (chainOnly) return;
    setQuoteCurrencies(prev => prev.includes(q) ? prev.filter(x=>x!==q) : [...prev,q]);
  };
  const toggleChainOnly = () => {
    setChainOnly(v => { if (!v) setQuoteCurrencies([]); return !v; });
  };

  const toggleProduct = (id) => {
    setProducts(prev => prev.includes(id) ? prev.filter(p=>p!==id) : [...prev, id]);
    if (id==='RFQ' && products.includes('RFQ')) setStableHub(null); // deselecting RFQ clears StableHub
  };
  const needsStableHub  = site==='Global' && products.includes('RFQ');
  const needsLaunchpool = site==='ID' && products.length > 0;
  const canCreate = site && products.length > 0 && tokenType && tokenSymbol.trim()
    && (!needsStableHub  || stableHub  !== null)
    && (!needsLaunchpool || launchpool !== null);

  const toggleChain = (id) => setChains(prev => prev.includes(id) ? prev.filter(c=>c!==id) : [...prev, id]);
  const addCustomChain = () => {
    const v = customChain.trim();
    if (!v) return;
    const id = 'CUSTOM_'+v.toUpperCase();
    if (!chains.includes(id)) setChains(prev=>[...prev, id]);
    setCustomChain('');
  };
  // Derive display name
  const derivedName = () => {
    const sym = tokenSymbol.trim();
    if (!sym) return '';
    if (chainOnly) return `${sym}（仅上链）`;
    if (quoteCurrencies.length > 0) return quoteCurrencies.map(q=>`${sym}/${q}`).join(', ');
    return sym;
  };

  const doCreate = () => {
    const lp = needsLaunchpool ? !!launchpool : false;
    const chainLabels = chains.map(id => {
      const c = CHAINS.find(c=>c.id===id);
      return c ? c.tag : id.replace('CUSTOM_','');
    });
    const launchIso = wizardLaunchTime ? new Date(wizardLaunchTime).toISOString() : null;
    const newRecords = products.map(prod => {
      const sh = (site==='Global' && prod==='RFQ') ? !!stableHub : false;
      return {
        id: genId(),
        tokenName: derivedName(),
        tokenSymbol: tokenSymbol.trim(),
        quoteCurrencies, chainOnly,
        chains, chainLabels,
        userType, expectedMM,
        expectedLaunchTime: launchIso,
        site, product: prod, tokenType, stableHub: sh, launchpool: lp,
        blocker: '', checked: {}, naSteps: {}, stepNotes: {}, notes: '',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        estimatedTime: estimateTime(site, prod, tokenType),
        annFields: prod === 'ChainOnly' ? {
          tokenSymbols: annTokenSymbols.trim() || tokenSymbol.trim(),
          chainName:    annChainName.trim(),
          chainSuffix:  annChainSuffix.trim(),
          depositStatus: annDepositStatus,
          tradingPairs: annTradingPairs.trim(),
          aboutEN: annAboutEN.trim(),
          aboutZH: annAboutZH.trim(),
          aboutTC: annAboutTC.trim(),
          website:    annWebsite.trim(),
          whitepaper: annWhitepaper.trim(),
          twitter:    annTwitter.trim(),
        } : (prod === 'OTC' && site === 'Global') ? {
          annType:      'GlobalOTC',
          tokenSymbols: annTokenSymbols.trim() || tokenSymbol.trim(),
          tokenFullName: annTokenFullName.trim() || tokenSymbol.trim(),
          chainName:    annChainName.trim(),
          chainSuffix:  annChainSuffix.trim(), // used as network label e.g. ERC20
          depositStatus: annDepositStatus,
          tradingPairs: annTradingPairs.trim(),
          aboutEN: annAboutEN.trim(),
          aboutZH: annAboutZH.trim(),
          aboutTC: annAboutTC.trim(),
          website:    annWebsite.trim(),
          whitepaper: annWhitepaper.trim(),
          twitter:    annTwitter.trim(),
        } : null,
      };
    });
    onSave(newRecords);
  };

  const handleCreate = () => {
    if (!canCreate) return;
    const sym = tokenSymbol.trim().toLowerCase();
    const allMatches = [];
    products.forEach(prod => {
      const m = (existingRecords || []).filter(r =>
        (r.tokenSymbol||r.tokenName).trim().toLowerCase() === sym &&
        r.site === site && r.product === prod
      );
      allMatches.push(...m);
    });
    if (allMatches.length > 0) setDupWarning({ matches: allMatches });
    else doCreate();
  };

  const sInfo = SITES.find(s=>s.id===site);

  return (
    <div style={{height:'100%', overflowY:'auto'}}>
      {/* Duplicate warning modal */}
      {dupWarning && (
        <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:16}}>
          <div style={{background:'white', borderRadius:20, padding:22, width:'100%', maxWidth:460, boxShadow:'6px 6px 0 #2D2D2D'}}>
            <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:8}}>
              <span style={{fontSize:22}}>⚠️</span>
              <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontWeight:700, fontSize:17, color:'#2D2D2D'}}>疑似重复任务</div>
            </div>
            <div style={{fontSize:13, color:'#6B6B6B', marginBottom:12}}>
              已找到 <strong>{dupWarning.matches.length}</strong> 条相同币种 + 站点 + 产品的记录，可能是重复创建：
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:8, marginBottom:20}}>
              {dupWarning.matches.map(r => {
                const cl = buildChecklist(r.site, r.product, r.tokenType, {stableHub: r.stableHub, launchpool: r.launchpool});
                const st = getRecordStatus(r, cl);
                const sm = STATUS_META[st];
                const done = countDone(r.checked, r.naSteps, cl);
                return (
                  <div key={r.id} style={{background:'#FDE68A', border:'2px solid #2D2D2D', borderRadius:20, padding:'8px 12px', display:'flex', alignItems:'center', gap:12}}>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700, fontSize:14, color:'#2D2D2D'}}>{r.tokenName}</div>
                      <div style={{fontSize:12, color:'#6B6B6B', marginTop:2}}>
                        {SITES.find(s=>s.id===r.site)?.icon} {r.site} · {r.product} · 创建于 {fmtDate(r.createdAt)}
                      </div>
                      <div style={{fontSize:12, marginTop:3}}>
                        <span style={{background:sm.bg, color:sm.color, padding:'1px 8px', borderRadius:99, fontWeight:700}}>{sm.label}</span>
                        <span style={{color:'#6B6B6B', marginLeft:8}}>{done}/{cl.length} 步骤已完成</span>
                      </div>
                    </div>
                    <button onClick={()=>{ setDupWarning(null); onOpenExisting(r.id); }} style={{background:'none', border:'2px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'5px 11px', fontSize:12, cursor:'pointer', fontWeight:700, whiteSpace:'nowrap'}}>查看</button>
                  </div>
                );
              })}
            </div>
            <div style={{display:'flex', gap:10, justifyContent:'flex-end'}}>
              <button onClick={()=>setDupWarning(null)} style={{border:'2px solid #2D2D2D', background:'white', borderRadius:16, padding:'9px 18px', fontSize:13, cursor:'pointer', color:'#6B6B6B', fontWeight:600}}>返回修改</button>
              <button onClick={()=>{ setDupWarning(null); doCreate(); }} style={{border:'3px solid #2D2D2D', background:'#A8D8F0', color:'#2D2D2D', borderRadius:16, padding:'8px 18px', fontSize:13, cursor:'pointer', fontWeight:700, boxShadow:'3px 3px 0 #2D2D2D'}}>仍然创建</button>
            </div>
          </div>
        </div>
      )}
      <div style={{background:'#7ECDC0', padding:'16px 24px', display:'flex', alignItems:'center', gap:16, borderBottom:'3px solid #2D2D2D'}}>
        <button className="btn" onClick={onCancel} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13}}>← 返回</button>
        <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", color:'#2D2D2D', fontWeight:700, fontSize:16}}>新建上币任务</div>
      </div>

      <div style={{maxWidth:700, margin:'0 auto', padding:'24px 16px'}}>
        {/* Token info — 3 sections */}
        <div className="hl-card" style={{background:'white', borderRadius:20, padding:20, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D', marginBottom:12}}>
          <div style={{fontSize:14, fontWeight:700, color:'#2D2D2D', marginBottom:12}}>币种信息</div>

          {/* 币种代号 */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:6}}>
              币种代号 <span style={{color:'#2D2D2D'}}>*</span>
            </div>
            <input value={tokenSymbol} onChange={e=>setTokenSymbol(e.target.value)}
              placeholder="例如：BTC、ETH、DOGE"
              style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:20, padding:'11px 14px', fontSize:15, fontFamily:'inherit'}}/>
          </div>

          {/* 交易对（右币多选 + 仅上链） */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:8}}>
              交易对 <span style={{fontSize:12, fontWeight:400, color:'#6B6B6B'}}>（可选）</span>
            </div>
            <div style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap'}}>
              {/* Base currency badge */}
              {tokenSymbol.trim() && (
                <span style={{fontSize:14, fontWeight:700, color:'#2D2D2D', background:'#F5F0E6', border:'2px solid #2D2D2D', borderRadius:16, padding:'5px 11px'}}>{tokenSymbol.trim()}</span>
              )}
              {tokenSymbol.trim() && <span style={{fontSize:16, color:'#6B6B6B', fontWeight:300}}>/</span>}
              {/* Quote currency chips */}
              {QUOTE_OPTIONS.map(q => {
                const sel = quoteCurrencies.includes(q);
                return (
                  <button key={q} onClick={()=>toggleQuote(q)} disabled={chainOnly} style={{
                    border:`${(sel) ? '3px' : '2px'} solid #2D2D2D`,
                    borderRadius:16, padding:'5px 12px', cursor: chainOnly?'not-allowed':'pointer',
                    background: sel?'#A8D8F0': chainOnly?'#FFFFFF':'white',
                    fontSize:13, fontWeight: sel?700:500,
                    color: sel?C.navy: chainOnly?'#6B6B6B':'#2D2D2D',
                    transition:'all 0.12s',
                  }}>{sel && '✓ '}{q}</button>
                );
              })}
              {/* Divider */}
              <span style={{fontSize:12, color:'#6B6B6B', fontWeight:400, padding:'0 2px'}}>或</span>
              {/* 仅上链 */}
              <button onClick={toggleChainOnly} style={{
                border:`${(chainOnly) ? '3px' : '2px'} solid #2D2D2D`,
                borderRadius:16, padding:'5px 12px', cursor:'pointer',
                background: chainOnly?'#D4A5E8':'white',
                fontSize:13, fontWeight: chainOnly?700:500,
                color:'#2D2D2D',
                transition:'all 0.12s',
              }}>{chainOnly && '✓ '}仅上链</button>
            </div>
            {/* 自定义交易对 */}
            {!chainOnly && (
              <div style={{display:'flex', gap:8, alignItems:'center', marginTop:10}}>
                <input value={customQuote} onChange={e=>setCustomQuote(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&addCustomQuote()}
                  placeholder="其他右币，如 ETH、EUR…"
                  style={{flex:1, border:'2px solid #2D2D2D', borderRadius:16, padding:'5px 11px', fontSize:13, fontFamily:'inherit', outline:'none'}}/>
                <button onClick={addCustomQuote} style={{background:'#FDE68A', color:'#2D2D2D', border:'3px solid #2D2D2D', borderRadius:16, padding:'5px 12px', fontSize:13, cursor:'pointer', fontWeight:600, whiteSpace:'nowrap', boxShadow:'3px 3px 0 #2D2D2D'}}>+ 添加</button>
              </div>
            )}
            {/* 已选自定义右币（不在预设列表中的） */}
            {!chainOnly && quoteCurrencies.filter(q=>!QUOTE_OPTIONS.includes(q)).map(q=>(
              <span key={q} style={{display:'inline-flex', alignItems:'center', gap:5, marginTop:6, marginRight:6, background:'#A8D8F0', border:'2px solid #2D2D2D', borderRadius:16, padding:'4px 10px', fontSize:12, color:'#2D2D2D', fontWeight:700}}>
                {q}
                <span onClick={()=>setQuoteCurrencies(prev=>prev.filter(x=>x!==q))} style={{cursor:'pointer', color:'#6B6B6B', fontSize:14, lineHeight:1}}>×</span>
              </span>
            ))}
            {/* 预览 */}
            {(quoteCurrencies.length>0 || chainOnly) && tokenSymbol.trim() && (
              <div style={{marginTop:8, fontSize:12, color:'#6B6B6B'}}>
                任务将展示为：<strong style={{color:'#2D2D2D'}}>{derivedName()}</strong>
                {chainOnly && <span style={{marginLeft:8, color:'#6B6B6B'}}>（各站点流程有差异，待补充）</span>}
              </div>
            )}
          </div>

          {/* 区块链（多选） */}
          <div>
            <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:8}}>
              上线区块链 <span style={{fontSize:12, fontWeight:400, color:'#6B6B6B'}}>（多选）</span>
            </div>
            <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:8}}>
              {CHAINS.map(c => {
                const sel = chains.includes(c.id);
                return (
                  <button key={c.id} onClick={()=>toggleChain(c.id)} style={{
                    border:`${(sel) ? '3px' : '2px'} solid #2D2D2D`,
                    borderRadius:16, padding:'5px 12px', cursor:'pointer',
                    background: sel?'#A8D8F0':'white',
                    fontSize:12, fontWeight: sel?700:400,
                    color: sel?C.navy:'#2D2D2D', transition:'all 0.1s',
                  }}>
                    {sel && <span style={{marginRight:4}}>✓</span>}{c.tag}
                    <span style={{fontSize:11, color: sel?'#2D2D2D':'#6B6B6B', marginLeft:4}}>{c.label}</span>
                  </button>
                );
              })}
            </div>
            {/* 自定义链 */}
            <div style={{display:'flex', gap:8, alignItems:'center'}}>
              <input value={customChain} onChange={e=>setCustomChain(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&addCustomChain()}
                placeholder="其他链…"
                style={{flex:1, border:'2px solid #2D2D2D', borderRadius:16, padding:'5px 11px', fontSize:13, fontFamily:'inherit', outline:'none'}}/>
              <button onClick={addCustomChain} style={{background:'#FDE68A', color:'#2D2D2D', border:'3px solid #2D2D2D', borderRadius:16, padding:'5px 12px', fontSize:13, cursor:'pointer', fontWeight:600, whiteSpace:'nowrap', boxShadow:'3px 3px 0 #2D2D2D'}}>+ 添加</button>
            </div>
            {/* 已选自定义链 */}
            {chains.filter(id=>id.startsWith('CUSTOM_')).map(id=>(
              <span key={id} style={{display:'inline-flex', alignItems:'center', gap:5, marginTop:6, marginRight:6, background:'#A8D8F0', border:'2px solid #2D2D2D', borderRadius:16, padding:'4px 10px', fontSize:12, color:'#2D2D2D', fontWeight:700}}>
                {id.replace('CUSTOM_','')}
                <span onClick={()=>setChains(prev=>prev.filter(c=>c!==id))} style={{cursor:'pointer', color:'#6B6B6B', fontSize:14, lineHeight:1}}>×</span>
              </span>
            ))}
            {chains.length > 0 && (
              <div style={{marginTop:8, fontSize:12, color:'#6B6B6B'}}>
                已选：{chains.map(id=>{const c=CHAINS.find(c=>c.id===id); return c?c.tag:id.replace('CUSTOM_','');}).join('、')}
              </div>
            )}
          </div>
        </div>

        {/* Site */}
        <div className="hl-card" style={{background:'white', borderRadius:20, padding:20, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D', marginBottom:12}}>
          <div style={{fontSize:14, fontWeight:700, color:'#2D2D2D', marginBottom:10}}>上线站点</div>
          <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10}}>
            {SITES.map(s=>(
              <button key={s.id} onClick={()=>{setSite(s.id);setProducts([]);setStableHub(null);setLaunchpool(null);}}
                style={{border:`${(site===s.id) ? '3px' : '2px'} solid #2D2D2D`, borderRadius:20, padding:'14px 10px', cursor:'pointer', background:site===s.id?s.bg:'white', textAlign:'left'}}>
                <div style={{fontSize:20, marginBottom:5}}>{s.icon}</div>
                <div style={{fontWeight:700, fontSize:13, color:site===s.id?s.color:'#2D2D2D'}}>{s.label}</div>
                <div style={{fontSize:11, color:'#6B6B6B', marginTop:3}}>{s.note}</div>
              </button>
            ))}
          </div>
        </div>

        {/* Product */}
        {site && (
          <div className="hl-card" style={{background:'white', borderRadius:20, padding:20, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D', marginBottom:12}}>
            <div style={{fontSize:14, fontWeight:700, color:'#2D2D2D', marginBottom:10}}>产品类型</div>
            <div style={{fontSize:12, color:'#6B6B6B', marginBottom:8}}>可多选</div>
          <div style={{display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:10}}>
              {PRODUCTS.filter(p=>!(p.id==='Perp'&&site!=='Global') && !(p.id==='WealthToken'&&site!=='HK')).map(p=>{
                const sel = products.includes(p.id);
                return (
                <button key={p.id} onClick={()=>toggleProduct(p.id)}
                  style={{border:`${(sel) ? '3px' : '2px'} solid #2D2D2D`, borderRadius:20, padding:'14px 16px', cursor:'pointer', background:sel?'#A8D8F0':'white', textAlign:'left', position:'relative'}}>
                  {sel && <span style={{position:'absolute', top:8, right:10, fontSize:13, color:'#2D2D2D', fontWeight:700}}>✓</span>}
                  <div style={{fontSize:20, marginBottom:5}}>{p.icon}</div>
                  <div style={{fontWeight:700, fontSize:13, color:sel?C.navy:'#2D2D2D'}}>{p.label}</div>
                  <div style={{fontSize:11, color:'#6B6B6B', marginTop:3}}>{p.note}</div>
                </button>
                );
              })}
            </div>
          </div>
        )}

        {/* Token type */}
        {site && products.length > 0 && (
          <div className="hl-card" style={{background:'white', borderRadius:20, padding:20, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D', marginBottom:12}}>
            <div style={{fontSize:14, fontWeight:700, color:'#2D2D2D', marginBottom:10}}>代币类型</div>
            <div style={{display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:10}}>
              {TOKEN_TYPES.map(t=>(
                <button key={t.id} onClick={()=>setTokenType(t.id)}
                  style={{border:`${(tokenType===t.id) ? '3px' : '2px'} solid #2D2D2D`, borderRadius:20, padding:'14px 16px', cursor:'pointer', background:tokenType===t.id?'#7ECDC0':'white', textAlign:'left'}}>
                  <div style={{fontSize:20, marginBottom:5}}>{t.icon}</div>
                  <div style={{fontWeight:700, fontSize:13, color:tokenType===t.id?C.teal:'#2D2D2D'}}>{t.label}</div>
                  <div style={{fontSize:11, color:'#6B6B6B', marginTop:3}}>{t.note}</div>
                </button>
              ))}
            </div>
          </div>
        )}

  const [saved, setSaved] = useState(false);

  const a0 = record.annFields || {};

  // Local editable state
  const [fSymbols,     setFSymbols]     = useState(a0.tokenSymbols || record.tokenSymbol || '');
  const [fChainName,   setFChainName]   = useState(a0.chainName || (record.chainLabels||[])[0] || '');
  const [fSuffix,      setFSuffix]      = useState((a0.chainSuffix||'').toUpperCase());
  const [fDepStatus,   setFDepStatus]   = useState(a0.depositStatus||'Opened');
  const [fTradingPairs,setFTradingPairs]= useState(a0.tradingPairs||'');
  const [fListingTime, setFListingTime] = useState(record.expectedLaunchTime ? record.expectedLaunchTime.slice(0,16) : '');
  const [fAboutEN,     setFAboutEN]     = useState(a0.aboutEN||'');
  const [fAboutZH,     setFAboutZH]     = useState(a0.aboutZH||'');
  const [fAboutTC,     setFAboutTC]     = useState(a0.aboutTC||'');
  const [fWebsite,     setFWebsite]     = useState(a0.website||'');
  const [fWhitepaper,  setFWhitepaper]  = useState(a0.whitepaper||'');
  const [fTwitter,     setFTwitter]     = useState(a0.twitter||'');

  // Token symbols array
  const rawSymbols = fSymbols.split(',').map(s=>s.trim()).filter(Boolean);
  const chainName  = fChainName;
  const suffix     = fSuffix;
  const tradSymbols = rawSymbols.map(s => s.toUpperCase() + suffix);
  const pairs = fTradingPairs.split('\n').map(p=>p.trim()).filter(Boolean);
  const listingIso = fListingTime ? new Date(fListingTime).toISOString() : null;

  const saveChanges = () => {
    if (!onUpdate) return;
    onUpdate({
      ...record,
      expectedLaunchTime: listingIso || record.expectedLaunchTime,
      annFields: {
        ...a0,
        tokenSymbols: fSymbols,
        chainName: fChainName,
        chainSuffix: fSuffix,
        depositStatus: fDepStatus,
        tradingPairs: fTradingPairs,
        aboutEN: fAboutEN,
        aboutZH: fAboutZH,
        aboutTC: fAboutTC,
        website: fWebsite,
        whitepaper: fWhitepaper,
        twitter: fTwitter,
      },
      updatedAt: new Date().toISOString(),
    });
    setSaved(true);
    setTimeout(()=>setSaved(false), 2000);
  };

  // date formatters
  const fmtEN = (iso) => {
    if (!iso) return 'TBD';
    const d = new Date(iso);
    const mo = ['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()];
    const dy = d.getDate();
    const sf = (dy===1||dy===21||dy===31)?'st':(dy===2||dy===22)?'nd':(dy===3||dy===23)?'rd':'th';
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    return `${mo} ${dy}${sf}, ${d.getFullYear()}, ${hh}:${mm} (UTC+8)`;
  };
  const fmtZH = (iso) => {
    if (!iso) return 'TBD';
    const d = new Date(iso);
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} (UTC+8)`;
  };

  const depEN = fDepStatus||'Opened';
  const depZH = depEN==='Opened'?'已开放':depEN==='Coming Soon'?'即将开放':depEN;
  const depTC = depEN==='Opened'?'已開放':depEN==='Coming Soon'?'即將開放':depEN;

  // join helpers
  const joinEN = arr => arr.length===1?arr[0]:arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1];
  const joinZH = arr => arr.length===1?arr[0]:arr.slice(0,-1).join('、')+'和'+arr[arr.length-1];

  // Fixed disclaimer/about texts
  const DIS_EN1 = annTpl('HK','EN','dis1');
  const DIS_EN2 = annTpl('HK','EN','dis2');
  const ABOUT_EN = annTpl('HK','EN','about');

  const DIS_ZH1 = annTpl('HK','SC','dis1');
  const DIS_ZH2 = annTpl('HK','SC','dis2');
  const ABOUT_ZH = annTpl('HK','SC','about');

  const DIS_TC1 = annTpl('HK','TC','dis1');
  const DIS_TC2 = annTpl('HK','TC','dis2');
  const ABOUT_TC = annTpl('HK','TC','about');

  const TRADING_RULES_URL = 'https://www.osl.com/hk-en/support/article/kA0fv00000001nJCAQ?channel=7rm1br';

  // ── HTML generator ──────────────────────────────────────────────────────────
  const buildHTML = (lang) => {
    const isEN = lang==='EN', isZH = lang==='ZH', isTC = lang==='TC';
    const sym  = rawSymbols;
    const tSym = tradSymbols;
    const cn   = chainName;
    const dateStr = isEN ? fmtEN(listingIso) : fmtZH(listingIso);
    const depSt = isEN ? depEN : isZH ? depZH : depTC;

    // title lines
    let mainTitle, subTitle, greeting, intro, timeHeader, depLabel, dateLabel, pairsLabel, userLabel, networkLine, noteHead, noteBody, aboutHeader, aboutText, learnMore, disHeader, disBody, aboutOSLHeader, aboutOSLBody;

    if (isEN) {
      mainTitle  = `【HK】New Listing on OSL HK: ${sym.join(', ')} on ${cn}`;
      subTitle   = `【EN】New Listing on OSL HK: ${sym.join(', ')} on ${cn}`;
      greeting   = 'Dear OSL HK Clients,';
      const symBold = tSym.map((s,i,arr)=>`<strong>${s}</strong>${i<arr.length-1?' and ':''}`).join('');
      intro      = `We are thrilled to announce the new listing of <strong>${joinEN(sym)} on ${cn}.</strong> ${tSym.length>0?`Tradings of ${symBold} are available on <strong>OTC</strong> for <strong>PI investors.</strong>`:'Deposits and withdrawals are now available.'}`;
      timeHeader = 'Listing Timeline:';
      depLabel   = `<strong>Deposit and Withdrawal Open (${cn}):</strong> ${depSt}`;
      dateLabel  = listingIso ? `<strong>Listing Time:</strong> ${dateStr}` : null;
      pairsLabel = pairs.length>0 ? `<strong>Trading Pairs(OTC):</strong><ul>${pairs.map(p=>`<li>${p}</li>`).join('')}</ul>` : null;
      userLabel  = `<strong>Supported User Type:</strong> Professional Investors Only`;
      networkLine = tSym.map(s=>`<p>${s} Deposits and withdrawals will be available via the <strong>${cn}</strong> Network<strong>.</strong></p>`).join('');
      noteHead   = '<strong><em>Note:</em></strong>';
      noteBody   = `<em>For trading rules of new pair listing, please refer to “<a href=”${TRADING_RULES_URL}”>Trading Rules</a>” for more information.</em>`;
      aboutHeader = `<strong>About ${cn}</strong>`;
      aboutText  = fAboutEN || '';
      learnMore  = `<strong>Learn more about ${cn}:</strong>${fWebsite?` <a href=”${fWebsite}”>Website</a>`:' Website'}${fWhitepaper?` | <a href=”${fWhitepaper}”>Whitepaper</a>`:''}${fTwitter?` | <a href=”${fTwitter}”>Twitter(X)</a>`:''}`;
      disHeader  = '<strong>Disclaimer</strong>';
      disBody    = DIS_EN1.split('\n').map(l=>`<p>${l}</p>`).join('') + `<p><strong>${DIS_EN2}</strong></p>`;
      aboutOSLHeader = '<strong>About OSL Hong Kong</strong>';
      aboutOSLBody   = ABOUT_EN.split('\n').map((l,i)=>i===2?`<p>${l.replace('Open, Secure, and Licensed,','<strong>Open, Secure, and Licensed,</strong>')}</p>`:`<p>${l}</p>`).join('');
    } else if (isZH) {
      mainTitle  = `【简中】OSL HK 新币上线：${cn}网络的${joinZH(sym)}`;
      subTitle   = null;
      greeting   = '亲爱的OSL HK客户，';
      const symBoldZH = sym.map((s,i,arr)=>`<strong>${s}</strong>${i<arr.length-1?'、':''}`).join('');
      intro      = `我们很高兴地宣布OSL HK 新币上线：<strong>${cn}</strong>网络的${symBoldZH}。${tSym.length>0?`${tSym.join('和')}将在场外交易（<strong>OTC</strong>）为专业投资客户开放。`:'充提功能现已开放。'}`;
      timeHeader = '上线时间安排：';
      depLabel   = `<strong>充值和提现开放（${cn}）:</strong> ${depSt}`;
      dateLabel  = listingIso ? `<strong>开始时间：</strong>${dateStr}` : null;
      pairsLabel = pairs.length>0 ? `<strong>交易对（OTC）:</strong><ul>${pairs.map(p=>`<li>${p}</li>`).join('')}</ul>` : null;
      userLabel  = `<strong>支持的客户类型: 仅限专业投资者</strong>`;
      networkLine = tSym.map(s=>`<p>${s} 充值和提币可通过<strong>${cn}</strong>网络进行。</p>`).join('');
      noteHead   = '注意：';
      noteBody   = `有关新交易对上市的交易规则，请参阅”<a href=”${TRADING_RULES_URL}”>交易规则</a>”以获取更多信息。`;
      aboutHeader = `<strong>关于 ${cn}</strong>`;
      aboutText  = fAboutZH || '';
      learnMore  = `了解更多关于${cn}：${fWebsite?`<a href=”${fWebsite}”>网站</a>`:'网站'}${fWhitepaper?` | <a href=”${fWhitepaper}”>白皮书</a>`:''}${fTwitter?` | <a href=”${fTwitter}”>Twitter(X)</a>`:''}`;
      disHeader  = '<strong>免责声明</strong>';
      disBody    = `<p>${DIS_ZH1}</p><p><strong>${DIS_ZH2}</strong></p>`;
      aboutOSLHeader = '<strong>关于OSL香港</strong>';
      aboutOSLBody   = `<p>${ABOUT_ZH}</p>`;
    } else {
      mainTitle  = `【繁中】OSL HK 新幣上線：${cn}網絡的${joinZH(sym)}`;
      subTitle   = null;
      greeting   = '親愛的OSL HK客戶，';
      const symBoldTC = sym.map((s,i,arr)=>`<strong>${s}</strong>${i<arr.length-1?'、':''}`).join('');
      intro      = `我們很高興地宣佈OSL HK 新幣上線：<strong>${cn}</strong>網絡的${symBoldTC}。${tSym.length>0?`${tSym.join('和')}將在場外交易（<strong>OTC</strong>）爲專業投資客戶開放。`:'充提功能現已開放。'}`;
      timeHeader = '上線時間安排：';
      depLabel   = `<strong>充值和提現開放（${cn}）:</strong> ${depSt}`;
      dateLabel  = listingIso ? `<strong>開始時間：</strong>${dateStr}` : null;
      pairsLabel = pairs.length>0 ? `<strong>交易對（OTC）:</strong><ul>${pairs.map(p=>`<li>${p}</li>`).join('')}</ul>` : null;
      userLabel  = `<strong>支持的客戶類型: 僅限專業投資者</strong>`;
      networkLine = tSym.map(s=>`<p>${s} 充值和提幣可通過<strong>${cn}</strong>網絡進行。</p>`).join('');
      noteHead   = '注意：';
      noteBody   = `有關新交易對上市的交易規則，請參閱”<a href=”${TRADING_RULES_URL}”>交易規則</a>”以獲取更多信息。`;
      aboutHeader = `<strong>關於 ${cn}</strong>`;
      aboutText  = fAboutTC || fAboutZH || '';
      learnMore  = `瞭解更多關於${cn}：${fWebsite?`<a href=”${fWebsite}”>網站</a>`:'網站'}${fWhitepaper?` | <a href=”${fWhitepaper}”>白皮書</a>`:''}${fTwitter?` | <a href=”${fTwitter}”>Twitter(X)</a>`:''}`;
      disHeader  = '<strong>免責聲明</strong>';
      disBody    = `<p>${DIS_TC1}</p><p><strong>${DIS_TC2}</strong></p>`;
      aboutOSLHeader = '<strong>關於OSL香港</strong>';
      aboutOSLBody   = `<p>${ABOUT_TC}</p>`;
    }

    const timelineItems = [depLabel, dateLabel, pairsLabel, userLabel].filter(Boolean);

    return `<div style="font-family:Arial,sans-serif;font-size:11pt;line-height:1.6;color:#000;">
<p style="font-size:20pt;font-weight:bold;margin:0 0 8px;">${mainTitle}</p>
${subTitle ? `<h2 style="font-size:16pt;font-weight:bold;margin:0 0 12px;">${subTitle}</h2>` : ''}
<p>&nbsp;</p>
<p><strong>${greeting}</strong></p>
<p>${intro}</p>
<p>&nbsp;</p>
<p><strong>${timeHeader}</strong></p>
<ul>${timelineItems.map(li=>`<li>${li}</li>`).join('')}</ul>
<p>&nbsp;</p>
${networkLine}
<p>&nbsp;</p>
<p>${noteHead}<br>${noteBody}</p>
<p>&nbsp;</p>
<p>${aboutHeader}</p>
${aboutText ? `<p>${aboutText}</p>` : ''}
<p>${learnMore}</p>
<p>&nbsp;</p>
<p>${disHeader}<br>${disBody}</p>
<p>&nbsp;</p>
<p>${aboutOSLHeader}<br>${aboutOSLBody}</p>
</div>`;
  };

  // ── Copy to clipboard ───────────────────────────────────────────────────────
  const copyLang = async (lang) => {
    const html = buildHTML(lang);
    try {
      const blob = new Blob([html], { type: 'text/html' });
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': blob })]);
    } catch(e) {
      // Fallback
      const el = document.createElement('div');
      el.innerHTML = html; el.contentEditable = 'true';
      Object.assign(el.style, { position:'fixed', top:'-9999px', left:'-9999px', opacity:'0' });
      document.body.appendChild(el);
      const range = document.createRange(); range.selectNodeContents(el);
      window.getSelection().removeAllRanges(); window.getSelection().addRange(range);
      document.execCommand('copy');
      document.body.removeChild(el);
    }
    setCopied(lang);
    setTimeout(()=>setCopied(null), 2000);
  };

  const TABS = [
    { id:'EN', label:'🇺🇸 English' },
    { id:'ZH', label:'🇨🇳 简体中文' },
    { id:'TC', label:'🇭🇰 繁體中文' },
  ];

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:2000,display:'flex',alignItems:'stretch',justifyContent:'flex-end'}}>
      <div style={{width:'min(780px,95vw)',background:'white',display:'flex',flexDirection:'column',boxShadow:'6px 6px 0 #2D2D2D',animation:'slideInPanel 0.2s ease'}}>
        {/* Header */}
        <div style={{background:'#7ECDC0',padding:'14px 20px',display:'flex',alignItems:'center',gap:12,flexShrink:0,borderBottom:'3px solid #2D2D2D'}}>
          <div style={{flex:1}}>
            <div style={{color:'#2D2D2D',fontWeight:700,fontSize:15}}>📢 三语上币公告</div>
            <div style={{color:'#2D2D2D',fontSize:12,marginTop:2}}>{record.tokenName} · {chainName} · 点击"一键复制"后可直接粘贴至 Outlook/Word</div>
          </div>
          <button onClick={()=>setShowEdit(v=>!v)} style={{background:'#FFFFFF',border:'2px solid #2D2D2D',color:'#2D2D2D',borderRadius:16,padding:'5px 11px',cursor:'pointer',fontSize:12,fontWeight:600}}>
            ✏ {showEdit?'收起编辑':'编辑字段'}
          </button>
          <button onClick={onClose} style={{background:'#FFFFFF',border:'none',color:'#2D2D2D',borderRadius:16,padding:'5px 12px',cursor:'pointer',fontSize:13}}>✕ 关闭</button>
        </div>

        {/* Editable fields panel */}
        {showEdit && (
          <div style={{background:'#A8D8F0',borderBottom:'2px solid #2D2D2D',padding:'14px 20px',flexShrink:0,overflowY:'auto',maxHeight:'45vh'}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:8}}>
              <div><div style={{fontSize:11,fontWeight:600,color:'#2D2D2D',marginBottom:3}}>代币符号 <span style={{color:'#6B6B6B'}}>(逗号分隔多个)</span></div>
                <input value={fSymbols} onChange={e=>setFSymbols(e.target.value)} style={{width:'100%',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 8px',fontSize:12,fontFamily:'inherit',outline:'none',boxSizing:'border-box'}}/></div>
              <div><div style={{fontSize:11,fontWeight:600,color:'#2D2D2D',marginBottom:3}}>链名称</div>
                <input value={fChainName} onChange={e=>setFChainName(e.target.value)} style={{width:'100%',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 8px',fontSize:12,fontFamily:'inherit',outline:'none',boxSizing:'border-box'}}/></div>
              <div><div style={{fontSize:11,fontWeight:600,color:'#2D2D2D',marginBottom:3}}>链代号后缀 (如MORPH)</div>
                <input value={fSuffix} onChange={e=>setFSuffix(e.target.value.toUpperCase())} style={{width:'100%',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 8px',fontSize:12,fontFamily:'inherit',outline:'none',boxSizing:'border-box'}}/></div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:8}}>
              <div>
                <div style={{fontSize:11,fontWeight:600,color:'#2D2D2D',marginBottom:3}}>上线时间 (Listing Time)</div>
                <input type="datetime-local" value={fListingTime} onChange={e=>setFListingTime(e.target.value)} style={{width:'100%',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 8px',fontSize:11,fontFamily:'inherit',outline:'none',boxSizing:'border-box'}}/>
              </div>
              <div>
                <div style={{fontSize:11,fontWeight:600,color:'#2D2D2D',marginBottom:3}}>充提状态</div>
                <div style={{display:'flex',gap:6}}>
                  {['Opened','Coming Soon'].map(opt=>(
                    <button key={opt} onClick={()=>setFDepStatus(opt)} style={{border:`${(fDepStatus===opt) ? '3px' : '2px'} solid #2D2D2D`,borderRadius:14,padding:'4px 12px',cursor:'pointer',fontSize:12,fontWeight:fDepStatus===opt?700:400,background:fDepStatus===opt?'#A8D8F0':'white',color:fDepStatus===opt?C.blue: '#2D2D2D'}}>{opt}</button>
                  ))}
                </div>
              </div>
            </div>
            <div style={{marginBottom:8}}>
              <div style={{fontSize:11,fontWeight:600,color:'#2D2D2D',marginBottom:3}}>交易对（每行一个）</div>
              <textarea value={fTradingPairs} onChange={e=>setFTradingPairs(e.target.value)} rows={2}
                style={{width:'100%',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 8px',fontSize:12,fontFamily:'inherit',outline:'none',resize:'vertical',boxSizing:'border-box'}}/>
            </div>
            <div style={{marginBottom:8}}>
              <div style={{display:'flex',gap:0,marginBottom:5}}>
                {[['EN','关于(EN)'],['ZH','关于(简中)'],['TC','关于(繁中)']].map(([l,label])=>(
                  <button key={l} onClick={()=>setFAboutLang(l)} style={{border:'2px solid #2D2D2D',borderRight:l==='TC'?'2px solid #2D2D2D':'none',
                    borderRadius:l==='EN'?'6px 0 0 6px':l==='TC'?'0 6px 6px 0':'0',padding:'4px 10px',cursor:'pointer',fontSize:11,fontWeight:fAboutLang===l?700:400,
                    background:fAboutLang===l?C.blue:'white',color:'#2D2D2D'}}>{label}</button>
                ))}
              </div>
              {fAboutLang==='EN' && <textarea value={fAboutEN} onChange={e=>setFAboutEN(e.target.value)} rows={3} style={{width:'100%',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 8px',fontSize:12,fontFamily:'inherit',outline:'none',resize:'vertical',boxSizing:'border-box'}}/>}
              {fAboutLang==='ZH' && <textarea value={fAboutZH} onChange={e=>setFAboutZH(e.target.value)} rows={3} style={{width:'100%',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 8px',fontSize:12,fontFamily:'inherit',outline:'none',resize:'vertical',boxSizing:'border-box'}}/>}
              {fAboutLang==='TC' && <textarea value={fAboutTC} onChange={e=>setFAboutTC(e.target.value)} rows={3} style={{width:'100%',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 8px',fontSize:12,fontFamily:'inherit',outline:'none',resize:'vertical',boxSizing:'border-box'}}/>}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:10}}>
              {[['官网',fWebsite,setFWebsite],['白皮书',fWhitepaper,setFWhitepaper],['Twitter',fTwitter,setFTwitter]].map(([lbl,val,set])=>(
                <div key={lbl}><div style={{fontSize:11,fontWeight:600,color:'#2D2D2D',marginBottom:3}}>{lbl} URL</div>
                  <input value={val} onChange={e=>set(e.target.value)} placeholder="https://" style={{width:'100%',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 8px',fontSize:11,fontFamily:'inherit',outline:'none',boxSizing:'border-box'}}/></div>
              ))}
            </div>
            {onUpdate && (
              <button onClick={saveChanges} style={{background:saved? 'white' :C.blue,color:'#2D2D2D',border:'none',borderRadius:16,padding:'8px 24px',fontSize:13,cursor:'pointer',fontWeight:700,transition:'background 0.2s'}}>
                {saved?'✓ 已保存！':'💾 保存更改'}
              </button>
            )}
          </div>
        )}

        {/* Language tabs + copy */}
        <div style={{display:'flex',alignItems:'center',borderBottom:'2px solid #2D2D2D',padding:'0 20px',flexShrink:0,background:'#FFFFFF'}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{
              border:'none',borderBottom:`3px solid ${tab===t.id?C.blue:'transparent'}`,
              background:'transparent',padding:'10px 14px',cursor:'pointer',fontSize:13,
              fontWeight:tab===t.id?700:400,color:tab===t.id?C.blue:'#6B6B6B',
            }}>{t.label}</button>
          ))}
          <div style={{marginLeft:'auto',display:'flex',gap:8}}>
            <button onClick={()=>copyLang(tab)} style={{
              background: copied===tab? 'white' :C.blue,
              color:'#2D2D2D',border:'none',borderRadius:16,padding:'7px 18px',fontSize:13,
              fontWeight:700,cursor:'pointer',transition:'background 0.2s',
            }}>{copied===tab?'✓ 已复制！':'📋 一键复制'}</button>
            <button onClick={()=>{ TABS.forEach(t=>copyLang(t.id)); }} style={{
              background:'white',color:'#2D2D2D',border:'2px solid #2D2D2D',borderRadius:16,
              padding:'6px 12px',fontSize:12,cursor:'pointer',fontWeight:600,
            }}>复制全部三语</button>
          </div>
        </div>

        {/* Preview */}
        <div style={{flex:1,overflowY:'auto',padding:20}}>
          <div
            style={{fontFamily:'Arial,sans-serif',fontSize:'11pt',lineHeight:1.7,color:'#111'}}
            dangerouslySetInnerHTML={{__html: buildHTML(tab)}}
          />
        </div>
      </div>
    </div>
  );
}

// ─── Announcement View: Global OTC ────────────────────────────────────────────
function AnnouncementViewGlobal({ record, onClose, onUpdate }) {
  const [tab, setTab] = useState('EN');
  const [copied, setCopied] = useState(null);
  const [showEdit, setShowEdit] = useState(false);
  const [saved, setSaved] = useState(false);
  const a0 = record.annFields || {};

  // Local editable state — initialized from record
  const [fSym,         setFSym]         = useState(a0.tokenSymbols   || record.tokenSymbol || '');
  const [fFullName,    setFFullName]     = useState(a0.tokenFullName  || a0.tokenSymbols || record.tokenSymbol || '');
  const [fChainName,   setFChainName]    = useState(a0.chainName      || '');
  const [fNetwork,     setFNetwork]      = useState(a0.chainSuffix    || '');
  const [fDepStatus,   setFDepStatus]    = useState(a0.depositStatus  || 'Opened');

// ─── Checklist View ────────────────────────────────────────────────────────────
// ─── 运营位 Banner：跳转规则 + 三语文案生成 ──────────────────────────────────
// 跳转规则来自《上币运营位banner需求梳理》：
//   有 Orderbook 优先跳 Pro Trade 的该交易对；没有就跳 RFQ 的 Flash Trade；
//   只有 OTC 就跳公告；多个币对时选潜在交易量最大的那个（工具判断不了，列出来让人点）。
const BANNER_ROUTE_BASE = { HK:'', Global:'', ID:'' };   // 万能路由前缀，可在生成器里填一次存起来
function bannerPairs(record) {
  const sym = (record.tokenSymbol || record.tokenName || 'TOKEN').trim();
  const qs = (record.quoteCurrencies || []).filter(Boolean);
  return qs.length ? qs.map(q => sym + '/' + q) : [sym];
}
function bannerJumpPlan(record, chosenPair) {
  const p = record.product;
  const pair = chosenPair || bannerPairs(record)[0];
  if (p === 'Orderbook')
    return { kind:'spot', path:'trade/spot?currencyPair=' + pair, why:'有 Orderbook，跳 Pro Trade 的该交易对' };
  if (p === 'RFQ')
    return { kind:'flash', path:'trade/flash?currencyPair=' + pair, why:'没有 Orderbook，跳 RFQ 的 Flash Trade' };
  if (p === 'OTC')
    return { kind:'ann', path:'', why:'只有 OTC，跳公告链接（手动填公告地址）' };
  if (p === 'ChainOnly' || p === 'Maintenance')
    return { kind:'ann', path:'', why:'仅上链/网络维护，没有交易页，跳公告链接' };
  return { kind:'ann', path:'', why:'这种产品类型没有固定交易页，默认跳公告' };
}
// 三种句式：新币上线 / 新交易对 / 一币多链，文案取自《【K】Banner 文案模板》和实际发过的 banner
function bannerCopy(record, pairsText, chainName) {
  const sym = (record.tokenSymbol || record.tokenName || 'TOKEN').trim();
  const isPI = /PI|专业/.test(record.userType || '');
  const p = record.product;
  if (p === 'ChainOnly') return {
    EN: sym + '\n' + 'Now Supporting ' + (chainName || '[Network]') + ' Network',
    SC: sym + '\n' + '现已支持 ' + (chainName || '[网络]') + ' 网络',
    TC: sym + '\n' + '現已支持 ' + (chainName || '[網絡]') + ' 網絡',
  };
  if (p === 'Orderbook') return {
    EN: 'New Listing on Pro Trade\n' + pairsText + (isPI ? '\nFor Professional Investors Only' : ''),
    SC: '专业交易上新\n' + pairsText + (isPI ? '\n为专业投资客户开放' : ''),
    TC: '專業交易上新\n' + pairsText + (isPI ? '\n爲專業投資客戶開放' : ''),
  };
  if (p === 'RFQ') return {
    EN: 'New Tokens Listing\n' + pairsText + '\nNow Live on Flash Trade',
    SC: '新币上线\n' + pairsText + '\n在闪电交易上开放交易',
    TC: '新幣上線\n' + pairsText + '\n在閃電交易上開放交易',
  };
  if (p === 'OTC') return {
    EN: 'New Listing on OTC\n' + pairsText,
    SC: '新币上线OTC\n' + pairsText,
    TC: '新幣上線OTC\n' + pairsText,
  };
  return {
    EN: 'New Tokens Listing\n' + pairsText,
    SC: '新币上线\n' + pairsText,
    TC: '新幣上線\n' + pairsText,
  };
}

function isExistingToken(record, allRecords) {
  if (record.pairAnnFields && typeof record.pairAnnFields.isExisting === 'boolean')
    return record.pairAnnFields.isExisting;               // 手动选过就以手动为准
  const sym = (record.tokenSymbol || '').trim().toUpperCase();
  if (!sym) return false;
  return (allRecords || []).some(r =>
    r.id !== record.id && !r.cancelled && r.site === record.site &&
    (r.tokenSymbol || '').trim().toUpperCase() === sym);
}

// 链名在三种语言里的写法。没收录的链三种语言都用原名。
const CHAIN_I18N = {
  ethereum: { EN:'Ethereum (ERC-20)', SC:'以太坊（ERC-20）', TC:'以太坊（ERC-20）' },
  bsc:      { EN:'BNB Smart Chain (BEP-20)', SC:'BNB 智能链（BEP-20）', TC:'BNB 智能鏈（BEP-20）' },
  tron:     { EN:'Tron (TRC-20)', SC:'波场（TRC-20）', TC:'波場（TRC-20）' },
  bitcoin:  { EN:'Bitcoin', SC:'比特币', TC:'比特幣' },
  solana:   { EN:'Solana', SC:'Solana', TC:'Solana' },
  ripple:   { EN:'XRP Ledger', SC:'XRP Ledger', TC:'XRP Ledger' },
  stellar:  { EN:'Stellar', SC:'Stellar', TC:'Stellar' },
  cardano:  { EN:'Cardano', SC:'Cardano', TC:'Cardano' },
};
function chainI18n(name, lang) {
  const k = typeof chainKey === 'function' ? chainKey(name) : String(name || '').toLowerCase();
  const m = CHAIN_I18N[k];
  return (m && m[lang]) || String(name || '');
}
// ['Ethereum','Morph'] → EN: "Ethereum (ERC-20) and Morph"；中文用「和」
function joinNets(list, lang) {
  const a = (list || []).filter(Boolean).map(n => chainI18n(n, lang));
  if (a.length === 0) return '';
  if (a.length === 1) return a[0];
  const last = a[a.length - 1], rest = a.slice(0, -1);
  return lang === 'EN' ? rest.join(', ') + ' and ' + last : rest.join('、') + ' 和 ' + last;
}

// 香港站仅上链公告（按 USDGO on Morph & ERC20 那版 HK template）

    </div>
  );
}

function annKind(record, allRecords) {
  if (!record) return 'new';
  if (record.product === 'ChainOnly') return 'chain';
  if (isExistingToken(record, allRecords)) return 'pair';
  return 'new';
}

function ChecklistView({ record, onBack, onUpdate, addToast, allRecords }) {
  const checklist = useMemo(()=>buildChecklist(record.site, record.product, record.tokenType, {stableHub: record.stableHub, launchpool: record.launchpool}),[record]);
  const [expandedSteps, setExpandedSteps] = useState({});
  const [editNote, setEditNote] = useState(false);
  const [noteText, setNoteText] = useState(record.notes||'');
  const [showCancelModal, setShowCancelModal] = useState(false);
  const [showAnn, setShowAnn] = useState(false);
  const [showBanner, setShowBanner] = useState(false);
  const [cancelReason, setCancelReason] = useState('');
  const [showEditModal, setShowEditModal] = useState(false);
  const [editTokenName, setEditTokenName] = useState(record.tokenName||'');
  const [editExpectedMM, setEditExpectedMM] = useState(record.expectedMM||'');
  const [editUserType, setEditUserType] = useState(record.userType||'');
  const [editBlocker, setEditBlocker] = useState(record.blocker||'');
  const [editLaunchTime, setEditLaunchTime] = useState(toInputVal(record.expectedLaunchTime));

  const checked = record.checked || {};
  const total = checklist.length;
  const isCancelled = !!record.cancelled;
  // done = checked + NA (both count toward progress)
  const done = countDone(checked, record.naSteps||{}, checklist);
  const pct = total ? Math.round(done/total*100) : 0;
  const isComplete = !isCancelled && done===total && total>0;

  const handleCancelConfirm = () => {
    if (!cancelReason.trim()) return;
    onUpdate({...record, cancelled: true, cancelReason: cancelReason.trim(), updatedAt: new Date().toISOString()});
    setShowCancelModal(false);
    setCancelReason('');
  };
  const handleRestore = () => {
    onUpdate({...record, cancelled: false, cancelReason: '', updatedAt: new Date().toISOString()});
  };

  const naSteps   = record.naSteps   || {};
  const stepNotes = record.stepNotes || {};
  const [editingStepNote, setEditingStepNote] = useState(null);
  const [stepNoteVal, setStepNoteVal] = useState('');

  const toggle = (idx) => {
    const nowDone = !checked[idx];
    const newChecked = {...checked, [idx]: nowDone};
    const newNA = nowDone ? {...naSteps, [idx]:false} : naSteps;
    const step = checklist.find(st => st.id === idx);
    const newTotal = countDone(newChecked, newNA, checklist);
    let msg = nowDone ? ('✅ ' + step.task.slice(0,28)) : ('↩ 撤销：' + step.task.slice(0,24));
    if (nowDone && newTotal===checklist.length) msg = '🎉 ' + record.tokenName + ' 全部完成！';
    onUpdate({...record, checked:newChecked, naSteps:newNA, updatedAt:new Date().toISOString()}, msg);
  };

  const toggleNA = (idx) => {
    const nowNA = !naSteps[idx];
    const newNA = {...naSteps, [idx]: nowNA};
    const newChecked = nowNA ? {...checked, [idx]:false} : checked;
    onUpdate({...record, naSteps:newNA, checked:newChecked, updatedAt:new Date().toISOString()},
      nowNA ? ('— N/A：' + (checklist.find(st => st.id === idx)?.task||'').slice(0,20)) : '');
  };

  const saveStepNote = (idx) => {
    const newNotes = {...stepNotes, [idx]: stepNoteVal.trim()};
    onUpdate({...record, stepNotes:newNotes, updatedAt:new Date().toISOString()}, '📝 步骤备注已保存');
    setEditingStepNote(null);
  };

  // ── 审批签字：切换某审批人的签字状态；全签齐则自动勾选该步骤 ──
  const toggleApproval = (inputKey, name, approvers, stepIdx) => {
    const allAppr = record.approvals || {};
    const cur = {...(allAppr[inputKey] || {})};
    if (cur[name]) delete cur[name];
    else cur[name] = new Date().toISOString();
    const newApprovals = {...allAppr, [inputKey]: cur};
    const allSigned = approvers.every(n => cur[n]);
    const newChecked = {...checked, [stepIdx]: allSigned};
    const msg = allSigned ? '🔓 合规审批全部签字完成，闸门已通过' : (cur[name] ? ('✍️ '+name+' 已签字') : ('↩ '+name+' 撤销签字'));
    onUpdate({...record, approvals:newApprovals, checked:newChecked, updatedAt:new Date().toISOString()}, msg);
  };

  const stepFields = record.stepFields || {};
  const setStepField = (inputKey, value, stepIdx) => {
    const newFields = {...stepFields, [inputKey]: value};
    const newChecked = {...checked, [stepIdx]: !!value};
    onUpdate({...record, stepFields:newFields, checked:newChecked, updatedAt:new Date().toISOString()}, value?`✅ ${inputKey} 已填写`:'');
  };

  const openEditModal = () => {
    setEditTokenName(record.tokenName||'');
    setEditExpectedMM(record.expectedMM||'');
    setEditUserType(record.userType||'');
    setEditBlocker(record.blocker||'');
    setEditLaunchTime(toInputVal(record.expectedLaunchTime));
    setShowEditModal(true);
  };
  const saveEditModal = () => {
    const iso = editLaunchTime ? new Date(editLaunchTime).toISOString() : null;
    onUpdate({...record, tokenName:editTokenName, expectedMM:editExpectedMM, userType:editUserType, blocker:editBlocker, expectedLaunchTime:iso, updatedAt:new Date().toISOString()}, '✏ 记录信息已更新');
    setShowEditModal(false);
  };

  const saveNote = () => {
    onUpdate({...record, notes:noteText, updatedAt:new Date().toISOString()}, `📝 备注已更新：${record.tokenName}`);
    setEditNote(false);
  };

  // Group by phase
  const phases = [];
  let cur = null;
  checklist.forEach((step,i)=>{
    if (!cur || cur.name!==step.phase) { cur={name:step.phase,tag:step.tag,steps:[]}; phases.push(cur); }
    cur.steps.push({...step,idx:i});
  });

  // Group by team/owner (parallel lanes) — same steps, grouped by who's doing them
  const [viewMode, setViewMode] = useState('phase'); // 'phase' | 'team'
  const laneOrder = [];
  const laneMap = {};
  checklist.forEach((step,i)=>{
    const key = step.owner || '其他';
    if (!laneMap[key]) { laneMap[key] = []; laneOrder.push(key); }
    laneMap[key].push({...step, idx:i});
  });
  const lanes = laneOrder.map(owner => ({ owner, steps: laneMap[owner] }));

  const siteInfo = SITES.find(s=>s.id===record.site);
  const prodInfo = PRODUCTS.find(p=>p.id===record.product);

  return (
    <div style={{height:'100%', overflowY:'auto'}}>
      {/* Announcement overlay */}
      {showBanner && (
        <BannerView record={record} onClose={()=>setShowBanner(false)} onUpdate={onUpdate}/>
      )}

      {showAnn && annKind(record, allRecords)==='pair' && (
        <PairListingAnnouncementView record={record} onClose={()=>setShowAnn(false)} onUpdate={onUpdate}/>
      )}

      {showAnn && annKind(record, allRecords)==='chain' && record.site!=='HK' && (
        <ChainOnlyAnnGlobal record={record} onClose={()=>setShowAnn(false)} onUpdate={onUpdate}/>
      )}
      {showAnn && annKind(record, allRecords)==='chain' && record.site==='HK' && (
        <ChainOnlyAnnHK record={record} onClose={()=>setShowAnn(false)} onUpdate={onUpdate}/>
      )}
      {showAnn && annKind(record, allRecords)!=='pair' && annKind(record, allRecords)!=='chain' && record.annFields && (
        record.annFields.annType==='GlobalOTC'
          ? <AnnouncementViewGlobal record={record} onClose={()=>setShowAnn(false)} onUpdate={onUpdate}/>
          : <AnnouncementView record={record} onClose={()=>setShowAnn(false)} onUpdate={onUpdate}/>
      )}
      {/* Edit info modal */}
      {showEditModal && (
        <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:16}}>
          <div style={{background:'white', borderRadius:20, padding:22, width:'100%', maxWidth:460, boxShadow:'6px 6px 0 #2D2D2D'}}>
            <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontWeight:700, fontSize:17, color:'#2D2D2D', marginBottom:12}}>✏ 编辑记录信息</div>
            <div style={{display:'flex', flexDirection:'column', gap:14}}>
              <div>
                <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:5}}>任务名称</div>
                <input value={editTokenName} onChange={e=>setEditTokenName(e.target.value)}
                  style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:16, padding:'7px 11px', fontSize:14, fontFamily:'inherit', outline:'none'}}/>
              </div>
              <div>
                <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:5}}>做市商（MM）</div>
                <input value={editExpectedMM} onChange={e=>setEditExpectedMM(e.target.value)}
                  placeholder="例如：Wintermute、GSR..."
