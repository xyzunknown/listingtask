                    const overdue = t.dueDate && t.dueDate<todayStr && t.status!=='done' && t.status!=='cancelled';
                    const sdef = TASK_STATUS_DEFS.find(d=>d.key===t.status) || TASK_STATUS_DEFS[0];
                    const site = TASK_SITE_OPTIONS.find(o=>o.key===t.site) || TASK_SITE_OPTIONS[0];
                    const editing = f => editCell && editCell.id===t.id && editCell.field===f;
                    const cell = { padding:'5px 8px', verticalAlign:'middle', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' };
                    return (
                      <React.Fragment key={t.id}>
                        <tr className="hl-row" style={{background: i%2===0?'white':'#F5F0E6', borderBottom:'2px solid #2D2D2D'}}>
                          <td style={{...cell, cursor:'pointer', color:'#6B6B6B', textAlign:'center'}}
                            onClick={()=>setExpandedIds(p=>({...p, [t.id]: !p[t.id]}))}>{open?'▾':'▸'}</td>

                          <td style={{...cell, cursor:'pointer'}} onClick={()=>setExpandedIds(p=>({...p, [t.id]: !p[t.id]}))}>
                            {t.urgent && '🔥 '}
                            <span style={{fontWeight:600, color:'#2D2D2D', textDecoration:t.status==='cancelled'?'line-through':'none'}}>{t.title}</span>
                            {t.link && <span style={{marginLeft:5}}>🔗</span>}
                          </td>

                          <td style={{...cell, cursor:'pointer', color:t.note?'#2D2D2D':'#6B6B6B'}}
                            onClick={()=>setNoteModal({ kind:'task', id:t.id, val:t.note||'' })}>
                            {t.note ? '📝 '+t.note : '—'}
                          </td>

                          <td style={cell} onClick={()=>setEditCell({id:t.id, field:'site'})}>
                            {editing('site') ? (
                              <select autoFocus value={t.site} onChange={e=>{updateTask(t.id,{site:e.target.value}); setEditCell(null);}} onBlur={()=>setEditCell(null)}
                                style={{width:'100%', fontSize:11, border:'2px solid #2D2D2D', borderRadius:50, padding:'1px 4px', fontFamily:'inherit'}}>
                                {TASK_SITE_OPTIONS.map(o=>(<option key={o.key} value={o.key}>{o.icon} {o.label}</option>))}
                              </select>
                            ) : (
                              <span style={{cursor:'pointer', fontSize:11, fontWeight:600, background:'#F5F0E6', border:'2px solid #2D2D2D', borderRadius:50, padding:'1px 8px', whiteSpace:'nowrap'}}>{site.icon} {site.label}</span>
                            )}
                          </td>

                          <td style={{...cell, cursor:'pointer', color:t.owner?'#2D2D2D':'#6B6B6B'}} onClick={()=>setEditCell({id:t.id, field:'owner'})}>
                            {editing('owner') ? (
                              <input autoFocus defaultValue={t.owner} onBlur={e=>{updateTask(t.id,{owner:e.target.value}); setEditCell(null);}}
                                onKeyDown={e=>{ if(e.key==='Enter'&&!e.nativeEvent.isComposing) e.currentTarget.blur(); if(e.key==='Escape') setEditCell(null); }}
                                style={{width:'100%', fontSize:11, border:'2px solid #2D2D2D', borderRadius:50, padding:'1px 6px', fontFamily:'inherit', boxSizing:'border-box'}}/>
                            ) : (t.owner || '—')}
                          </td>

                          <td style={{...cell, cursor:'pointer'}} onClick={()=>setEditCell({id:t.id, field:'due'})}>
                            {editing('due') ? (
                              <input autoFocus type="date" defaultValue={t.dueDate||''} onBlur={e=>{updateTask(t.id,{dueDate:e.target.value}); setEditCell(null);}}
                                style={{width:'100%', fontSize:11, border:'2px solid #2D2D2D', borderRadius:50, padding:'1px 4px', fontFamily:'inherit', boxSizing:'border-box'}}/>
                            ) : t.dueDate ? (
                              <span style={{fontSize:11, fontWeight:overdue?700:500, background:overdue?'#F7C8D4':'transparent',
                                border:overdue?'2px solid #2D2D2D':'none', borderRadius:50, padding:overdue?'1px 7px':0, whiteSpace:'nowrap'}}>
                                {overdue?'⚠ ':''}{fmtShortDate(t.dueDate)}
                              </span>
                            ) : <span style={{color:'#6B6B6B'}}>—</span>}
                          </td>

                          <td style={cell} onClick={()=>setEditCell({id:t.id, field:'status'})}>
                            {editing('status') ? (
                              <select autoFocus value={t.status} onChange={e=>{updateTask(t.id,{status:e.target.value}); setEditCell(null);}} onBlur={()=>setEditCell(null)}
                                style={{width:'100%', fontSize:11, border:'2px solid #2D2D2D', borderRadius:50, padding:'1px 4px', fontFamily:'inherit'}}>
                                {TASK_STATUS_DEFS.map(d=>(<option key={d.key} value={d.key}>{d.label}</option>))}
                              </select>
                            ) : (
                              <span style={{cursor:'pointer', fontSize:11, fontWeight:600, background:sdef.bg, border:'2px solid #2D2D2D', borderRadius:50, padding:'1px 9px', whiteSpace:'nowrap'}}>{sdef.label}</span>
                            )}
                          </td>

                          <td style={{...cell, cursor:'pointer', color:'#6B6B6B'}} onClick={()=>setExpandedIds(p=>({...p, [t.id]:true}))}>
                            {ct.total ? ct.done+'/'+ct.total : '—'}
                          </td>

                          <td style={{...cell, textAlign:'center'}}>
                            <span onClick={()=>deleteTask(t.id)} title="删除" style={{cursor:'pointer', color:'#6B6B6B'}}>🗑</span>
                          </td>
                        </tr>

                        {open && (
                          <tr style={{background:'#F5F0E6', borderBottom:'2px solid #2D2D2D'}}>
                            <td colSpan={9} style={{padding:'8px 12px 10px 34px'}}>
                              <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:6, flexWrap:'wrap'}}>
                                <span onClick={()=>updateTask(t.id,{urgent:!t.urgent})} style={{cursor:'pointer', fontSize:11, fontWeight:600,
                                  background:t.urgent?'#F7C8D4':'white', border:'2px solid #2D2D2D', borderRadius:50, padding:'1px 9px'}}>🔥 紧急</span>
                                <input value={t.link||''} onChange={e=>updateTask(t.id,{link:e.target.value})} placeholder="🔗 链接（可选）"
                                  style={{flex:1, minWidth:160, fontSize:11, border:'2px solid #2D2D2D', borderRadius:50, padding:'2px 9px', fontFamily:'inherit', boxSizing:'border-box'}}/>
                                {t.link && <a href={t.link} target="_blank" rel="noreferrer" style={{fontSize:11, color:'#2D2D2D', fontWeight:700}}>打开 ↗</a>}
                                <span style={{fontSize:10, color:'#6B6B6B'}}>新增于 {fmtTimestamp(t.createdAt)}</span>
                              </div>
                              <SubtaskTree taskId={t.id} nodes={t.subtasks||[]} depth={0}
                                collapsedSubtasks={collapsedSubtasks} setCollapsedSubtasks={setCollapsedSubtasks}
                                nestedAddTarget={nestedAddTarget} setNestedAddTarget={setNestedAddTarget}
                                nestedSubtaskInput={nestedSubtaskInput} setNestedSubtaskInput={setNestedSubtaskInput}
                                openNoteModal={setNoteModal}
                                toggleSubtask={toggleSubtask} deleteSubtask={deleteSubtask} addSubtask={addSubtask}/>
                              <div style={{display:'flex', gap:6, marginTop:4}}>
                                <input value={subtaskInputs[t.id]||''} onChange={e=>setSubtaskInputs(p=>({...p,[t.id]:e.target.value}))} placeholder="加一条子任务，回车添加"
                                  onKeyDown={e=>{ if(e.key==='Enter' && !e.nativeEvent.isComposing){ e.preventDefault(); addSubtask(t.id, null, subtaskInputs[t.id]||''); setSubtaskInputs(p=>({...p,[t.id]:''})); } }}
                                  style={{flex:1, border:'2px solid #2D2D2D', borderRadius:50, padding:'4px 10px', fontSize:12, fontFamily:'inherit', outline:'none', boxSizing:'border-box'}}/>
                                <button className="btn" onClick={()=>{ addSubtask(t.id, null, subtaskInputs[t.id]||''); setSubtaskInputs(p=>({...p,[t.id]:''})); }}
                                  style={{background:'#FDE68A', color:'#2D2D2D', border:'3px solid #2D2D2D', borderRadius:50, padding:'2px 14px', fontSize:12, fontWeight:700, cursor:'pointer'}}>加</button>
                              </div>
                            </td>
                          </tr>
                        )}
                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* 备注走弹窗，跟总表一样，避免中文输入法被打断 */}
            {noteModal && (
              <div onClick={()=>setNoteModal(null)} style={{position:'fixed', inset:0, background:'rgba(45,45,45,0.35)', zIndex:999, display:'flex', alignItems:'center', justifyContent:'center'}}>
                <div onClick={e=>e.stopPropagation()} style={{background:'white', border:'3px solid #2D2D2D', borderRadius:20, boxShadow:'6px 6px 0 #2D2D2D', padding:16, width:460, maxWidth:'90vw'}}>
                  <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontSize:15, marginBottom:8}}>📝 {noteModal.kind==='sub'?'子任务备注':'备注 / 卡点'}</div>
                  <textarea autoFocus value={noteModal.val} onChange={e=>setNoteModal({...noteModal, val:e.target.value})} rows={4}
                    placeholder="比如：等 Scarlett 周二过 VAAP"
                    style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:14, padding:'8px 10px', fontSize:13, fontFamily:'inherit', outline:'none', resize:'vertical', boxSizing:'border-box'}}/>
                  <div style={{display:'flex', gap:8, justifyContent:'flex-end', marginTop:10}}>
                    <button className="btn" onClick={()=>setNoteModal(null)}
                      style={{background:'white', border:'3px solid #2D2D2D', borderRadius:50, padding:'4px 14px', fontSize:12, fontWeight:700, cursor:'pointer'}}>取消</button>
                    <button className="btn" onClick={()=>{ if(noteModal.kind==='sub') updateSubtaskNote(noteModal.id, noteModal.subId, noteModal.val); else updateTask(noteModal.id,{note:noteModal.val}); setNoteModal(null); }}
                      style={{background:'#A8E6CF', border:'3px solid #2D2D2D', borderRadius:50, padding:'4px 16px', fontSize:12, fontWeight:700, cursor:'pointer', boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
                  </div>
                </div>
              </div>
            )}
          </>
        )}

        {tab==='weekly' && (() => {
          const wr = weekRangeOf(weekOffset);
          const digest = buildWeeklyDigest(state.tasks||[], wr.start, wr.end);
          const text = digestToText(digest);
          const copy = (str, msg) => { navigator.clipboard.writeText(str).then(()=>addToast&&addToast(msg)); };
          const runAI = async () => {
            setAiErr(''); setAiLoading(true); setAiText('');
            try { setAiText(await generateAIWeekly(digest)); }
            catch (e) { setAiErr(String(e.message||e)); }
            setAiLoading(false);
          };
          const SEC = [
            { key:'done',    label:'已完成', emoji:'✅', bg:'#A8E6CF' },
            { key:'doing',   label:'推进中', emoji:'🔄', bg:'#A8D8F0' },
            { key:'blocked', label:'卡住',   emoji:'⏸', bg:'#F7C8D4' },
            { key:'added',   label:'新增',   emoji:'🆕', bg:'#FDE68A' },
          ];
          const stat = (n, label, bg) => (
            <div style={{background:bg, border:'3px solid #2D2D2D', borderRadius:20, boxShadow:'4px 4px 0 #2D2D2D', padding:'8px 14px', textAlign:'center', minWidth:84}}>
              <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontSize:22, color:'#2D2D2D', lineHeight:1.1}}>{n}</div>
              <div style={{fontSize:11, color:'#2D2D2D', fontWeight:600}}>{label}</div>
            </div>
          );
          return (
            <div>
              {/* 周切换 + 动作 */}
              <div style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap', marginBottom:12}}>
                {[[0,'本周'],[-1,'上周'],[-2,'上上周']].map(([o,l])=>(
                  <button key={o} onClick={()=>{setWeekOffset(o); setAiText(''); setAiErr('');}}
                    style={{fontSize:12, fontWeight:700, padding:'4px 12px', borderRadius:50, cursor:'pointer',
                      border:'3px solid #2D2D2D', background:weekOffset===o?'#FDE68A':'white', color:'#2D2D2D', boxShadow:'3px 3px 0 #2D2D2D'}}>{l}</button>
                ))}
                <span style={{fontSize:12, color:'#6B6B6B'}}>{wr.start} ~ {wr.end}</span>
                <div style={{flex:1}}/>
                <button className="btn" onClick={()=>copy(text,'✅ 清单已复制')}
                  style={{fontSize:12, fontWeight:700, padding:'5px 14px', borderRadius:50, cursor:'pointer',
                    border:'3px solid #2D2D2D', background:'#FFFFFF', color:'#2D2D2D', boxShadow:'3px 3px 0 #2D2D2D'}}>📋 复制清单</button>
                <button className="btn" onClick={runAI} disabled={aiLoading}
                  style={{fontSize:12, fontWeight:700, padding:'5px 14px', borderRadius:50, cursor:aiLoading?'wait':'pointer',
                    border:'3px solid #2D2D2D', background:'#D4A5E8', color:'#2D2D2D', boxShadow:'3px 3px 0 #2D2D2D'}}>
                  {aiLoading?'生成中…':'✨ AI 写成周报'}</button>
              </div>

              {/* 概览数字 */}
              <div style={{display:'flex', gap:10, flexWrap:'wrap', marginBottom:14}}>
                {stat(digest.stats.nDone,'完成','#A8E6CF')}
                {stat(digest.stats.nDoing,'推进','#A8D8F0')}
                {stat(digest.stats.nSubDone,'子步骤','#FFCBA4')}
                {stat(digest.stats.nBlocked,'卡住','#F7C8D4')}
                {stat(digest.stats.nAdded,'新增','#FDE68A')}
              </div>

              {/* AI 周报 */}
              {(aiText || aiErr) && (
                <div style={{background:'white', border:'3px solid #2D2D2D', borderRadius:20, boxShadow:'6px 6px 0 #2D2D2D', padding:'12px 16px', marginBottom:14}}>
                  <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:8}}>
                    <span style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontSize:15}}>✨ AI 周报</span>
                    {aiText && <button className="btn" onClick={()=>copy(aiText,'✅ 周报已复制')}
                      style={{fontSize:11, fontWeight:700, padding:'2px 10px', borderRadius:50, cursor:'pointer',
                        border:'2px solid #2D2D2D', background:'#FDE68A', color:'#2D2D2D'}}>复制</button>}
                  </div>
                  {aiErr
                    ? <div style={{fontSize:12, color:'#2D2D2D', background:'#F7C8D4', border:'2px solid #2D2D2D', borderRadius:14, padding:'8px 10px'}}>
                        生成失败：{aiErr}　<br/>如果还没部署 Edge Function，可以先用「📋 复制清单」。
                      </div>
                    : <div style={{fontSize:13, color:'#2D2D2D', whiteSpace:'pre-wrap', lineHeight:1.8}}>{aiText}</div>}
                </div>
              )}

              {/* 站点 + 状态 双层明细 */}
              {digest.groups.length===0 ? (
                <div style={{background:'white', border:'3px solid #2D2D2D', borderRadius:20, boxShadow:'4px 4px 0 #2D2D2D', padding:'24px', textAlign:'center', color:'#6B6B6B', fontSize:13}}>
                  这周还没有可统计的动静——去任务看板勾几个子任务就有了
                </div>
              ) : digest.groups.map(g=>(
                <div key={g.site} style={{border:'3px solid #2D2D2D', borderRadius:20, boxShadow:'4px 4px 0 #2D2D2D', marginBottom:12, overflow:'hidden'}}>
                  <div style={{background:'#7ECDC0', borderBottom:'3px solid #2D2D2D', padding:'6px 14px',
                    fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontSize:15, color:'#2D2D2D'}}>{g.label}</div>
                  <div style={{background:'white', padding:'10px 14px'}}>
                    {SEC.filter(sec=>g[sec.key].length).map(sec=>(
                      <div key={sec.key} style={{marginBottom:8}}>
                        <span style={{display:'inline-block', fontSize:11, fontWeight:700, color:'#2D2D2D', background:sec.bg,
                          border:'2px solid #2D2D2D', borderRadius:50, padding:'1px 10px', marginBottom:4}}>{sec.emoji} {sec.label} {g[sec.key].length}</span>
                        {g[sec.key].map((it,i)=>(
                          <div key={i} style={{display:'flex', gap:6, fontSize:12, color:'#2D2D2D', padding:'2px 0 2px 4px', lineHeight:1.6}}>
                            <span style={{flexShrink:0}}>·</span>
                            <span>
                              <strong>{it.title}</strong>
                              {it.subsDone && it.subsDone.length>0 && <span style={{color:'#6B6B6B'}}>　本周完成 {it.subsDone.length} 项：{it.subsDone.join('、')}{it.progress?'（'+it.progress+'）':''}</span>}
                              {sec.key==='blocked' && it.note && <span style={{color:'#6B6B6B'}}>　卡在：{it.note}</span>}
                              {sec.key==='done' && it.note && <span style={{color:'#6B6B6B'}}>　{it.note}</span>}
                              {sec.key==='added' && it.due && <span style={{color:'#6B6B6B'}}>　{it.due} 到期</span>}
                            </span>
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>
              ))}

              {/* 下周计划 */}
              {digest.nextWeek.length>0 && (
                <div style={{border:'3px solid #2D2D2D', borderRadius:20, boxShadow:'4px 4px 0 #2D2D2D', overflow:'hidden', marginBottom:12}}>
                  <div style={{background:'#FFCBA4', borderBottom:'3px solid #2D2D2D', padding:'6px 14px',
                    fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontSize:15, color:'#2D2D2D'}}>下周计划</div>
                  <div style={{background:'white', padding:'10px 14px'}}>
                    {digest.nextWeek.map((it,i)=>(
                      <div key={i} style={{fontSize:12, color:'#2D2D2D', padding:'2px 0', lineHeight:1.6}}>
                        · <strong>{it.title}</strong>
                        {it.urgent && <span style={{marginLeft:6, fontSize:10, fontWeight:700, background:'#F7C8D4', border:'2px solid #2D2D2D', borderRadius:50, padding:'0 7px'}}>紧急</span>}
                        {it.due && <span style={{color:'#6B6B6B'}}>　{it.due} 到期</span>}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div style={{fontSize:11, color:'#6B6B6B', lineHeight:1.7}}>
                统计口径：「完成」= 本周把任务状态改成已完成；「推进」= 本周勾掉过子任务、或本周进入进行中；
                「卡住」= 当前状态是等待中；「新增」= 本周创建。子步骤完成时间是从现在开始记的，之前勾掉的子任务不会追溯。
              </div>
            </div>
          );
        })()}


        {tab==='notes' && (
          <div>
            <div className="hl-card" style={{background:'white', borderRadius:20, padding:14, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D', marginBottom:12}}>
              <div style={{fontSize:13, fontWeight:700, color:'#2D2D2D', marginBottom:8}}>📎 新增速记/参考资料</div>
              <div style={{display:'flex', flexDirection:'column', gap:8}}>
                <input value={noteTitle} onChange={e=>setNoteTitle(e.target.value)} placeholder="标题，比如：持仓大户 UUID"
                  style={{border:'2px solid #2D2D2D', borderRadius:16, padding:'7px 9px', fontSize:13, fontFamily:'inherit', outline:'none', boxSizing:'border-box'}}/>
                <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} rows={4} placeholder="内容，比如各个大户的 UUID、交易限额表等"
                  style={{border:'2px solid #2D2D2D', borderRadius:16, padding:'7px 9px', fontSize:12, fontFamily:'monospace', outline:'none', resize:'vertical', boxSizing:'border-box'}}/>
                <input value={noteLink} onChange={e=>setNoteLink(e.target.value)} placeholder="链接（可选）"
                  style={{border:'2px solid #2D2D2D', borderRadius:16, padding:'7px 9px', fontSize:12, fontFamily:'inherit', outline:'none', boxSizing:'border-box'}}/>
                <button onClick={addNote} style={{alignSelf:'flex-start', background:'#FDE68A', color:'#2D2D2D', border:'3px solid #2D2D2D', borderRadius:16, padding:'7px 18px', fontSize:12, fontWeight:700, cursor:'pointer', boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
              </div>
            </div>

            {(state.notes||[]).length===0 ? (
              <div style={{textAlign:'center', color:'#6B6B6B', fontSize:13, padding:'30px 0'}}>还没有速记，上面加一条吧</div>
            ) : (state.notes||[]).map(n=>(
              <div key={n.id} style={{background:'white', borderRadius:20, padding:14, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D', marginBottom:8}}>
                {editingNoteId===n.id ? (
                  <div style={{display:'flex', flexDirection:'column', gap:8}}>
                    <input value={noteDraft.title} onChange={e=>setNoteDraft({...noteDraft, title:e.target.value})}
                      style={{border:'2px solid #2D2D2D', borderRadius:16, padding:'6px 10px', fontSize:13, fontFamily:'inherit', boxSizing:'border-box'}}/>
                    <textarea value={noteDraft.text} rows={4} onChange={e=>setNoteDraft({...noteDraft, text:e.target.value})}
                      style={{border:'2px solid #2D2D2D', borderRadius:16, padding:'6px 10px', fontSize:12, fontFamily:'monospace', boxSizing:'border-box'}}/>
                    <input value={noteDraft.link} onChange={e=>setNoteDraft({...noteDraft, link:e.target.value})} placeholder="链接（可选）"
                      style={{border:'2px solid #2D2D2D', borderRadius:16, padding:'6px 10px', fontSize:12, fontFamily:'inherit', boxSizing:'border-box'}}/>
                    <div style={{display:'flex', gap:8}}>
                      <button onClick={()=>{ updateNote(n.id, noteDraft); setEditingNoteId(null); }}
                        style={{background:'#FDE68A', color:'#2D2D2D', border:'3px solid #2D2D2D', borderRadius:16, padding:'5px 12px', fontSize:12, cursor:'pointer', boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
                      <button onClick={()=>setEditingNoteId(null)} style={{background:'none', border:'2px solid #2D2D2D', borderRadius:16, padding:'5px 12px', fontSize:12, cursor:'pointer'}}>取消</button>
                    </div>
                  </div>
                ) : (
                  <>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                      <div style={{fontSize:14, fontWeight:700, color:'#2D2D2D'}}>{n.title}</div>
                      <div style={{display:'flex', gap:10}}>
                        <button onClick={()=>{ setNoteDraft({title:n.title, text:n.text, link:n.link}); setEditingNoteId(n.id); }} style={{background:'none', border:'none', color:'#2D2D2D', cursor:'pointer', fontSize:12}}>编辑</button>
                        <button onClick={()=>deleteNote(n.id)} style={{background:'none', border:'none', color:'#2D2D2D', cursor:'pointer', fontSize:12}}>删除</button>
                      </div>
                    </div>
                    {n.text && <div style={{fontSize:12, color:'#2D2D2D', marginTop:6, whiteSpace:'pre-wrap', fontFamily:'monospace'}}>{n.text}</div>}
                    {n.link && <a href={n.link} target="_blank" rel="noreferrer" style={{fontSize:11, color:'#2D2D2D', marginTop:6, display:'inline-block'}}>打开链接 ↗</a>}
                    <div style={{fontSize:10, color:'#6B6B6B', marginTop:6}}>新增于 {fmtTimestamp(n.createdAt)}</div>
                  </>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── App shell ────────────────────────────────────────────────────────────────
function App() {
  const [records, setRecords] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('dashboard');
  const [sidebarPage, setSidebarPage] = useState('overview'); // 'overview'|'HK'|'Global'|'ID'
  const [activeId, setActiveId] = useState(null);
  const [toasts, setToasts] = useState([]);

  // 初始加载 + 本地数据迁移 + 实时同步
  useEffect(() => {
    loadRecordsFromDB().then(async cloudData => {
      // 检查 localStorage 是否有旧数据需要迁移
      const LOCAL_KEY = 'osl_listing_records_v2';
      let localData = [];
      try { localData = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); } catch {}

      if (localData.length > 0) {
        // 有本地数据：把本地没有的条目上传到云端（避免覆盖云端已有的）
        const cloudIds = new Set(cloudData.map(r => r.id));
        const toMigrate = localData.filter(r => !cloudIds.has(r.id));
        if (toMigrate.length > 0) {
          await Promise.all(toMigrate.map(r => syncRecord(r)));
        }
        // 合并云端已有 + 本地迁移的
        const merged = [...cloudData, ...toMigrate];
        setRecords(merged);
        // 清除本地缓存，防止重复迁移
        localStorage.removeItem(LOCAL_KEY);
        if (toMigrate.length > 0) {
          setTimeout(() => addToast(`✅ 已将 ${toMigrate.length} 条本地任务迁移到云端`, 'success'), 500);
        }
      } else {
        setRecords(cloudData);
      }
      setLoading(false);
    });
    const channel = db.channel('listing-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'listing_records' }, payload => {
        if (payload.eventType === 'DELETE') {
          setRecords(prev => prev.filter(r => r.id !== payload.old.id));
        } else {
          const incoming = payload.new.data;
          setRecords(prev => {
            const exists = prev.find(r => r.id === incoming.id);
            return exists ? prev.map(r => r.id === incoming.id ? incoming : r) : [...prev, incoming];
          });
        }
      }).subscribe();
    return () => db.removeChannel(channel);
  }, []);

  const addToast = (msg, type='info') => {
    const id = Date.now() + Math.random();
    setToasts(prev=>[...prev, {id, msg, type}]);
    setTimeout(()=>setToasts(prev=>prev.filter(t=>t.id!==id)), 3500);
  };

  const activeRecord = records.find(r=>r.id===activeId);

  const handleSave = (recordOrArr) => {
    const arr = Array.isArray(recordOrArr) ? recordOrArr : [recordOrArr];
    arr.forEach(r => syncRecord(r));
    setRecords(prev=>[...prev, ...arr]);
    if (arr.length === 1) {
      setActiveId(arr[0].id);
      setView('checklist');
      addToast(`🆕 已创建任务：${arr[0].tokenName}`, 'success');
    } else {
      setView('dashboard');
      addToast(`🆕 已创建 ${arr.length} 条任务：${arr.map(r=>r.product).join(' + ')}`, 'success');
    }
  };

  const handleUpdate = (updated, toastMsg='') => {
    setRecords(prev=>prev.map(r=>r.id===updated.id?updated:r));
    syncRecord(updated);
    if (toastMsg) addToast(toastMsg);
  };

  const handleDelete = (id, reason='') => {
    const r = records.find(r=>r.id===id);
    const updated = {...r, cancelled:true, cancelReason:reason, updatedAt:new Date().toISOString()};
    setRecords(prev=>prev.map(r=>r.id===id ? updated : r));
    syncRecord(updated);
    addToast(`⏸ 已取消：${r?.tokenName||''}`, 'warn');
  };

  const handleRestore = (id) => {
    const r = records.find(r=>r.id===id);
    const updated = {...r, cancelled:false, cancelReason:'', updatedAt:new Date().toISOString()};
    setRecords(prev=>prev.map(r=>r.id===id ? updated : r));
    syncRecord(updated);
    addToast(`↩ 已恢复：${r?.tokenName||''}`, 'success');
  };

  const handleCopy = (record, targetSite) => {
    const newRecord = {
      ...record,
      id: genId(),
      site: targetSite,
      checked: {},
      naSteps: {},
      stepNotes: {},
      stepFields: {},
      cancelled: false,
      cancelReason: '',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    syncRecord(newRecord);
    setRecords(prev=>[newRecord,...prev]);
    const siteLabel = SITES.find(s=>s.id===targetSite)?.label || targetSite;
    addToast(`📋 已复制：${record.tokenName} → ${siteLabel}`, 'success');
  };

  const handleImport = (arr) => {
    arr.forEach(r => syncRecord(r));
    setRecords(prev => [...prev, ...arr]);
    addToast(`📥 已导入 ${arr.length} 条记录`, 'success');
  };

  const handleOpen = (id) => { setActiveId(id); setView('checklist'); };
  const handleBack = () => { setActiveId(null); setView('dashboard'); };
  const handleImportFile = (file) => {
    if (!file) return;
    // reuse same XLSX parse logic inline
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, {type:'binary', cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        const SITE_MAP = {'OSL HK':'HK','HK':'HK','Global':'Global','OSL Global':'Global','OSL ID':'ID','OSL ID ':'ID','ID':'ID'};
        const PRODUCT_MAP = {'OTC':'OTC','Orderbook':'Orderbook','RFQ':'RFQ','仅上链':'ChainOnly','理财代币':'WealthToken'};
        const IGNORE_PRODUCTS = ['StableHub','Launchpool'];
        const newRecords = [];
        rows.forEach(row => {
          const ticker = (row['Token Ticker']||row['Token']||'').toString().trim();
          if (!ticker) return;
          const siteRaw = (row['站点']||row['Site']||'').toString().trim();
          const productRaw = (row['交易类型']||row['Product']||'').toString().trim();
          const siteParts = siteRaw.split(',').map(s=>s.trim()).filter(Boolean);
          const sites = siteParts.map(s=>SITE_MAP[s]).filter(Boolean);
          if (sites.length===0) sites.push('HK');
          const productParts = productRaw.split(',').map(s=>s.trim()).filter(Boolean);
          const stableHub = productParts.some(p=>p==='StableHub');
          const launchpool = productParts.some(p=>p==='Launchpool');
          const products = productParts.filter(p=>!IGNORE_PRODUCTS.includes(p)).map(p=>PRODUCT_MAP[p]).filter(Boolean);
          if (products.length===0) products.push('OTC');
          const chainRaw = (row['区块链']||'').toString().trim();
          const chainLabels = chainRaw ? chainRaw.split('/').map(s=>s.trim()).filter(Boolean) : [];
          const quoteRaw = (row['交易对名称']||row['交易对']||'').toString().trim();
          const quoteCurrencies = quoteRaw ? quoteRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
          let expectedLaunchTime = null;
          const ltRaw = row['预计上线时间']||'';
          if (ltRaw instanceof Date) expectedLaunchTime = ltRaw.toISOString();
          else if (typeof ltRaw==='number'&&ltRaw>0) { try{ const d=XLSX.SSF.parse_date_code(ltRaw); if(d) expectedLaunchTime=new Date(d.y,d.m-1,d.d,d.H||0,d.M||0).toISOString(); }catch{} }
          else if (typeof ltRaw==='string'&&ltRaw.trim()) { const p=new Date(ltRaw.trim()); if(!isNaN(p)) expectedLaunchTime=p.toISOString(); }
          const userType = (row['用户类型']||'').toString().trim();
          const expectedMM = (row['做市商']||'').toString().trim();
          const tokenSymbol = ticker.toUpperCase();
          const tokenName = quoteCurrencies.length>0 ? quoteCurrencies.map(q=>`${tokenSymbol}/${q}`).join(', ') : tokenSymbol;
          sites.forEach(site => {
            products.forEach(product => {
              newRecords.push({
                _key: tokenSymbol+'|'+site+'|'+product,
                id:genId(), tokenName, tokenSymbol, quoteCurrencies,
                chainLabels, chainOnly:product==='ChainOnly', chains:[],
                userType, expectedMM, expectedLaunchTime,
                site, product, tokenType:'subtoken',
                stableHub: site==='Global'&&product==='RFQ'?stableHub:false,
                launchpool: site==='ID'?launchpool:false,
                blocker:'', checked:{}, naSteps:{}, stepNotes:{}, notes:'',
                createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
                estimatedTime:estimateTime(site,product,'subtoken'),
              });
            });
          });
        });
        const existingKeys = new Set(records.map(r=>(r.tokenSymbol||r.tokenName).toUpperCase()+'|'+r.site+'|'+r.product));
        const toImport = newRecords.filter(r=>!existingKeys.has(r._key)).map(({_key,...rest})=>rest);
        if (toImport.length>0) { handleImport(toImport); }
        else addToast('没有新记录需要导入（全部重复）','warn');
      } catch(err) { addToast('解析文件失败：'+err.message,'error'); }
    };
    reader.readAsBinaryString(file);
  };

  if (loading) return (
    <div style={{display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'100vh', gap:16, color:'#6B6B6B'}}>
      <div style={{fontSize:36}}>⏳</div>
      <div style={{fontSize:16, fontWeight:600}}>正在加载数据...</div>
      <div style={{fontSize:13}}>连接到 Supabase 云端数据库</div>
    </div>
  );

  const TOAST_COLORS = { success:'#A8E6CF', warn:'#FDE68A', info:'#A8D8F0', error:'#F7C8D4' };
  const showSidebar = view === 'dashboard';

  return (
    <div style={{display:'flex', height:'100vh'}}>
      <style>{`@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}`}</style>

      {/* Toast notifications */}
      <div style={{position:'fixed', top:16, right:16, zIndex:9999, display:'flex', flexDirection:'column', gap:8, pointerEvents:'none'}}>
        {toasts.map(t=>(
          <div key={t.id} style={{
            background:TOAST_COLORS[t.type]||TOAST_COLORS.info, border:'3px solid #2D2D2D',
            borderRadius:20, padding:'10px 16px', fontSize:13, fontWeight:600,
            color:'#2D2D2D', boxShadow:'4px 4px 0 #2D2D2D',
            maxWidth:320, animation:'slideIn 0.2s ease',
          }}>{t.msg}</div>
        ))}
      </div>

      {/* Sidebar — visible only on dashboard */}
      {showSidebar && (
        <Sidebar page={sidebarPage} onPage={setSidebarPage} records={records}/>
      )}

      {/* Main content */}
      <div style={{flex:1, overflow:'hidden', display:'flex', flexDirection:'column', background:'#F5F0E6', minHeight:0, position:'relative'}}>
        <DecoLayer variant={sidebarPage==='task_board'?'b':sidebarPage==='usdgo_budget'?'c':'a'}/>
        {view==='dashboard' && (
          sidebarPage==='overview' ? (
            <OverviewTable
              records={records}
              onOpen={handleOpen}
              onUpdate={handleUpdate}
              onNew={()=>setView('new')}
              onImport={handleImportFile}
              onDelete={handleDelete}
              onRestore={handleRestore}
              onCopy={handleCopy}
              siteFilter={null}
            />
          ) : sidebarPage==='usdgo_budget' ? (
            <UsdgoBudgetView addToast={addToast}/>
          ) : sidebarPage==='task_board' ? (
            <TaskBoardView addToast={addToast}/>
          ) : (
            <SiteView
              site={sidebarPage}
              records={records}
              onOpen={handleOpen}
              onUpdate={handleUpdate}
              onNew={()=>setView('new')}
              onImport={handleImportFile}
              onDelete={handleDelete}
              onRestore={handleRestore}
              onCopy={handleCopy}
            />
          )
        )}
        {view==='new' && <NewListingWizard onSave={handleSave} onCancel={()=>setView('dashboard')} existingRecords={records} onOpenExisting={id=>{ setActiveId(id); setView('checklist'); }}/>}
        {view==='checklist' && activeRecord && <ChecklistView record={activeRecord} onBack={handleBack} onUpdate={handleUpdate} addToast={addToast}/>}
        {view==='completed' && <CompletedTable records={records} onBack={()=>setView('dashboard')}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
