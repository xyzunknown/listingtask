              </div>
              <div>
                <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:5}}>用户类型</div>
                <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
                  {['PI（专业投资者）','零售 Retail','两者','不适用'].map(opt=>(
                    <button key={opt} onClick={()=>setEditUserType(editUserType===opt?'':opt)} style={{
                      border:`${(editUserType===opt) ? '3px' : '2px'} solid #2D2D2D`,
                      borderRadius:16, padding:'5px 11px', cursor:'pointer',
                      background: editUserType===opt?'#A8D8F0':'white',
                      fontSize:12, fontWeight: editUserType===opt?700:400,
                      color: editUserType===opt?C.navy:'#2D2D2D',
                    }}>{opt}</button>
                  ))}
                </div>
              </div>
              <div>
                <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:5}}>当前卡点</div>
                <textarea value={editBlocker} onChange={e=>setEditBlocker(e.target.value)}
                  placeholder="例如：等待合规尽调、LP未确认…（支持中文，可拖右下角调整大小）"
                  rows={3}
                  style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:16, padding:'7px 11px', fontSize:14, fontFamily:'inherit', outline:'none', resize:'vertical', lineHeight:1.6}}/>
              </div>
              <div>
                <div style={{fontSize:13, fontWeight:600, color:'#2D2D2D', marginBottom:5}}>期望上线时间</div>
                <input type="datetime-local" value={editLaunchTime} onChange={e=>setEditLaunchTime(e.target.value)} step="3600"
                  style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:16, padding:'7px 11px', fontSize:14, fontFamily:'inherit', outline:'none'}}/>
              </div>
            </div>
            <div style={{fontSize:12, color:'#6B6B6B', marginTop:12, marginBottom:4}}>注：站点、产品、代币类型不可编辑（影响清单结构）</div>
            <div style={{display:'flex', gap:10, marginTop:12, justifyContent:'flex-end'}}>
              <button onClick={()=>setShowEditModal(false)} style={{border:'2px solid #2D2D2D', background:'white', borderRadius:16, padding:'9px 18px', fontSize:13, cursor:'pointer', color:'#6B6B6B', fontWeight:600}}>取消</button>
              <button onClick={saveEditModal} style={{border:'3px solid #2D2D2D', background:'#A8D8F0', color:'#2D2D2D', borderRadius:16, padding:'8px 18px', fontSize:13, cursor:'pointer', fontWeight:700, boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
            </div>
          </div>
        </div>
      )}
      {/* Cancel reason modal */}
      {showCancelModal && (
        <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:16}}>
          <div style={{background:'white', borderRadius:20, padding:22, width:'100%', maxWidth:440, boxShadow:'6px 6px 0 #2D2D2D'}}>
            <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", fontWeight:700, fontSize:17, color:'#2D2D2D', marginBottom:6}}>取消上币任务</div>
            <div style={{fontSize:13, color:'#6B6B6B', marginBottom:14}}>进度数据会完整保留，可随时恢复。请说明取消原因：</div>
            <textarea
              autoFocus
              value={cancelReason}
              onChange={e=>setCancelReason(e.target.value)}
              placeholder="例如：项目方撤回申请、合规未通过、暂缓上线..."
              rows={4}
              style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:20, padding:'8px 11px', fontSize:14, fontFamily:'inherit', resize:'vertical', outline:'none'}}
              onFocus={e=>e.target.style.borderColor='#2D2D2D'}
              onBlur={e=>e.target.style.borderColor='#2D2D2D'}
            />
            <div style={{display:'flex', gap:10, marginTop:16, justifyContent:'flex-end'}}>
              <button onClick={()=>setShowCancelModal(false)} style={{border:'2px solid #2D2D2D', background:'white', borderRadius:16, padding:'9px 18px', fontSize:13, cursor:'pointer', color:'#6B6B6B', fontWeight:600}}>返回</button>
              <button onClick={handleCancelConfirm} disabled={!cancelReason.trim()} style={{border:'none', background: cancelReason.trim() ? 'white' : '#F5F0E6', color: cancelReason.trim() ? '#2D2D2D' : '#6B6B6B', borderRadius:16, padding:'8px 18px', fontSize:13, cursor: cancelReason.trim() ? 'pointer' : 'not-allowed', fontWeight:700}}>确认取消</button>
            </div>
          </div>
        </div>
      )}
      {/* Header */}
      <div style={{background:'#7ECDC0', padding:'16px 24px', borderBottom:'3px solid #2D2D2D'}} className="no-print">
        <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:10}}>
          <button className="btn" onClick={onBack} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13}}>← 返回列表</button>
          <button className="btn" onClick={()=>window.print()} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13}}>🖨 打印</button>
          <button className="btn" onClick={openEditModal} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13}}>✏ 编辑信息</button>
          {(record.annFields || annKind(record, allRecords)==='pair') && (
            <button className="btn" onClick={()=>setShowAnn(true)} style={{background:'#FFFFFF', border:'2px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13, fontWeight:700}}>📢 查看公告</button>
          )}
            <button className="btn" onClick={()=>setShowBanner(true)} style={{background:'#FFCBA4', border:'2px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'5px 11px', cursor:'pointer', fontSize:13, fontWeight:700}}>🖼 Banner 文案</button>
          {isCancelled
            ? <button className="btn" onClick={handleRestore} style={{marginLeft:'auto', background:'rgba(16,185,129,0.25)', border:'2px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13, fontWeight:600}}>↩ 恢复任务</button>
            : <button className="btn" onClick={()=>{setCancelReason('');setShowCancelModal(true);}} style={{marginLeft:'auto', background:'rgba(220,38,38,0.25)', border:'2px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13, fontWeight:600}}>✕ 取消任务</button>
          }
        </div>
        <div style={{display:'flex', alignItems:'center', gap:10}}>
          <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", color:'#2D2D2D', fontWeight:700, fontSize:18}}>{record.tokenName}</div>
          {isCancelled && <span style={{background:'#FFFFFF', color:'#2D2D2D', fontSize:12, fontWeight:700, padding:'2px 10px', borderRadius:99, border:'2px solid #2D2D2D'}}>已取消</span>}
        </div>
        <div style={{color:'#2D2D2D', fontSize:13, marginTop:3}}>
          {siteInfo?.icon} {siteInfo?.label} · {prodInfo?.icon} {prodInfo?.label} · {record.tokenType==='newchain'?'⛓️ 新链':'🪙 子代币'} · 预计 {record.estimatedTime}
        </div>
      </div>

      <div style={{maxWidth:900, margin:'0 auto', padding:'20px 16px'}}>
        {/* Progress */}
        <div className="hl-card" style={{background:'white', borderRadius:20, padding:'16px 20px', marginBottom:11, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D', display:'flex', alignItems:'center', gap:16}}>
          <ProgressRing pct={pct} size={56} stroke={5}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:700, color: isCancelled?'#6B6B6B':isComplete?C.green:C.navy, fontSize:15}}>
              {isCancelled ? '🚫 已取消' : isComplete ? '🎉 全部完成！' : `${done} / ${total} 步骤完成`}
            </div>
            <div style={{background:'#F5F0E6', borderRadius:99, height:7, marginTop:8, overflow:'hidden'}}>
              <div style={{width:`${pct}%`, height:'100%', background:isComplete?'#A8E6CF':'#7ECDC0', borderRadius:99, transition:'width 0.3s'}}/>
            </div>
          </div>
          <div style={{fontSize:12, color:'#6B6B6B', textAlign:'right'}}>
            <div>创建：{fmtDate(record.createdAt)}</div>
            <div>更新：{fmtDate(record.updatedAt)}</div>
          </div>
        </div>

        {/* Cancelled banner */}
        {isCancelled && record.cancelReason && (
          <div style={{background:'#F7C8D4', border:'2px solid #2D2D2D', borderRadius:20, padding:'10px 14px', marginBottom:11, display:'flex', gap:10, alignItems:'flex-start'}}>
            <span style={{fontSize:16, flexShrink:0}}>🚫</span>
            <div>
              <div style={{fontSize:12, fontWeight:700, color:'#2D2D2D', marginBottom:2}}>取消原因</div>
              <div style={{fontSize:13, color:'#2D2D2D'}}>{record.cancelReason}</div>
            </div>
          </div>
        )}

        {/* Notes */}
        <div className="hl-card" style={{background:'white', borderRadius:20, padding:'11px 15px', marginBottom:11, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D'}} className="no-print">
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: editNote?10:0}}>
            <span style={{fontSize:13, fontWeight:700, color:'#2D2D2D'}}>📝 任务备注</span>
            {!editNote ? (
              <button onClick={()=>setEditNote(true)} style={{background:'none', border:'2px solid #2D2D2D', borderRadius:14, padding:'4px 10px', fontSize:12, cursor:'pointer', color:'#6B6B6B'}}>编辑</button>
            ) : (
              <div style={{display:'flex', gap:6}}>
                <button onClick={()=>{setEditNote(false);setNoteText(record.notes||'');}} style={{background:'none', border:'2px solid #2D2D2D', borderRadius:14, padding:'4px 10px', fontSize:12, cursor:'pointer', color:'#6B6B6B'}}>取消</button>
                <button onClick={saveNote} style={{background:'#FDE68A', border:'3px solid #2D2D2D', borderRadius:14, padding:'4px 12px', fontSize:12, cursor:'pointer', color:'#2D2D2D', fontWeight:700, boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
              </div>
            )}
          </div>
          {editNote ? (
            <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} rows={3}
              placeholder="记录进展、特殊说明、联系结果..."
              style={{width:'100%', border:'2px solid #2D2D2D', borderRadius:16, padding:'10px', fontSize:13, fontFamily:'inherit', resize:'vertical'}}/>
          ) : (
            noteText ? <div style={{fontSize:13, color:'#6B6B6B', marginTop:6, lineHeight:1.6}}>{noteText}</div>
                     : <div style={{fontSize:12, color:'#6B6B6B', marginTop:2}}>点击编辑添加备注...</div>
          )}
        </div>

        {/* View mode toggle */}
        <div style={{display:'flex', gap:6, marginBottom:10}}>
          <button onClick={()=>setViewMode('phase')} style={{
            border:'2px solid #2D2D2D', background:viewMode==='phase'?'#FDE68A':'white',
            color:'#2D2D2D', borderRadius:16, padding:'5px 12px', fontSize:12, fontWeight:700, cursor:'pointer'}}>
            📋 阶段视图
          </button>
          <button onClick={()=>setViewMode('team')} style={{
            border:'2px solid #2D2D2D', background:viewMode==='team'?'#FDE68A':'white',
            color:'#2D2D2D', borderRadius:16, padding:'5px 12px', fontSize:12, fontWeight:700, cursor:'pointer'}}>
            🏊 团队视图（并行泳道）
          </button>
        </div>

        {/* Team lanes view — group by owner, show each team's progress in parallel */}
        {viewMode==='team' && (
          <div className="hl-card" style={{background:'white', borderRadius:20, padding:'12px 14px', marginBottom:11, border:'2px solid #2D2D2D', boxShadow:'4px 4px 0 #2D2D2D'}}>
            {lanes.map(({owner, steps})=>{
              const doneCount = steps.filter(s=>checked[s.id]||naSteps[s.id]).length;
              const currentStep = steps.find(s=>!checked[s.id] && !naSteps[s.id]);
              const laneComplete = doneCount===steps.length;
              return (
                <div key={owner} style={{marginBottom:12}}>
                  <div style={{display:'flex', alignItems:'baseline', gap:8, marginBottom:7, flexWrap:'wrap'}}>
                    <span style={{fontSize:13, fontWeight:700, color:'#2D2D2D'}}>{laneComplete?'✅ ':''}{owner}</span>
                    <span style={{fontSize:11, color:'#6B6B6B'}}>{doneCount}/{steps.length}</span>
                    {currentStep && <span style={{fontSize:11, color:'#2D2D2D', fontWeight:600}}>· 等 {currentStep.contact}</span>}
                  </div>
                  <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
                    {steps.map(s=>{
                      const isDone = !!checked[s.id];
                      const isNA = !isDone && !!naSteps[s.id];
                      const isCurrent = !!currentStep && s.id===currentStep.id;
                      return (
                        <span key={s.id}
                          onClick={()=>{ if(s.inputType==='approval'){ addToast&&addToast('该步骤需由审批人逐一签字，不能手动勾选'); return; } toggle(s.id); }}
                          title={s.task + (s.contact?(' · '+s.contact):'')}
                          style={{fontSize:12, padding:'6px 11px', borderRadius:16, cursor:'pointer',
                            background:isDone?'#A8E6CF':isNA?'#F5F0E6':isCurrent?'#A8D8F0':'white',
                            color:isDone?'#2D2D2D':isNA?'#6B6B6B':isCurrent?'#2D2D2D':'#6B6B6B',
                            border:'2px solid #2D2D2D',
                            fontWeight:isCurrent?700:400, textDecoration:isNA?'line-through':'none'}}>
                          {isDone?'✓ ':''}{s.task}
                        </span>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* Phase groups */}
        {viewMode==='phase' && phases.map((phase,pi)=>{
          const pc = PHASE_COLORS[phase.tag]||PHASE_COLORS.exec;
          const pd = phase.steps.filter(s=>checked[s.id]).length;
          return (
            <div key={pi} style={{marginBottom:10}}>
              <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:6, padding:'0 4px'}}>
                <div style={{background:pc.bg, border:'2px solid #2D2D2D', borderRadius:99, padding:'2px 12px', fontSize:12, fontWeight:700, color:'#2D2D2D'}}>{phase.name}</div>
                <div style={{fontSize:12, color:'#6B6B6B'}}>{pd}/{phase.steps.length} 完成</div>
              </div>
              {phase.steps.map(step=>{
                const isDone = !!checked[step.id];
                const isNA   = !isDone && !!(naSteps[step.id]);
                const isExp  = !!expandedSteps[step.id];
                const hasNote = step.note && step.note.trim();
                const myNote  = stepNotes[step.id] || '';
                const isEditingNote = editingStepNote === step.id;
                const bg = isDone ? '#A8E6CF' : isNA ? '#FFFFFF' : 'white';
                const borderColor = isDone ? '#A8E6CF' : isNA ? '#F5F0E6' : step.critical ? '#F7C8D4' : '#F5F0E6';
                const leftColor   = isDone ? '#2D2D2D' : isNA ? '#6B6B6B' : step.critical ? '#2D2D2D' : pc.border;
                return (
                  <div key={step.id} style={{background:bg, border:'1px solid '+borderColor, borderLeft:'4px solid '+leftColor,
                    borderRadius:20, marginBottom:8, overflow:'hidden', boxShadow:'4px 4px 0 #2D2D2D', transition:'all 0.15s'}}>
                    <div style={{display:'flex', alignItems:'flex-start', padding:'11px 14px', gap:10}}>
                      {/* Done checkbox */}
                      <div onClick={()=>{ if(step.inputType==='approval'){ addToast&&addToast('该步骤需由审批人逐一签字，不能手动勾选'); return; } toggle(step.id); }} style={{width:22,height:22,borderRadius:14,
                        border:'2px solid #2D2D2D',
                        background:isDone?'#A8E6CF':'white', display:'flex',alignItems:'center',justifyContent:'center',
                        flexShrink:0, marginTop:2, cursor:'pointer', transition:'all 0.15s'}}>
                        {isDone && <span style={{color:'#2D2D2D',fontSize:13,fontWeight:700}}>✓</span>}
                      </div>
                      {/* Step info */}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                          <span style={{fontWeight:700,fontSize:14,
                            color: isDone?'#6B6B6B': isNA?'#6B6B6B':'#2D2D2D',
                            textDecoration: isDone||isNA?'line-through':'none'}}>
                            {step.idx+1}. {step.task}
                          </span>
                          {isNA && <span style={{background:'#F5F0E6',color:'#6B6B6B',fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:99}}>不需要</span>}
                          {step.critical && !isDone && !isNA && <span style={{background:'#F7C8D4',color:'#2D2D2D',fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:99}}>关键</span>}
                        </div>
                        {/* Text input for inputType=text */}
                        {step.inputType==='text' && !isNA && (
                          <div style={{marginTop:6}}>
                            <input value={stepFields[step.inputKey]||''}
                              onChange={e=>setStepField(step.inputKey,e.target.value,step.id)}
                              onClick={e=>e.stopPropagation()}
                              placeholder={`输入${step.task}…`}
                              style={{width:'100%',fontSize:13,border:'2px solid #2D2D2D',
                                borderRadius:16,padding:'6px 9px',outline:'none',fontFamily:'inherit',
                                background:stepFields[step.inputKey]?'#A8E6CF':'white',boxSizing:'border-box'}}/>
                          </div>
                        )}
                        {/* Select for inputType=select */}
                        {step.inputType==='select' && !isNA && (
                          <div style={{display:'flex',gap:6,marginTop:6,flexWrap:'wrap'}}>
                            {(step.inputOptions||[]).map(opt=>{
                              const sel = stepFields[step.inputKey]===opt;
                              return (
                                <button key={opt} onClick={e=>{e.stopPropagation();setStepField(step.inputKey,sel?'':opt,step.id);}}
                                  style={{fontSize:12,padding:'4px 12px',borderRadius:14,cursor:'pointer',
                                    background:sel?'#FDE68A':'white',color:'#2D2D2D',
                                    border:`${(sel) ? '3px' : '2px'} solid #2D2D2D`,fontWeight:sel?700:400}}>
                                  {opt}
                                </button>
                              );
                            })}
                          </div>
                        )}
                        {/* Approval sign-off for inputType=approval */}
                        {step.inputType==='approval' && !isNA && (()=>{
                          const signed = (record.approvals||{})[step.inputKey] || {};
                          const approvers = step.inputOptions||[];
                          const nSigned = approvers.filter(n=>signed[n]).length;
                          return (
                            <div style={{marginTop:8}} onClick={e=>e.stopPropagation()}>
                              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                                <span style={{fontSize:12,fontWeight:700,color:'#2D2D2D'}}>
                                  并行会签 {nSigned}/{approvers.length}
                                </span>
                                <div style={{flex:1,height:5,background:'#F5F0E6',borderRadius:99,overflow:'hidden'}}>
                                  <div style={{width:(approvers.length?nSigned/approvers.length*100:0)+'%',height:'100%',background:nSigned===approvers.length?'#A8E6CF':'#FDE68A',transition:'width 0.2s'}}/>
                                </div>
                                {nSigned===approvers.length && <span style={{fontSize:11,fontWeight:700,color:'#2D2D2D'}}>🔓 已通过</span>}
                              </div>
                              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                                {approvers.map(name=>{
                                  const at = signed[name];
                                  return (
                                    <button key={name} onClick={()=>toggleApproval(step.inputKey,name,approvers,step.id)}
                                      title={at?('已签字：'+new Date(at).toLocaleString('zh-CN')):'点击签字'}
                                      style={{display:'flex',alignItems:'center',gap:5,fontSize:12,padding:'5px 11px',borderRadius:99,cursor:'pointer',
                                        border:`${(at) ? '3px' : '2px'} solid #2D2D2D`,background:at?'#A8E6CF':'white',
                                        color:'#2D2D2D',fontWeight:at?700:500}}>
                                      <span>{at?'✅':'⭕'}</span>{name}
                                    </button>
                                  );
                                })}
                              </div>
                              <div style={{fontSize:11,color:'#6B6B6B',marginTop:5}}>每人各自点击签字；五人全签齐后闸门自动通过</div>
                            </div>
                          );
                        })()}
                        {!step.inputType && <div style={{display:'flex',gap:12,marginTop:4,flexWrap:'wrap'}}>
                          <span style={{fontSize:12,color:'#6B6B6B'}}>👤 {step.owner}</span>
                          <span style={{fontSize:12,color:'#2D2D2D',fontWeight:600}}>📞 {step.contact}</span>
                          <span style={{fontSize:12,color:'#6B6B6B'}}>⏱ {step.time}</span>
                        </div>}
                        {/* Per-step note display */}
                        {myNote && !isEditingNote && (
                          <div style={{marginTop:6, background:'#FDE68A', border:'2px solid #2D2D2D', borderRadius:14,
                            padding:'5px 10px', fontSize:12, color:'#2D2D2D', display:'flex', gap:6, alignItems:'flex-start'}}>
                            <span>📌</span><span style={{flex:1}}>{myNote}</span>
                          </div>
                        )}
                        {/* Note editor */}
                        {isEditingNote && (
                          <div style={{marginTop:6}}>
                            <textarea autoFocus value={stepNoteVal} onChange={e=>setStepNoteVal(e.target.value)}
                              placeholder="填写备注信息，如负责人确认结果、截图说明等..."
                              rows={2} style={{width:'100%',fontSize:12,border:'2px solid #2D2D2D',borderRadius:14,
                                padding:'6px 8px',fontFamily:'inherit',resize:'vertical',outline:'none',boxSizing:'border-box'}}/>
                            <div style={{display:'flex',gap:6,marginTop:4}}>
                              <button onClick={()=>saveStepNote(step.id)} style={{background:'#FDE68A',color:'#2D2D2D',border:'3px solid #2D2D2D',borderRadius:14,padding:'4px 12px',fontSize:12,cursor:'pointer',fontWeight:600, boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
                              <button onClick={()=>setEditingStepNote(null)} style={{background:'none',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 10px',fontSize:12,cursor:'pointer',color:'#6B6B6B'}}>取消</button>
                              {myNote && <button onClick={()=>{setStepNoteVal('');saveStepNote(step.id);}} style={{background:'none',border:'2px solid #2D2D2D',borderRadius:14,padding:'4px 10px',fontSize:12,cursor:'pointer',color:'#2D2D2D'}}>清除</button>}
                            </div>
                          </div>
                        )}
                      </div>
                      {/* Action buttons: N/A + Note + Expand */}
                      <div style={{display:'flex',gap:4,flexShrink:0,alignItems:'center',marginTop:2}}>
                        <button onClick={e=>{e.stopPropagation();toggleNA(step.id);}}
                          title="标记为不需要"
                          style={{fontSize:11,fontWeight:600,padding:'3px 7px',borderRadius:12,cursor:'pointer',
                            background:isNA?'#F5F0E6':'none', color:isNA?'#6B6B6B':'#6B6B6B',
                            border:'2px solid #2D2D2D',
                            transition:'all 0.15s'}}>N/A</button>
                        <button onClick={e=>{e.stopPropagation();setEditingStepNote(isEditingNote?null:step.id);setStepNoteVal(myNote);}}
                          title="添加备注信息"
                          style={{fontSize:12,padding:'3px 6px',borderRadius:12,cursor:'pointer',
                            background:myNote?'#FDE68A':'none', color:myNote? '#2D2D2D' :'#6B6B6B',
                            border:'2px solid #2D2D2D'}}>📝</button>
                        {hasNote && (
                          <button onClick={e=>{e.stopPropagation();setExpandedSteps(p=>({...p,[step.id]:!p[step.id]}));}}
                            style={{background:'none',border:'2px solid #2D2D2D',cursor:'pointer',fontSize:13,color:'#6B6B6B',padding:'3px 5px',borderRadius:12}}>
                            {isExp?'▲':'▼'}
                          </button>
                        )}
                      </div>
                    </div>
                    {hasNote && isExp && (
                      <div style={{background:'#FDE68A',borderTop:'2px solid #2D2D2D',padding:'10px 14px 10px 48px'}}>
                        {step.note.split('\n').map((l,i)=>(
                          <div key={i} style={{fontSize:12,color:'#6B6B6B',lineHeight:1.6}}>{l}</div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── Completed Table ──────────────────────────────────────────────────────────
function CompletedTable({ records, onBack }) {
  const [copied, setCopied] = useState(false);

  const completed = records.filter(r => getRecordStatus(r, buildChecklist(r.site,r.product,r.tokenType,{stableHub:r.stableHub,launchpool:r.launchpool})) === 'completed');

  const COLS = ['Token','区块链','交易对','站点','交易类型','用户类型','上线时间'];
  const toRow = r => [
    r.tokenSymbol || r.tokenName,
    (r.chainLabels||[]).join(' / ') || '—',
    r.chainOnly ? '仅上链' : (r.quoteCurrencies||[]).length>0 ? (r.quoteCurrencies).map(q=>`${r.tokenSymbol||r.tokenName}/${q}`).join(', ') : r.tokenName,
    r.site,
    r.product + (r.stableHub?' +SH':''),
    r.userType || '—',
    r.expectedLaunchTime ? fmtLaunchTime(r.expectedLaunchTime) : fmtDate(r.updatedAt),
  ];

  const exportExcel = () => {
    const ws = XLSX.utils.aoa_to_sheet([COLS, ...completed.map(toRow)]);
    // Column widths
    ws['!cols'] = [16,20,30,10,14,16,16].map(w=>({wch:w}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '已完成上币');
    XLSX.writeFile(wb, `OSL已完成上币_${toLocalDateStr(new Date())}.xlsx`);
  };

  const copyTSV = () => {
    const lines = [COLS, ...completed.map(toRow)].map(r=>r.join('\t')).join('\n');
    navigator.clipboard.writeText(lines).then(()=>{
      setCopied(true); setTimeout(()=>setCopied(false), 2000);
    });
  };

  return (
    <div>
      <div style={{background:'#7ECDC0', padding:'16px 24px', display:'flex', alignItems:'center', gap:16, borderBottom:'3px solid #2D2D2D'}}>
        <button className="btn" onClick={onBack} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 12px', cursor:'pointer', fontSize:13}}>← 返回</button>
        <div style={{fontFamily:"'Fredoka One','ZCOOL XiaoWei',cursive", color:'#2D2D2D', fontWeight:700, fontSize:16}}>已完成上币记录</div>
        <div style={{marginLeft:'auto', display:'flex', gap:8}}>
          <button onClick={copyTSV} style={{background:'#FFFFFF', border:'none', color:'#2D2D2D', borderRadius:16, padding:'6px 14px', cursor:'pointer', fontSize:13, fontWeight:600}}>
            {copied ? '✓ 已复制' : '📋 一键复制'}
          </button>
          <button onClick={exportExcel} style={{background:'#A8E6CF', border:'3px solid #2D2D2D', color:'#2D2D2D', borderRadius:16, padding:'6px 14px', cursor:'pointer', fontSize:13, fontWeight:700, boxShadow:'3px 3px 0 #2D2D2D'}}>
            ⬇ 导出 Excel
          </button>
        </div>
      </div>
      <div style={{maxWidth:1000, margin:'0 auto', padding:'20px 16px'}}>
        {completed.length === 0 ? (
          <div style={{textAlign:'center', padding:'60px 0', color:'#6B6B6B'}}>
            <div style={{fontSize:40, marginBottom:10}}>🎉</div>
            <div style={{fontSize:15, fontWeight:600}}>暂无已完成的上币任务</div>
          </div>
        ) : (
          <div style={{background:'white', borderRadius:20, overflow:'hidden', boxShadow:'4px 4px 0 #2D2D2D'}}>
            <table style={{width:'100%', borderCollapse:'collapse', fontSize:13}}>
              <thead>
                <tr style={{background:'#FDE68A'}}>
                  {COLS.map(col=>(
                    <th key={col} style={{padding:'8px 12px', textAlign:'left', fontWeight:700, color:'#2D2D2D', borderBottom:'2px solid #2D2D2D', whiteSpace:'nowrap'}}>{col}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {completed.map((r,i)=>{
                  const row = toRow(r);
                  const siteInfo = SITES.find(s=>s.id===r.site);
                  return (
                    <tr key={r.id} style={{background: i%2===0?'white':'#F5F0E6', borderBottom:'2px solid #2D2D2D'}}>
                      <td style={{padding:'8px 12px', fontWeight:700, color:'#2D2D2D'}}>{row[0]}</td>
                      <td style={{padding:'8px 12px', color:'#2D2D2D'}}>{row[1]}</td>
                      <td style={{padding:'8px 12px', color:'#2D2D2D'}}>{row[2]}</td>
                      <td style={{padding:'8px 12px'}}>
                        <span style={{background:siteInfo?.bg, color:siteInfo?.color, fontWeight:700, fontSize:11, padding:'2px 8px', borderRadius:99}}>{siteInfo?.icon} {r.site}</span>
                      </td>
                      <td style={{padding:'8px 12px', color:'#2D2D2D'}}>{row[4]}</td>
                      <td style={{padding:'8px 12px', color:'#6B6B6B'}}>{row[5]}</td>
                      <td style={{padding:'8px 12px', color:'#2D2D2D', fontWeight:600}}>{row[6]}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <div style={{padding:'10px 16px', background:'#FDE68A', borderTop:'2px solid #2D2D2D', fontSize:12, color:'#2D2D2D'}}>
              共 {completed.length} 条记录
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Working days helper ──────────────────────────────────────────────────────
function workingDaysUntil(isoDate) {
  if (!isoDate) return 999;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(isoDate); target.setHours(0,0,0,0);
  if (target <= today) return -1;
  let count = 0; const cur = new Date(today);
  while (cur < target) {
    cur.setDate(cur.getDate()+1);
    const d = cur.getDay();
    if (d!==0 && d!==6) count++;
  }
  return count;
}

// 过了预计上线时间还没完成的，算过期：返回过了几个自然日（当天 = 0），没到期或没填时间返回 null
function overdueDays(isoDate) {
  if (!isoDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(isoDate); target.setHours(0,0,0,0);
  if (target > today) return null;
  return Math.round((today - target) / 86400000);
}

// ─── Detail Panel ─────────────────────────────────────────────────────────────
function DetailPanel({ record, onClose, onUpdate, onOpenFull, onCopy, scrollToPhase , allRecords }) {
  const checklist = useMemo(()=>buildChecklist(record.site,record.product,record.tokenType,{stableHub:record.stableHub,launchpool:record.launchpool}),[record]);
  const [collapsedPhases, setCollapsedPhases] = useState({});
  const [editingStepNote, setEditingStepNote] = useState(null);
  const [stepNoteVal, setStepNoteVal] = useState('');
  const [showCopyMenu, setShowCopyMenu] = useState(false);
  const [showAnnPanel, setShowAnnPanel] = useState(false);
  const [showBannerPanel, setShowBannerPanel] = useState(false);
  const phaseRefs = React.useRef({});

  // Scroll to phase when triggered from table
  useEffect(()=>{
    if (!scrollToPhase) return;
    setCollapsedPhases(prev=>({...prev,[scrollToPhase]:false}));
    setTimeout(()=>{
      const el = phaseRefs.current[scrollToPhase];
      if (el) el.scrollIntoView({behavior:'smooth',block:'start'});
    }, 80);
  },[scrollToPhase]);

  const checked   = record.checked   || {};
  const naSteps   = record.naSteps   || {};
  const stepNotes = record.stepNotes || {};
  const total = checklist.length;
  const done  = countDone(checked, naSteps, checklist);
  const pct   = total ? Math.round(done/total*100) : 0;
  const isCancelled = !!record.cancelled;

  const toggle = (idx) => {
    const nowDone = !checked[idx];
    const newChecked = {...checked, [idx]: nowDone};
    const newNA = nowDone ? {...naSteps, [idx]:false} : naSteps;
    onUpdate({...record, checked:newChecked, naSteps:newNA, updatedAt:new Date().toISOString()});
  };
  const toggleApproval = (inputKey, name, approvers, stepIdx) => {
    const allAppr = record.approvals || {};
    const cur = {...(allAppr[inputKey] || {})};
    if (cur[name]) delete cur[name]; else cur[name] = new Date().toISOString();
    const allSigned = approvers.every(n => cur[n]);
    onUpdate({...record, approvals:{...allAppr,[inputKey]:cur}, checked:{...checked,[stepIdx]:allSigned}, updatedAt:new Date().toISOString()});
  };
  const toggleNA = (idx) => {
    const nowNA = !naSteps[idx];
    const newNA = {...naSteps, [idx]: nowNA};
    const newChecked = nowNA ? {...checked, [idx]:false} : checked;
    onUpdate({...record, naSteps:newNA, checked:newChecked, updatedAt:new Date().toISOString()});
  };
  const saveStepNote = (idx) => {
    onUpdate({...record, stepNotes:{...stepNotes,[idx]:stepNoteVal.trim()}, updatedAt:new Date().toISOString()});
    setEditingStepNote(null);
  };
  const stepFields = record.stepFields || {};
  const setStepField = (inputKey, value, stepIdx) => {
    const newFields = {...stepFields, [inputKey]: value};
    const newChecked = {...checked, [stepIdx]: !!value};
    onUpdate({...record, stepFields:newFields, checked:newChecked, updatedAt:new Date().toISOString()});
  };

  // Group by phase
  const phases = [];
  let curPh = null;
  checklist.forEach((step,i)=>{
    if (!curPh || curPh.name!==step.phase) { curPh={name:step.phase,tag:step.tag,steps:[]}; phases.push(curPh); }
    curPh.steps.push({...step,idx:i});
  });

  const SSITE = {HK:{bg:'#A8D8F0',color:'#2D2D2D'},Global:{bg:'#7ECDC0',color:'#2D2D2D'},ID:{bg:'#D4A5E8',color:'#2D2D2D'},SG:{bg:'#A8E6CF',color:'#2D2D2D'}};
  const ss = SSITE[record.site]||{bg:'#F5F0E6',color:'#2D2D2D'};
  const siteInfo = SITES.find(s=>s.id===record.site);

  return (
    <div style={{width:400,flexShrink:0,borderLeft:'2px solid #2D2D2D',display:'flex',flexDirection:'column',background:'white',overflow:'hidden'}}>
      <style>{`@keyframes slideInPanel{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}.panel-step:hover{background:#FDE68A!important}`}</style>

      {/* Announcement overlay from panel */}
      {showBannerPanel && (
        <BannerView record={record} onClose={()=>setShowBannerPanel(false)} onUpdate={onUpdate}/>
      )}

      {showAnnPanel && annKind(record, allRecords)==='pair' && (
        <PairListingAnnouncementView record={record} onClose={()=>setShowAnnPanel(false)} onUpdate={onUpdate}/>
      )}

      {showAnnPanel && annKind(record, allRecords)==='chain' && record.site!=='HK' && (
        <ChainOnlyAnnGlobal record={record} onClose={()=>setShowAnnPanel(false)} onUpdate={onUpdate}/>
      )}
      {showAnnPanel && annKind(record, allRecords)==='chain' && record.site==='HK' && (
        <ChainOnlyAnnHK record={record} onClose={()=>setShowAnnPanel(false)} onUpdate={onUpdate}/>
      )}
      {showAnnPanel && annKind(record, allRecords)!=='pair' && annKind(record, allRecords)!=='chain' && record.annFields && (
        record.annFields.annType==='GlobalOTC'
          ? <AnnouncementViewGlobal record={record} onClose={()=>setShowAnnPanel(false)} onUpdate={onUpdate}/>
          : <AnnouncementView record={record} onClose={()=>setShowAnnPanel(false)} onUpdate={onUpdate}/>
      )}

      {/* Header */}
      <div style={{padding:'12px 14px 10px',borderBottom:'2px solid #2D2D2D',flexShrink:0,background:ss.bg}}>
        <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:5}}>
          <div style={{flex:1,fontWeight:700,fontSize:15,color:ss.color,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}
            title={record.tokenName}>{record.tokenName}</div>
          {/* Copy button + menu */}
          {onCopy && (
            <div style={{position:'relative'}}>
              <button onClick={()=>setShowCopyMenu(v=>!v)} title="复制到其他站点"
                style={{background:'rgba(0,0,0,0.08)',border:'none',borderRadius:12,padding:'3px 8px',cursor:'pointer',fontSize:11,color:ss.color,fontWeight:700,whiteSpace:'nowrap'}}>
                📋
              </button>
              {showCopyMenu && (
                <div style={{position:'absolute',top:'calc(100% + 4px)',right:0,zIndex:300,background:'white',
                  border:'2px solid #2D2D2D',borderRadius:20,boxShadow:'6px 6px 0 #2D2D2D',minWidth:170}}
                  onClick={e=>e.stopPropagation()}>
                  <div style={{padding:'8px 12px 5px',fontSize:11,color:'#6B6B6B',fontWeight:700}}>复制到站点</div>
                  {SITES.filter(s=>s.id!==record.site).map(s=>(
                    <div key={s.id} onClick={()=>{onCopy(record,s.id);setShowCopyMenu(false);}}
                      style={{padding:'8px 14px',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',gap:8,color:'#2D2D2D'}}
                      onMouseEnter={e=>e.currentTarget.style.background='#F5F0E6'}
                      onMouseLeave={e=>e.currentTarget.style.background='white'}>
                      <span>{s.icon}</span><span>{s.label}</span>
                    </div>
                  ))}
                  <div onClick={()=>{onCopy(record,record.site);setShowCopyMenu(false);}}
                    style={{padding:'8px 14px',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',gap:8,
                      color:'#2D2D2D',borderTop:'2px solid #2D2D2D'}}
                    onMouseEnter={e=>e.currentTarget.style.background='#F5F0E6'}
                    onMouseLeave={e=>e.currentTarget.style.background='white'}>
                    <span>📋</span><span>复制到同站点</span>
                  </div>
                </div>
              )}
            </div>
          )}
          {record.annFields && (
            <button onClick={()=>setShowAnnPanel(true)} title="查看三语公告"
              style={{background:'rgba(0,0,0,0.08)',border:'none',borderRadius:12,padding:'3px 8px',cursor:'pointer',fontSize:11,color:ss.color,fontWeight:700,whiteSpace:'nowrap'}}>
              📢 公告
            </button>
          )}
          <button onClick={()=>onOpenFull(record.id)} title="打开完整视图"
            style={{background:'rgba(0,0,0,0.08)',border:'none',borderRadius:12,padding:'3px 8px',cursor:'pointer',fontSize:11,color:ss.color,fontWeight:700,whiteSpace:'nowrap'}}>
            ↗ 完整
          </button>
          <button onClick={onClose}
            style={{background:'rgba(0,0,0,0.08)',border:'none',borderRadius:12,padding:'3px 8px',cursor:'pointer',fontSize:14,color:ss.color,fontWeight:700,lineHeight:1}}>
            ✕
          </button>
        </div>
        <div style={{display:'flex',gap:5,flexWrap:'wrap',alignItems:'center'}}>
          <span style={{background:'#FFFFFF',color:ss.color,fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:99}}>
            {siteInfo?.icon} {record.site}
          </span>
          <span style={{background:'#FFFFFF',color:'#2D2D2D',fontSize:11,fontWeight:600,padding:'2px 8px',borderRadius:99}}>
            {record.product}{record.stableHub?' +SH':''}{record.launchpool?' +LP':''}
          </span>
          {isCancelled && <span style={{background:'rgba(0,0,0,0.1)',color:'#6B6B6B',fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:99}}>已取消</span>}
        </div>
      </div>

      {/* Progress */}
      <div style={{padding:'9px 14px',borderBottom:'2px solid #2D2D2D',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
          <div style={{flex:1,background:'#F5F0E6',borderRadius:99,height:6,overflow:'hidden'}}>
            <div style={{width:`${pct}%`,height:'100%',background:pct===100?'#A8E6CF':C.blue,borderRadius:99,transition:'width 0.3s'}}/>
          </div>
          <span style={{fontSize:12,fontWeight:700,color:pct===100?'#2D2D2D':C.navy,whiteSpace:'nowrap'}}>{done}/{total}</span>
          <span style={{fontSize:11,color:'#6B6B6B'}}>{pct}%</span>
        </div>
        {record.blocker && (
          <div style={{background:'#FDE68A',borderRadius:12,padding:'4px 9px',fontSize:11,color:'#2D2D2D'}}>🚧 {record.blocker}</div>
        )}
      </div>

      {/* Phase steps - scrollable */}
      <div style={{flex:1,overflowY:'auto',padding:'4px 0',animation:'slideInPanel 0.18s ease'}}>
        {phases.map(ph=>{
          const phDone = ph.steps.filter(s=>checked[s.id]||naSteps[s.id]).length;
          const phColor = PHASE_COLORS[ph.tag]||{border:'#6B6B6B',bg:'#FFFFFF',label:ph.name};
          const isCollapsed = !!collapsedPhases[ph.tag];
          return (
            <div key={ph.name} ref={el=>phaseRefs.current[ph.tag]=el}>
              {/* Phase header */}
              <div onClick={()=>setCollapsedPhases(prev=>({...prev,[ph.tag]:!prev[ph.tag]}))}
                style={{display:'flex',alignItems:'center',gap:8,padding:'5px 12px',cursor:'pointer',
                  background:phColor.bg,borderLeft:`3px solid ${phColor.border}`,userSelect:'none'}}>
                <span style={{fontSize:11,fontWeight:700,color:phColor.border,flex:1}}>{ph.name}</span>
                <span style={{fontSize:11,color:phDone===ph.steps.length&&ph.steps.length>0?'#2D2D2D':phColor.border,fontWeight:600}}>{phDone}/{ph.steps.length}</span>
                <span style={{fontSize:9,color:phColor.border,opacity:0.7}}>{isCollapsed?'▶':'▼'}</span>
              </div>
              {/* Steps */}
              {!isCollapsed && ph.steps.map(step=>{
                const isDone  = !!checked[step.id];
                const isNA    = !!naSteps[step.id];
                const hasNote = !!stepNotes[step.id];
                const isEditN = editingStepNote===step.id;
                const fieldVal = step.inputKey ? (stepFields[step.inputKey]||'') : '';
                return (
                  <div key={step.id} className="panel-step"
                    style={{borderBottom:'2px solid #2D2D2D',background:isDone?'#A8E6CF':isNA?'#FFFFFF':'white',opacity:isCancelled?0.6:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:7,padding:'6px 12px'}}>
                      {/* Done checkbox */}
                      <div onClick={()=>{ if(isCancelled)return; if(step.inputType==='approval')return; toggle(step.id); }}
                        style={{width:17,height:17,borderRadius:12,flexShrink:0,cursor:isCancelled||step.inputType==='approval'?'default':'pointer',
                          border:isDone?'none':'2px solid #2D2D2D',background:isDone?'#A8E6CF':'white',
                          display:'flex',alignItems:'center',justifyContent:'center'}}>
                        {isDone && <span style={{color:'#2D2D2D',fontSize:10,lineHeight:1}}>✓</span>}
                      </div>
                      {/* Task */}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,color:isDone?'#6B6B6B':isNA?'#6B6B6B':'#2D2D2D',
                          textDecoration:isNA?'line-through':'none',
                          fontWeight:step.critical&&!isDone&&!isNA?600:400,
                          lineHeight:'1.35', marginBottom: step.inputType?3:0}}
                          title={step.task}>
                          {step.critical&&!isDone&&!isNA&&<span style={{color:'#2D2D2D',marginRight:3}}>*</span>}
                          {step.task}
                        </div>
                        {/* Text input field */}
                        {step.inputType==='text' && !isNA && (
                          <input value={fieldVal}
                            onChange={e=>!isCancelled&&setStepField(step.inputKey,e.target.value,step.id)}
                            onClick={e=>e.stopPropagation()}
                            placeholder={`输入${step.task}…`}
                            style={{width:'100%',fontSize:11,border:'2px solid #2D2D2D',
                              borderRadius:12,padding:'3px 8px',outline:'none',fontFamily:'inherit',
                              boxSizing:'border-box',background:fieldVal?'#A8E6CF':'white',color:'#2D2D2D'}}/>
                        )}
                        {/* Select field */}
                        {step.inputType==='select' && !isNA && (
                          <div style={{display:'flex',gap:3,flexWrap:'wrap',marginTop:2}}>
                            {(step.inputOptions||[]).map(opt=>(
                              <button key={opt} onClick={e=>{e.stopPropagation();!isCancelled&&setStepField(step.inputKey,fieldVal===opt?'':opt,step.id);}}
                                style={{fontSize:10,padding:'2px 8px',borderRadius:12,cursor:isCancelled?'default':'pointer',
                                  background:fieldVal===opt?'#FDE68A':step.inputType?'#F5F0E6':'#F5F0E6',
                                  color:'#2D2D2D',
                                  border:fieldVal===opt?'none':'2px solid #2D2D2D',
                                  fontWeight:fieldVal===opt?700:400}}>{opt}</button>
                            ))}
                          </div>
                        )}
                        {/* Approval sign-off (compact) */}
                        {step.inputType==='approval' && !isNA && (()=>{
                          const signed = (record.approvals||{})[step.inputKey] || {};
                          const approvers = step.inputOptions||[];
                          const nSigned = approvers.filter(n=>signed[n]).length;
                          return (
                            <div style={{marginTop:3}} onClick={e=>e.stopPropagation()}>
                              <div style={{fontSize:10,fontWeight:700,color:'#2D2D2D',marginBottom:3}}>会签 {nSigned}/{approvers.length}{nSigned===approvers.length?' 🔓已通过':''}</div>
                              <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                                {approvers.map(name=>{
                                  const at=signed[name];
                                  return (
                                    <button key={name} onClick={()=>!isCancelled&&toggleApproval(step.inputKey,name,approvers,step.id)}
                                      title={at?('已签字：'+new Date(at).toLocaleString('zh-CN')):'点击签字'}
                                      style={{fontSize:10,padding:'2px 7px',borderRadius:99,cursor:isCancelled?'default':'pointer',
                                        border:`${(at) ? '3px' : '2px'} solid #2D2D2D`,background:at?'#A8E6CF':'white',
                                        color:'#2D2D2D',fontWeight:at?700:400}}>
                                      {at?'✅':'⭕'} {name}
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })()}
                        {(step.contact||step.owner)&&<div style={{fontSize:10,marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                          {step.contact
                            ? <span style={{color:'#2D2D2D',fontWeight:600}}>@{step.contact.split('\n').join(' / ').replace(/\s*\/\s*/g,' / ')}</span>
                            : null}
                          {step.contact&&step.owner ? <span style={{color:'#6B6B6B'}}>　·　{step.owner}</span> : null}
                          {!step.contact&&step.owner ? <span style={{color:'#6B6B6B'}}>{step.owner}</span> : null}
                        </div>}
                      </div>
                      {/* N/A */}
                      <button onClick={e=>{e.stopPropagation();!isCancelled&&toggleNA(step.id);}}
                        style={{background:isNA?'#F5F0E6':'transparent',border:isNA?'none':'2px solid #2D2D2D',
                          borderRadius:12,padding:'2px 5px',fontSize:10,cursor:isCancelled?'default':'pointer',
                          color:isNA?'#2D2D2D':'#6B6B6B',fontWeight:isNA?700:400,flexShrink:0}}>
                        N/A
                      </button>
                      {/* Note */}
                      <button onClick={e=>{e.stopPropagation();setEditingStepNote(isEditN?null:step.id);setStepNoteVal(stepNotes[step.id]||'');}}
                        style={{background:hasNote?'#FDE68A':'transparent',border:hasNote?'2px solid #2D2D2D':'2px solid #2D2D2D',
                          borderRadius:12,padding:'2px 5px',fontSize:10,cursor:'pointer',
                          color:hasNote?'#2D2D2D':'#6B6B6B',flexShrink:0}}>
                        📝
                      </button>
                    </div>
                    {/* Note editor */}
                    {isEditN && (
                      <div style={{padding:'4px 14px 8px 38px',background:'#FDE68A'}}>
                        <input autoFocus value={stepNoteVal} onChange={e=>setStepNoteVal(e.target.value)}
                          onKeyDown={e=>{if(e.key==='Enter')saveStepNote(step.id);if(e.key==='Escape')setEditingStepNote(null);}}
                          placeholder="添加备注..."
                          style={{width:'100%',fontSize:11,border:'2px solid #2D2D2D',borderRadius:12,padding:'4px 8px',outline:'none',fontFamily:'inherit',boxSizing:'border-box'}}/>
                        <div style={{display:'flex',gap:4,marginTop:4}}>
                          <button onClick={()=>saveStepNote(step.id)} style={{background:'#FDE68A',color:'#2D2D2D',border:'3px solid #2D2D2D',borderRadius:12,padding:'3px 10px',fontSize:11,cursor:'pointer',fontWeight:600, boxShadow:'3px 3px 0 #2D2D2D'}}>保存</button>
                          <button onClick={()=>setEditingStepNote(null)} style={{background:'none',border:'2px solid #2D2D2D',borderRadius:12,padding:'3px 8px',fontSize:11,cursor:'pointer',color:'#6B6B6B'}}>取消</button>
                        </div>
                      </div>
                    )}
                    {/* Saved note */}
                    {!isEditN&&hasNote&&(
                      <div style={{padding:'2px 14px 5px 38px',fontSize:10,color:'#2D2D2D',background:'#FDE68A'}}>📌 {stepNotes[step.id]}</div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function OverviewTable({ records, onOpen, onUpdate, onNew, onImport, onDelete, onRestore, onCopy, siteFilter }) {
  const [editingCell, setEditingCell] = useState(null); // {id, field}
  const [cellVal, setCellVal] = useState('');
  const [blockerModal, setBlockerModal] = useState(null); // {r, val}

  const [searchQ, setSearchQ] = useState('');
  const [panelId, setPanelId] = useState(null);
  const [panelPhase, setPanelPhase] = useState(null);
  const [tableSearch, setTableSearch] = useState('');
  const [statusFilt, setStatusFilt] = useState('all');
  const panelRecord = panelId ? records.find(r=>r.id===panelId) : null;

  // Dropdown data
  const QUOTE_OPTIONS_ALL = ['USD','USDT','USDC','BTC','HKD','IDR','USDGO','RLUSD','AUSD','不涉及'];
  const CHAIN_OPTIONS = ['ERC20','BTC','TRC20','BEP20','Solana','Polygon','Avalanche','Arbitrum','Base','TON','XRP Ledger','Morph','ERC20/SOL','PLUME & ERC20','POL','BSC','Cardano','Injective','Toncoin','Litecoin','Sui','不上链'];
  const SITE_OPTIONS = [
    {id:'HK',     label:'OSL HK',    icon:'🇭🇰', bg:'#A8D8F0', color:'#2D2D2D'},
    {id:'Global', label:'Global',    icon:'🌐', bg:'#7ECDC0', color:'#2D2D2D'},
    {id:'ID',     label:'OSL ID',    icon:'🇮🇩', bg:'#D4A5E8', color:'#2D2D2D'},
    {id:'SG',     label:'SG',        icon:'🇸🇬', bg:'#A8E6CF', color:'#2D2D2D'},
  ];
  const PRODUCT_OPTIONS = ['Orderbook','RFQ','OTC','仅上链','StableHub','Launchpool','下币','理财代币-3CP','理财代币-托管类','WealthToken'];

  const SS = {
    in_progress: { bg:'#FDE68A', color:'#2D2D2D', label:'进行中' },
    not_started: { bg:'#F5F0E6', color:'#6B6B6B', label:'未开始' },
    completed:   { bg:'#A8E6CF', color:'#2D2D2D', label:'已完成' },
    cancelled:   { bg:'#F5F0E6', color:'#6B6B6B', label:'已取消' },
  };
  const SITE_S = { HK:{bg:'#A8D8F0',color:'#2D2D2D'}, Global:{bg:'#7ECDC0',color:'#2D2D2D'}, ID:{bg:'#D4A5E8',color:'#2D2D2D'}, SG:{bg:'#A8E6CF',color:'#2D2D2D'} };
  const USER_TYPES = ['PI（专业投资者）','零售 Retail','两者','不适用'];

  const save = (r, patch) => onUpdate({...r, ...patch, updatedAt:new Date().toISOString()});
  const stopEdit = () => setEditingCell(null);

  const STATUS_RANK = { in_progress:0, not_started:1, completed:2, cancelled:3 };
  const allRows = records
    .filter(r => !siteFilter || r.site===siteFilter)
    .filter(r => {
      if (!tableSearch) return true;
      const q = tableSearch.toLowerCase();
      return (r.tokenName||'').toLowerCase().includes(q)
          || (r.tokenSymbol||'').toLowerCase().includes(q)
          || (r.blocker||'').toLowerCase().includes(q)
          || (r.chainRaw||'').toLowerCase().includes(q);
    })
    .filter(r => {
      if (statusFilt==='all') return true;
      const cl = buildChecklist(r.site,r.product,r.tokenType,{stableHub:r.stableHub,launchpool:r.launchpool});
      return getRecordStatus(r,cl)===statusFilt;
    })
    .sort((a,b) => {
      const clA = buildChecklist(a.site,a.product,a.tokenType,{stableHub:a.stableHub,launchpool:a.launchpool});
      const clB = buildChecklist(b.site,b.product,b.tokenType,{stableHub:b.stableHub,launchpool:b.launchpool});
      const rA = STATUS_RANK[getRecordStatus(a,clA)]??99;
      const rB = STATUS_RANK[getRecordStatus(b,clB)]??99;
      if (rA !== rB) return rA - rB;
      // Within same status: sort by expectedLaunchTime asc (nulls last)
      const ta = a.expectedLaunchTime ? new Date(a.expectedLaunchTime) : null;
      const tb = b.expectedLaunchTime ? new Date(b.expectedLaunchTime) : null;
      if (ta && tb) return ta - tb;
      if (ta) return -1;
      if (tb) return 1;
      return new Date(b.updatedAt)-new Date(a.updatedAt);
    });

  // Split into upcoming (≤7 working days, not completed/cancelled) and rest
  // 7 个工作日内要上的，加上已经过了预计时间但还没做完的——过期的必须继续留在这里，
  // 掉到下面的"其他记录"里就看不见了，会忘。
  const upcoming = allRows.filter(r => {
    if (!r.expectedLaunchTime) return false;
    const st = getRecordStatus(r, buildChecklist(r.site,r.product,r.tokenType,{stableHub:r.stableHub,launchpool:r.launchpool}));
    if (st==='completed'||st==='cancelled') return false;
    return workingDaysUntil(r.expectedLaunchTime) <= 7;   // -1 表示今天或已经过了
  }).sort((x,y) => {
    const ox = overdueDays(x.expectedLaunchTime), oy = overdueDays(y.expectedLaunchTime);
    if (ox != null && oy == null) return -1;              // 过期的排最上面
    if (ox == null && oy != null) return 1;
    if (ox != null && oy != null) return oy - ox;         // 过期越久越靠前
    return new Date(x.expectedLaunchTime) - new Date(y.expectedLaunchTime);
  });
  const overdueCount = upcoming.filter(r => (overdueDays(r.expectedLaunchTime) || 0) > 0).length;
  const rest = allRows.filter(r => !upcoming.find(u=>u.id===r.id));
